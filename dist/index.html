 environments (dev/test/prod) for data — including test data strategies and anonymization?", "a": "Environment strategy: isolated dev/test/prod (separate workspaces/subscriptions), config-driven pointing (same code, different targets), prod-like test data via subsetted and anonymized copies or synthetic data — never raw PII in lower environments — and promotion only through CI/CD, never manual edits in prod."}, {"n": 26, "q": "How do you make pipelines restartable and rerunnable safely after partial failure?", "a": "Restartability: break pipelines into idempotent, individually rerunnable steps; persist state (watermarks, processed-file logs) transactionally with the data; make steps skip-if-done via run manifests; scope reruns to the failed step and interval rather than whole-pipeline replays. Test the restart path — an untested recovery procedure doesn't exist."}, {"n": 27, "q": "What are backfills, how do you design for them from day one, and what makes them dangerous?", "a": "Backfills reprocess history through current logic. Design for them upfront: parameterize every task by data interval, keep raw data (Bronze) forever-ish, make writes idempotent per interval, and throttle backfill parallelism. Dangers: overwhelming sources/warehouse, mixing logic versions across history, and triggering downstream side effects (emails, exports) for historical runs."}, {"n": 28, "q": "How do you reconcile and validate data between source and target (row counts, hash totals, sampling, financial reconciliation)?", "a": "Reconciliation levels: row counts per load window; hash/sum totals of measures (financial reconciliation to the cent for money data); distinct key counts; sampled row-level comparison; and EXCEPT-based exact diffs for certification. Automate as post-load assertions with logged results and thresholds — reconciliation is the proof your pipeline tells the truth."}, {"n": 29, "q": "What is orchestration vs choreography (scheduler-driven vs event-driven pipelines)?", "a": "Orchestration: a central scheduler (Airflow) explicitly sequences work — visible, controllable, single pane. Choreography: components react to events (file arrival, dataset updated) without a central brain — loosely coupled, scales organizationally, harder to trace end-to-end. Modern platforms blend: event-driven ingestion, orchestrated transformation."}, {"n": 30, "q": "Batch vs streaming vs micro-batch: how do you choose based on latency requirements and cost?", "a": "Choose by latency requirement honestly: batch (hours/daily) for most reporting — cheapest, simplest; micro-batch (minutes) when 'near-real-time' means minutes — Structured Streaming/frequent triggers; true streaming (seconds) only for operational use cases (alerting, tracking) that act on events immediately. Streaming's complexity and cost need a business case, not a fashion statement."}, {"n": 31, "q": "What is the Lambda vs Kappa architecture debate, and how do lakehouses change it?", "a": "Lambda ran parallel batch and speed layers (accurate + fast) at the cost of dual codebases; Kappa said stream everything, replaying the log for reprocessing. Lakehouses largely dissolve the debate: one Delta table serves batch and streaming reads/writes, and incremental engines (Structured Streaming, CDF) give Kappa-like unification with batch simplicity."}, {"n": 32, "q": "What file formats do you choose and why (Parquet, Avro, ORC, JSON, CSV) — schema, splittability, compression?", "a": "Parquet: columnar, compressed, splittable, schema-rich — the analytics default. Avro: row-based with strong schema evolution — streaming/Kafka and write-heavy landing. ORC: Parquet's Hive-world sibling. JSON: flexible interchange, expensive to scan — landing only. CSV: universal but schema-less and fragile — ingest, then convert. Choose columnar for reading, row for streaming/writing."}, {"n": 33, "q": "Why do small files hurt distributed systems, and what compaction strategies exist?", "a": "Every file carries per-task and per-metadata overhead: listings, open/close, scheduler tasks, memory for footers. Thousands of KB-sized files can make a small dataset slower than a huge one. Prevent via optimized writes and sensible partitioning; cure via compaction (OPTIMIZE, rewrite jobs) on a schedule tied to write patterns."}, {"n": 34, "q": "How do you choose partitioning strategies for storage vs the anti-pattern of over-partitioning?", "a": "Partition storage by the dominant filter with low-to-moderate cardinality — usually date — targeting partitions of at least hundreds of MB. Over-partitioning (by high-cardinality IDs or multi-column explosions) creates millions of tiny files and metadata pain. Modern alternative: liquid clustering/Z-order data skipping instead of physical partitions for secondary keys."}, {"n": 35, "q": "What is late-binding vs early-binding of schema (schema-on-read vs schema-on-write)?", "a": "Schema-on-write validates and types data at load (warehouses) — early failure, trustworthy reads. Schema-on-read applies schema at query time (lakes) — flexible landing, deferred pain. Lakehouse practice: schema-on-read at Bronze (accept everything, rescue anomalies), schema-on-write from Silver (Delta enforcement) — flexibility at the edge, contracts inside."}, {"n": 36, "q": "How do you document a data platform so it survives team turnover (READMEs, ADRs, model docs, runbooks)?", "a": "Documentation that survives turnover: READMEs per repo (purpose, setup, run), architecture decision records (why choices were made), model/column docs generated from code (dbt docs), runbooks per pipeline (failure modes, recovery steps), and ownership metadata in the catalog. Documentation adjacent to code stays alive; wikis rot."}, {"n": 37, "q": "What are SLAs, SLOs, and SLIs for data products, and how do you measure pipeline reliability?", "a": "SLA: the promise to consumers ('Gold refreshed by 07:00, 99.5% of days'). SLO: internal target backing it (pipeline completes by 06:30). SLI: the measured indicator (actual completion time, freshness lag, test pass rate). Measure and publish them — reliability becomes a managed number instead of vibes."}, {"n": 38, "q": "How do you estimate and optimize cloud costs for data workloads (compute right-sizing, storage tiers, query patterns)?", "a": "Cost optimization: right-size and auto-terminate compute, job-scoped clusters, spot for fault-tolerant batch, storage lifecycle tiers for cold data, prune unused pipelines and tables (usage telemetry), incremental over full recomputes, pushdown-friendly file layouts, and per-team cost attribution via tags — visibility first, then targeted fixes on the top spenders."}, {"n": 39, "q": "What is DataOps and how does it borrow from DevOps?", "a": "DataOps applies DevOps to data: version control, CI/CD, automated testing, monitoring, and collaborative ownership of the path from raw data to consumption — shortening cycle time from 'analyst asks' to 'trusted data ships' while raising reliability. Culture and process as much as tooling."}, {"n": 40, "q": "What is a data mesh (domain ownership, data as a product, self-serve platform, federated governance) and what are its critiques?", "a": "Data mesh: domains own their data as products (discoverable, documented, quality-assured), on a self-serve platform, under federated governance standards. Critiques: demands org maturity and duplicated skills in every domain, risks inconsistency without strong federation, and is overkill below a certain scale — many orgs need good central platform engineering, not mesh."}, {"n": 41, "q": "What is the role of a metadata-driven / config-driven framework in scaling ingestion across hundreds of sources?", "a": "Metadata-driven frameworks store source definitions (connection, object, watermark column, load type, targets) in control tables; generic parameterized pipelines loop the config. Onboarding source #200 is a config row plus tests, not new code — consistency, scale, and centralized fixes, at the cost of framework complexity to maintain."}, {"n": 42, "q": "How do you handle secrets, keys, and service principals in pipelines securely?", "a": "Secrets: store in a vault (Key Vault) referenced at runtime; prefer managed identities over static secrets entirely; scope service principals narrowly per pipeline; rotate on schedule; never in code, configs in Git, notebook outputs, or logs; scan repos for leaked credentials in CI."}, {"n": 43, "q": "What is your approach to error handling: dead-letter queues, quarantine tables, retry policies, and poison messages?", "a": "Error handling tiers: transient errors retry with backoff; malformed records route to dead-letter/quarantine tables with error context (never silently dropped, never blocking the batch); poison messages (repeatedly failing) get isolated and alerted after N attempts; systemic failures fail fast and page. Every path logs counts so error volume is itself monitored."}, {"n": 44, "q": "How do you ensure ordering and deduplication when ingesting from message queues or APIs?", "a": "Queue/API ingestion: dedupe on producer-provided IDs or content hashes into an idempotent sink (MERGE); tolerate out-of-order by processing on event time with lateness windows, not arrival order; track per-partition offsets/cursors transactionally with the data write so 'processed' and 'stored' can't diverge."}, {"n": 45, "q": "How do you design an API ingestion pipeline (pagination, rate limits, incremental cursors, auth token refresh)?", "a": "API ingestion design: incremental cursors (updated_since) persisted per entity; pagination loops honoring next tokens; retries with exponential backoff and jitter honoring 429/Retry-After; token refresh handling; response schema validation; raw payload landing to Bronze for replay; and rate budgeting so backfills don't exhaust quotas needed by daily loads."}, {"n": 46, "q": "What is the difference between a data lake, data warehouse, and lakehouse — and is the distinction disappearing?", "a": "A lake stores cheap raw files (flexible, ungoverned by default); a warehouse stores governed, performant relational data (rigid, historically expensive). The lakehouse gives warehouse semantics (ACID, SQL, governance) on lake storage via table formats (Delta/Iceberg). The distinction is genuinely collapsing — the battleground now is catalogs and engines, not storage paradigms."}, {"n": 47, "q": "How do you performance-test a pipeline before production (volume testing, worst-case data, soak tests)?", "a": "Pre-production performance testing: run with production-scale volumes (cloned or synthetic), worst-case shapes (skewed keys, wide rows, late data bursts), concurrent load (competing jobs, BI queries), and soak tests for streaming (hours, watching state growth and memory). Capacity headroom targets and degradation behavior get decided before go-live, not during the first month-end."}, {"n": 48, "q": "What does 'shift-left data quality' mean?", "a": "Shift-left quality: validate as close to the producer as possible — contracts and checks at ingestion rather than discovering breakage in dashboards. The earlier a defect is caught, the cheaper: a rejected file at landing costs minutes; a wrong executive KPI costs trust."}, {"n": 49, "q": "How do you plan a migration/re-platforming (strangler pattern, parallel run, reconciliation, cutover criteria)?", "a": "Migration playbook: inventory and prioritize by value/complexity; build the target landing zone and one thin end-to-end slice first (prove the path); strangler pattern — migrate pipeline by pipeline while legacy runs; parallel-run with automated reconciliation per migrated asset; define cutover criteria (N clean parallel days); keep rollback until stability; retire legacy explicitly with dates."}, {"n": 50, "q": "Describe your framework for root-cause analysis when a stakeholder reports wrong numbers in a dashboard fed by a multi-hop pipeline.", "a": "RCA framework: reproduce and scope the wrongness (which metric, since when, how big); trace lineage backwards layer by layer comparing values at each hop (Gold → Silver → Bronze → source) to localize the divergence point; identify the change that coincided (deploy, schema drift, data anomaly, logic edge case); fix forward with a test that would have caught it; write the postmortem — the goal is class-elimination, not just incident closure."}]}, {"id": "azure", "name": "Azure (Data Platform)", "questions": [{"n": 1, "q": "Map the Azure data landscape: ADLS Gen2, ADF, Synapse, Databricks, Fabric, SQL Database, Event Hubs, Stream Analytics — what role does each play?", "a": "ADLS Gen2: the lake storage foundation. ADF: ingestion/orchestration. Databricks: Spark lakehouse compute. Synapse: previous-gen integrated analytics (dedicated/serverless SQL + Spark). Fabric: the current SaaS unification (successor direction). Azure SQL family: operational databases. Event Hubs: streaming ingestion. Stream Analytics: SQL-on-streams. Together: sources → ingestion → lake → transform → serve → BI."}, {"n": 2, "q": "What is ADLS Gen2 and how does hierarchical namespace differ from flat Blob storage? Why does it matter for analytics?", "a": "ADLS Gen2 is Blob storage with hierarchical namespace: real directories with atomic renames and POSIX-style ACLs. Analytics engines need directory semantics (partition layouts, atomic commit protocols) — flat blob emulation of folders makes renames O(n) copies and breaks efficient partition operations."}, {"n": 3, "q": "Explain storage account concepts: containers, access tiers (hot/cool/archive), redundancy options (LRS/ZRS/GRS/GZRS).", "a": "Storage accounts contain containers (filesystems) holding blobs/files. Access tiers trade storage vs access cost: hot (frequent), cool (30+ days), cold/archive (rare, retrieval latency). Redundancy: LRS (3 copies, one datacenter), ZRS (across zones), GRS/GZRS (paired-region async copies) — choose per data criticality and DR requirements."}, {"n": 4, "q": "How do you secure ADLS Gen2: RBAC vs ACLs vs SAS tokens vs access keys — and how do they interact?", "a": "Security layers: Azure RBAC grants coarse roles at account/container scope (Storage Blob Data Reader/Contributor); ACLs refine per directory/file (POSIX rwx, default ACLs for inheritance); SAS tokens delegate scoped, time-boxed access; access keys are root credentials — disable or vault them. Evaluation: RBAC first, then ACLs; prefer identity-based (RBAC/ACL) over shared-key mechanisms."}, {"n": 5, "q": "What are managed identities (system vs user-assigned) and why are they preferred over service principals with secrets?", "a": "Managed identities are Azure-managed service principals bound to resources (ADF, Databricks connector, VMs) — no secrets to store, rotate, or leak; authentication happens via the platform. System-assigned lives with one resource; user-assigned is shareable across resources. Default to managed identity wherever the service supports it."}, {"n": 6, "q": "What is a service principal and how does an app authenticate to Azure resources (Entra ID / OAuth)?", "a": "A service principal is an application identity in Entra ID with a secret/certificate, granted roles like any user. Apps authenticate via OAuth client-credentials flow to get tokens for Azure resources. Use where managed identity isn't possible (external apps, some tools); scope narrowly and rotate credentials."}, {"n": 7, "q": "What is Azure Key Vault and how do pipelines/notebooks retrieve secrets from it?", "a": "Key Vault centrally stores secrets, keys, and certificates with access policies/RBAC and audit logs. ADF references vault secrets in linked services; Databricks uses AKV-backed secret scopes; apps fetch at runtime via managed identity — rotation happens in one place and nothing sensitive lives in code or configs."}, {"n": 8, "q": "What is Azure Data Factory? Explain pipelines, activities, datasets, linked services, and triggers.", "a": "ADF is Azure's data integration service: pipelines (orchestration containers) of activities (copy, transform, control flow), datasets (data shape references), linked services (connections), and triggers (schedule/tumbling/event). It moves and orchestrates; heavy transformation is delegated to compute (Databricks, SQL, data flows)."}, {"n": 9, "q": "What is an Integration Runtime (Azure IR, self-hosted IR, SSIS IR) and when do you need a self-hosted IR?", "a": "Integration runtime is ADF's compute for connectivity: Azure IR for cloud-to-cloud (managed, serverless), self-hosted IR installed on your VMs for private network/on-prem sources (outbound-only connection — no inbound firewall holes), SSIS IR to lift-and-shift SSIS packages. Private sources = SHIR or managed VNet with private endpoints."}, {"n": 10, "q": "How does the ADF Copy activity work (source/sink, staging, parallel copies, DIUs) and how do you tune it?", "a": "Copy activity moves data source→sink with format conversion: parallel copies partition the read, DIUs scale cloud compute, staged copy bounces via blob when direct paths are unsupported or for PolyBase loading. Tune via partition options on the source, DIU/parallelism settings, and file sizing; watch the throughput metrics per run."}, {"n": 11, "q": "How do you build metadata-driven ingestion in ADF (Lookup + ForEach + parameterized datasets)?", "a": "Metadata-driven ADF: a control table lists sources/objects/watermarks; a Lookup activity reads it, ForEach iterates rows, and parameterized datasets/linked services execute generic copy logic per entry. Hundreds of tables ingest through one pipeline; onboarding is a config row — the standard enterprise ingestion pattern."}, {"n": 12, "q": "What are ADF trigger types (schedule, tumbling window, event-based/storage events) and how do tumbling windows support backfills and dependencies?", "a": "Schedule triggers fire on wall-clock cadence; tumbling window triggers fire per contiguous interval with state — supporting dependencies between windows, retries per window, and backfill of past windows (the batch-correctness choice); event triggers fire on blob arrival/deletion for event-driven ingestion. Windowed loads = tumbling; files landing = event."}, {"n": 13, "q": "How do you implement incremental copy in ADF (watermark pattern, CDC connectors)?", "a": "ADF incremental: persist a watermark (max modified date/ID) in a control table; pipeline reads old watermark, copies rows beyond it, updates watermark on success — all transactional in sequence. For supported sources, native CDC/incremental connectors in ADF handle change tracking without custom watermark logic."}, {"n": 14, "q": "How do Mapping Data Flows in ADF work and when would you use them vs Databricks?", "a": "Mapping Data Flows are visual Spark transformations ADF compiles and runs on managed clusters — joins, derived columns, SCD patterns without code. Use for low-code teams and moderate complexity; choose Databricks when you need full code control, testing, complex logic, or better price-performance at scale."}, {"n": 15, "q": "How do you call Databricks notebooks/jobs from ADF and pass parameters both ways?", "a": "ADF calls Databricks via Notebook/Jar/Python activities against a linked service (job clusters recommended): pass parameters as base parameters (read via dbutils.widgets), return values via dbutils.notebook.exit captured in activity output. Modern alternative: trigger Databricks Workflows via REST/Jobs activity for richer job features."}, {"n": 16, "q": "How does ADF handle errors: activity retry, failure paths, Until/If activities, and pipeline-level alerts?", "a": "ADF error handling: per-activity retry counts/intervals for transient issues; failure dependency paths (red arrows) route to cleanup/notification activities; If/Until implement conditional and polling logic; pipeline outcome alerts via Azure Monitor or a dedicated notification pipeline (Logic App/webhook for Teams)."}, {"n": 17, "q": "How do you do CI/CD for ADF (Git integration, ARM templates vs the new CI/CD flow, parameterizing linked services per environment)?", "a": "ADF CI/CD: Git-integrated authoring (feature branches, PRs to main); publishing generates ARM templates — classic flow deploys ARM to test/prod with parameter overrides (linked service URLs, Key Vault references per environment); the newer npm-based build validates/exports without manual publish. Deploy via Azure DevOps pipelines with approvals."}, {"n": 18, "q": "What is Azure Synapse Analytics? Differentiate dedicated SQL pools, serverless SQL pools, and Spark pools.", "a": "Synapse bundles dedicated SQL pools (provisioned MPP warehouse), serverless SQL (pay-per-query over lake files), Spark pools, and pipelines in one workspace. Dedicated for reserved, tuned warehouse capacity; serverless for exploratory/lake queries; Spark for engineering — now largely succeeded by Fabric for new builds."}, {"n": 19, "q": "How does a dedicated SQL pool distribute data (hash, round-robin, replicated) and why does distribution key choice matter?", "a": "Dedicated pools shard data across 60 distributions: hash distribution co-locates rows by key (large facts — pick a high-cardinality, join-heavy, skew-free key), round-robin spreads evenly (staging), replicated copies small tables to every node (dimensions). Wrong distribution = data movement (shuffle) on every join — the #1 Synapse performance factor."}, {"n": 20, "q": "When do you use Synapse serverless SQL over files vs loading into a database?", "a": "Serverless SQL suits ad-hoc exploration of lake files, logical layers over curated Parquet/Delta (views for Power BI), and infrequent access patterns — zero infrastructure, per-TB-scanned pricing. Load into a database (dedicated/Fabric) when queries are frequent, latency-sensitive, or need warehouse features — repeated scans of large data get expensive."}, {"n": 21, "q": "What is PolyBase / COPY INTO for loading data into Synapse?", "a": "PolyBase and COPY INTO bulk-load external files into dedicated pools: COPY INTO is the simpler, recommended T-SQL (auth options, error handling, format flexibility); PolyBase uses external tables — both parallelize across distributions, vastly outperforming row-based inserts for lake-to-warehouse loading."}, {"n": 22, "q": "How does Fabric relate to Synapse and ADF — what is Microsoft's direction and how do you advise a company choosing today?", "a": "Fabric is the strategic successor: Synapse workloads map to Fabric equivalents (Warehouse, Spark, RTI) on OneLake with Power BI unified. Advice today: new greenfield analytics → Fabric (or Databricks for code-heavy estates); existing Synapse → plan gradual migration (shortcuts to existing ADLS ease it); ADF remains supported with Fabric pipelines as the evolution path."}, {"n": 23, "q": "What is Azure SQL Database vs SQL Managed Instance vs SQL Server on VM — how do you choose?", "a": "Azure SQL Database: PaaS single databases, auto-patched, elastic — default for new apps. Managed Instance: near-full SQL Server surface (cross-DB queries, SQL Agent, CLR) — lift-and-shift from on-prem. SQL on VM: full control including OS — only when you need features/licensing PaaS can't offer. Choose the most managed tier your compatibility allows."}, {"n": 24, "q": "What are DTU vs vCore models, and what are elastic pools?", "a": "DTU bundles compute/IO/memory into abstract units (simple, capped); vCore separates cores/memory/storage with reserved pricing and hybrid benefit (transparent, scalable — the modern default). Elastic pools share capacity across many variable-usage databases — cost-efficient for SaaS-style fleets of small DBs."}, {"n": 25, "q": "What HA/DR options exist for Azure SQL (zone redundancy, failover groups, geo-replication, backups/PITR)?", "a": "Azure SQL HA/DR: built-in local redundancy with automatic failover; zone redundancy spreads replicas across AZs; failover groups provide cross-region async replicas with listener endpoints (apps reconnect transparently); PITR backups (up to 35 days) plus long-term retention. Design to your RPO/RTO — zone for HA, geo for regional disaster."}, {"n": 26, "q": "What is Azure Event Hubs vs Service Bus vs Event Grid — messaging patterns for data platforms?", "a": "Event Hubs: high-throughput event streaming (Kafka-compatible) with partitioned consumers and retention — telemetry/log ingestion. Service Bus: enterprise messaging — queues/topics with transactions, ordering, dead-lettering — commands and workflows. Event Grid: lightweight pub/sub for discrete events (blob created) with push delivery — reactive automation. Streams vs messages vs events."}, {"n": 27, "q": "How would you build a streaming ingestion path in Azure (Event Hubs → Stream Analytics/Databricks/Fabric RTI → serving)?", "a": "Streaming path: producers → Event Hubs (partitioned buffer) → processing via Stream Analytics (SQL windows, simple), Databricks Structured Streaming (complex logic, Delta sinks), or Fabric Eventstream→Eventhouse (KQL analytics) → serve to real-time dashboards/alerts and land to the lakehouse for history. Choose the processor by logic complexity and team skills."}, {"n": 28, "q": "What is Azure Stream Analytics and what are its windowing functions (tumbling, hopping, sliding, session)?", "a": "Stream Analytics runs SQL over streams with temporal windows: tumbling (fixed, non-overlapping), hopping (fixed, overlapping), sliding (event-triggered continuous), session (activity-gap-based) — aggregating per device/key per window from Event Hubs/IoT Hub into sinks like Power BI, SQL, or storage."}, {"n": 29, "q": "What are Azure Functions and Logic Apps, and where do they fit in data workflows (lightweight triggers, notifications, APIs)?", "a": "Azure Functions: serverless code on triggers (HTTP, timer, blob, queue) — lightweight ingestion shims, API endpoints, event-driven glue. Logic Apps: visual workflow automation with hundreds of connectors — approvals, notifications, SaaS integration. In data platforms: Functions for custom event handling, Logic Apps for human/SaaS workflow edges around pipelines."}, {"n": 30, "q": "What is Microsoft Purview and how does it deliver scanning, classification, lineage, and glossary across the estate?", "a": "Purview provides estate-wide governance: automated scanning and classification (PII detection) across Azure/on-prem/M365, a searchable catalog with business glossary, lineage across ADF/Synapse/Power BI, sensitivity labels, and access policies — the compliance and discovery layer above individual services."}, {"n": 31, "q": "How do private endpoints, VNets, and managed VNets secure data services? What is the problem with public endpoints?", "a": "Private endpoints give services private IPs inside your VNet so traffic never crosses public internet; managed VNets (ADF/Synapse) isolate service compute with managed private endpoints to sources. Public endpoints expose services to internet-reachable attack surface — enterprise posture: private endpoints + disabled public access + firewall exceptions only where unavoidable."}, {"n": 32, "q": "What is Azure Monitor / Log Analytics / KQL and how do you monitor ADF and Databricks with it?", "a": "Azure Monitor collects platform metrics/logs; Log Analytics stores them queryable via KQL; diagnostic settings route ADF pipeline runs, Databricks logs, and SQL telemetry there. Build KQL alerts and workbooks: pipeline failure rates, activity durations, capacity trends — one query layer across the whole platform."}, {"n": 33, "q": "How do you set up alerting on pipeline failures and cost anomalies in Azure?", "a": "Alerting setup: ADF diagnostic logs to Log Analytics with KQL alert rules (failed pipeline runs by name/severity) → action groups (email, Teams webhook, PagerDuty); Cost Management budgets with threshold alerts and anomaly detection for spend spikes; metric alerts on capacity/DTU saturation before users feel it."}, {"n": 34, "q": "How does Azure DevOps fit your workflow: repos, branching strategy, build/release pipelines, YAML pipelines for data projects?", "a": "Azure DevOps for data teams: Repos with branch policies (PR reviews, build validation), Boards for work tracking, YAML Pipelines building/testing (lint, unit tests, dbt slim CI) and deploying (ARM/Bicep, Databricks bundles, ADF publishes) through environment stages with approvals — the delivery backbone for everything-as-code."}, {"n": 35, "q": "How do you manage IaC for a data platform on Azure (Bicep/Terraform) — what resources do you template?", "a": "IaC for a data platform templates: resource groups, storage accounts (containers, lifecycle, network rules), Key Vaults and access, ADF/Databricks workspaces, Unity Catalog/metastore bindings, private endpoints/DNS, Log Analytics and diagnostics, RBAC assignments. Environments differ only by parameter files; humans stop clicking resources into existence."}, {"n": 36, "q": "What are resource groups, subscriptions, and management groups — how do you organize a data estate?", "a": "Hierarchy: management groups apply policy/RBAC across subscriptions; subscriptions are billing/isolation boundaries (commonly per environment: dev/test/prod); resource groups bundle same-lifecycle resources (a data platform's storage+ADF+Databricks per environment). Governance (Azure Policy, cost, access) inherits downward — structure it before sprawl."}, {"n": 37, "q": "How do you implement cost management: budgets, tags, Azure Advisor, reserved capacity/savings plans?", "a": "Cost management: tag everything (team, project, environment) for attribution; budgets with alerts per subscription/RG; Azure Advisor recommendations; reservations/savings plans for steady compute; storage lifecycle policies; periodic reviews of orphaned resources (unattached disks, idle clusters, forgotten test environments) — the cheapest workload is the one you deleted."}, {"n": 38, "q": "What networking issue commonly breaks self-hosted IR or Databricks-to-source connectivity, and how do you debug it?", "a": "Common connectivity break: private networking — SHIR VM can't reach the source (NSG/firewall rules, DNS not resolving private endpoints, proxy interference) or Databricks can't reach storage (missing private endpoint approval, wrong DNS zone). Debug: test name resolution and port connectivity from the compute (nslookup, Test-NetConnection), check effective NSG rules, private endpoint approvals, and firewall logs — it's almost always DNS or an NSG."}, {"n": 39, "q": "How do you copy on-premises SQL Server data to ADLS securely — walk through components and auth end to end.", "a": "On-prem SQL → ADLS securely: install self-hosted IR on a server with line-of-sight to SQL (outbound 443 only); linked service authenticates via Key Vault-stored credentials (or Windows auth); copy activity writes Parquet to ADLS via managed identity/service principal with Storage Blob Data Contributor scoped to the landing container; storage locked to private endpoints/firewall; watermark table drives incrementals; diagnostics to Log Analytics."}, {"n": 40, "q": "What is Azure Container Registry / AKS at a high level, and when do data teams touch containers?", "a": "ACR stores container images; AKS runs them at scale. Data teams touch containers for: custom Airflow/Prefect deployments, containerized ingestion apps and APIs, dbt/python job images run on Kubernetes or Container Apps, and packaging dependencies immune to environment drift — increasingly standard even in 'SQL shops'."}, {"n": 41, "q": "How do you handle file arrival-based processing in Azure (Event Grid → ADF/Function/Auto Loader)?", "a": "File-arrival processing options: Event Grid blob-created events triggering ADF event triggers (pipeline per file/batch), an Azure Function for lightweight custom handling, or Databricks Auto Loader in file-notification mode consuming the same events at scale — pick ADF for orchestration-centric flows, Auto Loader for high-volume lakehouse ingestion."}, {"n": 42, "q": "What is the medallion architecture on Azure concretely: which services own landing, Bronze, Silver, Gold, and serving?", "a": "Concrete Azure medallion: sources land via ADF/event triggers into ADLS raw (landing zone, immutable); Databricks/Fabric Spark conforms to Bronze Delta then Silver (dedupe, SCD, quality gates); Gold star schemas built via Spark/dbt/Warehouse; served through Fabric Direct Lake or Databricks SQL to Power BI; Purview/Unity Catalog governing; ADF or Workflows orchestrating; everything deployed via DevOps."}, {"n": 43, "q": "What is Azure Entra ID's role in data platform security (groups for RBAC, conditional access, service principals)?", "a": "Entra ID centralizes identity: security groups (not individuals) receive RBAC and workspace roles, service principals/managed identities for non-human access, conditional access enforcing MFA/compliant devices for sensitive data tools, PIM for time-boxed elevated roles, and audit logs feeding governance — identity is the primary security perimeter in cloud data platforms."}, {"n": 44, "q": "How do you implement row-level and column-level security across the Azure SQL/Synapse/Fabric family?", "a": "RLS: Azure SQL security policies with predicate functions filter rows per user; Fabric Warehouse supports similar T-SQL RLS; semantic-model RLS handles the BI layer. CLS: GRANT column-level permissions, dynamic data masking for casual protection, or OLS in semantic models. Enforce closest to the data consumers actually hit, and align layers so alternate paths don't bypass."}, {"n": 45, "q": "What is geo-redundancy vs availability zones, and how do you design a DR strategy for a data platform (RPO/RTO)?", "a": "Availability zones protect within a region (independent datacenters — HA for zone failure); geo-redundancy protects across regions (paired-region replicas — DR for regional disaster). DR design: define RPO/RTO per tier; GZRS storage plus IaC-rebuildable compute is often enough for analytics (rebuild beats hot standby); business-critical serving gets failover groups/secondary capacity; test the DR runbook annually or it's fiction."}, {"n": 46, "q": "How do you migrate an on-prem data warehouse to Azure — assessment, landing zone, migration waves, validation?", "a": "On-prem DW migration: assess (inventory schemas, ETL, consumers, sizing; classify by complexity); establish landing zone (network, identity, governance, IaC) first; migrate historical data via bulk transfer, then incremental sync (ADF/replication) during transition; convert ETL by pattern not line-by-line; parallel-run with automated reconciliation; migrate consumers in waves; cut over per subject area with rollback windows; decommission with a date."}, {"n": 47, "q": "What certifications map to this stack (DP-203/DP-600/DP-700) and what do they cover?", "a": "Certification map: DP-203 (retiring lineage: Azure data engineering — ADF, Synapse, Databricks, storage), DP-600 (Fabric Analytics Engineer — semantic models, warehouses, lakehouse analytics), DP-700 (Fabric Data Engineer — ingestion, transformation, Spark, RTI, administration in Fabric). For your target roles: DP-600 + DP-700 cover the Microsoft stack authoritatively."}, {"n": 48, "q": "How do you benchmark and choose between ADF, Databricks, and Fabric for a new greenfield pipeline in 2026?", "a": "2026 decision lens: Fabric — Microsoft-centric org, BI-heavy consumption, SaaS simplicity, capacity licensing suits viewer scale. Databricks — engineering-heavy workloads, streaming/ML depth, multicloud, code-first team. ADF alone — pure movement/orchestration into either. Benchmark with a representative slice (your biggest join, your spikiest concurrency) and evaluate TCO including people-time, not just compute rates."}, {"n": 49, "q": "Design an end-to-end Azure architecture for daily + streaming logistics data feeding Power BI, with security, monitoring, and CI/CD.", "a": "Design: batch sources via ADF (SHIR for on-prem) + streaming via Event Hubs → ADLS/OneLake landing → Databricks or Fabric Spark builds Bronze→Silver→Gold Delta (quality gates, SCD2 dims, charge-line-grain facts) → Direct Lake/SQL warehouse semantic model with RLS → Power BI apps; Eventstream→Eventhouse for live tracking dashboards; Purview + Unity Catalog governance; Key Vault + managed identities + private endpoints security; Log Analytics + capacity metrics monitoring with Teams alerting; DevOps CI/CD deploying IaC, pipelines, and models."}, {"n": 50, "q": "A stakeholder reports the nightly ADF load failed and business reports are stale. Walk through your incident response: triage, comms, rerun strategy, and postmortem.", "a": "Incident response: acknowledge and triage (which pipeline, which activity, error class) via monitoring before stakeholders escalate; communicate impact and ETA to consumers early (stale-data banner beats silent wrongness); fix or bypass root cause (rerun from failed activity for transient issues, hotfix for logic, source escalation for upstream); rerun idempotently and validate freshness/reconciliation before declaring resolved; postmortem: root cause, detection gap (why did users know before alerts?), and prevention actions with owners."}]}];

<script>

    { id: "core", name: "Core", max: 15 },
    { id: "applied", name: "Applied", max: 35 },
    { id: "advanced", name: "Advanced", max: 47 },
    { id: "scenario", name: "Scenario", max: 50 }
  ];
  const levelOf = n => LEVELS.find(l => n <= l.max);

  const TOTAL_C = TOPICS.reduce((s, t) => s + t.concepts.length, 0);
  const DAY = 864e5;
  const STEPS = [1, 3, 7, 14, 30]; // spaced-repetition gaps in days

  // ---------- storage (per-viewer convenience only) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem("es:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("es:" + k, JSON.stringify(v)); } catch { /* storage unavailable */ } }

  let progress = store.get("progress", {});

  const statusOf = (tid, n) => (progress[key(tid, n)] || {}).s || "new";
  const isDue = (tid, n) => { const p = progress[key(tid, n)]; return !!p && p.due <= Date.now(); };
  function mark(tid, n, s) {
    const k = key(tid, n), prev = progress[k] || { step: -1 };
    const step = s === "known" ? Math.min(prev.step + 1, STEPS.length - 1) : 0;

    renderRail();

  function topicStats(tid) {
    let known = 0, review = 0, due = 0;
    for (const q of BY_ID[tid].questions) {
      const s = statusOf(tid, q.n);

      if (b.hasAttribute("data-all")) practice.topics = practice.topics.size === TOPICS.length ? new Set() : new Set(TOPICS.map(t => t.id));
      else practice.topics.has(b.dataset.topic) ? practice.topics.delete(b.dataset.topic) : practice.topics.add(b.dataset.topic);
      $$("[data-topic]").forEach(c => c.setAttribute("aria-pressed", practice.topics.has(c.dataset.topic)));
      $("[data-all]").setAttribute("aria-pressed", practice.topics.size === TOPICS.length);
      paintModes();
    };
    $("#pmodes").onclick = e => { const b = e.target.closest("[data-mode]"); if (b) { practice.mode = b.dataset.mode; paintModes(); } };
    $("#pstart").onclick = () => {
      const host = $("#practice-host"), m = MODES.find(x => x.id === practice.mode);
      startDeck(host, practicePool(practice.mode), m.name, () => route());
      host.scrollIntoView({ block: "start" });
    };
    $("#reset-btn").onclick = () => {
      $("#reset-zone").innerHTML = `<span>Clear every mark in this browser?</span><button class="mark-btn review" id="reset-yes">Yes, reset</button><button class="mark-btn" id="reset-no">Cancel</button>`;
      $("#reset-yes").onclick = () => { progress = {}; store.set("progress", progress); route(); };
      $("#reset-no").onclick = () => route();
    };
  }

  // ---------- search ----------
  const INDEX = [];
  for (const t of TOPICS) {
    for (const q of t.questions) INDEX.push({ t, kind: "q", n: q.n, title: q.q, body: q.a, hay: (q.q + " " + q.a + " " + t.short).toLowerCase(), href: `#${t.id}-q${q.n}` });
    t.concepts.forEach((c, i) => INDEX.push({ t, kind: "c", title: c.t, body: c.body, hay: (c.t + " " + c.body + " " + c.example + " " + t.short).toLowerCase(), href: `#${t.id}` }));
  }
  let sel = 0;
  function openSearch() {
    if ($("#layer").childElementCount) return;
    closeRail();
    $("#layer").innerHTML = `<div class="overlay" id="overlay"><div class="sbox" role="dialog" aria-label="Search">
      <label class="field"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="sinput" type="search" placeholder="Search questions, answers and concepts. Try “window functions” or “idempotent”" autocomplete="off"></label>
      <div class="results" id="sresults"></div>
      <div class="sfoot"><span><kbd>↑</kbd> <kbd>↓</kbd> to move</span><span><kbd>Enter</kbd> to open</span><span><kbd>Esc</kbd> to close</span></div></div></div>`;
    $("#overlay").onclick = e => { if (e.target.id === "overlay") closeSearch(); };
    const inp = $("#sinput");
    inp.oninput = () => { sel = 0; paintResults(inp.value); };
    inp.onkeydown = e => {
      const rs = $$(".res");
      if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(sel + 1, rs.length - 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(sel - 1, 0); }
      else if (e.key === "Enter" && rs[sel]) { location.hash = rs[sel].getAttribute("href"); closeSearch(); return; }
      else return;
      rs.forEach((r, i) => r.classList.toggle("sel", i === sel));
      rs[sel]?.scrollIntoView({ block: "nearest" });
    };
    paintResults("");
    inp.focus();
  }
  function paintResults(qs) {
    const ws = terms(qs), box = $("#sresults");
    if (!ws.length) {
      box.innerHTML = `<div class="res"><span class="meta">Popular searches</span><span class="rq">${["window functions", "CALCULATE", "idempotent", "shuffle", "incremental", "SCD Type 2", "Direct Lake"].map(s => `<button class="qchip" data-try="${s}">${s}</button>`).join(" ")}</span></div>`;
      $$("[data-try]", box).forEach(b => b.onclick = () => { $("#sinput").value = b.dataset.try; paintResults(b.dataset.try); $("#sinput").focus(); });
      return;
    }
    const hits = INDEX.filter(x => ws.every(w => x.hay.includes(w)))
      .map(x => ({ x, score: ws.reduce((s, w) => s + (x.title.toLowerCase().includes(w) ? 3 : 0), 0) + (x.kind === "c" ? 1 : 0) }))
      .sort((a, b) => b.score - a.score).slice(0, 40);
    box.innerHTML = hits.length ? hits.map(({ x }, i) => `<a class="res ${i === sel ? "sel" : ""}" href="${x.href}">
        <span class="meta" data-stage="${x.t.stage}"><span class="stage-pill">${esc(x.t.short)}</span>${x.kind === "q" ? `Q${x.n} · ${levelOf(x.n).name}` : "Concept lesson"}</span>
        <span class="rq">${highlight(x.title, ws)}</span><span class="ra">${highlight(x.body, ws)}</span></a>`).join("")
      : `<div class="empty">Nothing matches “${esc(qs)}”. Try a shorter or different term.</div>`;
    $$(".res", box).forEach(a => a.addEventListener("click", closeSearch));
  }
  function closeSearch() { $("#layer").innerHTML = ""; }

  // ---------- router ----------
  function route() {
    pageKeys = null;
    closeRail();
    const h = (location.hash.slice(1) || "home");
    const [id, sub] = h.split("-");
    const main = $("#main");
    if (BY_ID[id]) {
      const t = BY_ID[id];
      const qn = sub && /^q\d+$/.test(sub) ? +sub.slice(1) : null;
      const tab = qn || sub === "questions" ? "questions" : sub === "cards" ? "cards" : "learn";
      if (qn) qState[t.id] = { text: "", level: "all", status: "all" };
      main.innerHTML = renderTopic(t, tab, qn);
      document.title = t.short + " · Engineering Solutions";
      if (tab === "questions") bindQuestions(t, qn);
      if (tab === "cards") startDeck($("#deck"), t.questions.map(q => ({ t, q })), t.short + " deck");
    } else if (id === "practice") {
      main.innerHTML = renderPractice();
      document.title = "Practice · Engineering Solutions";
      bindPractice();
    } else {
      main.innerHTML = renderHome();
      document.title = "Engineering Solutions";
    }
    renderRail();
    if (!sub || !/^q\d+$/.test(sub)) window.scrollTo(0, 0);
  }
  function bindQuestions(t, qn) {
    const st = qState[t.id];
    fillQuestions(t, qn);
    $("#qfilter").oninput = e => { st.text = e.target.value; fillQuestions(t); };
    $$("[data-level]").forEach(b => b.onclick = () => { st.level = b.dataset.level; $$("[data-level]").forEach(c => c.setAttribute("aria-pressed", c === b)); fillQuestions(t); });
    $("#qstatus").onchange = e => { st.status = e.target.value; fillQuestions(t); };
    $("#expand-all").onclick = e => {
      const open = e.target.textContent.startsWith("Show");
      $$(".q").forEach(q => { $(".q-head", q).setAttribute("aria-expanded", open); $(".q-body", q).hidden = !open; });
      e.target.textContent = open ? "Hide all answers" : "Show all answers";
    };
    $("#qlist").onclick = e => {
      const art = e.target.closest(".q"); if (!art) return;
      const n = +art.dataset.n;
      if (e.target.closest(".q-head")) {
        const head = $(".q-head", art), open = head.getAttribute("aria-expanded") !== "true";
        head.setAttribute("aria-expanded", open); $(".q-body", art).hidden = !open;
      }
      const mb = e.target.closest("[data-mark]");
      if (mb) {
        mark(t.id, n, mb.dataset.mark);
        const s = mb.dataset.mark;
        $$("[data-mark]", art).forEach(b => b.setAttribute("aria-pressed", b.dataset.mark === s));
        const dot = $(".st", art); dot.className = "st " + s; dot.title = s === "known" ? "Known" : "Review again";
      }
    };
    if (qn) {
      const el = $(`#q-${t.id}-${qn}`);
      if (el) { requestAnimationFrame(() => el.scrollIntoView({ block: "start" })); el.classList.add("flash"); }
    }
  }

  // ---------- global clicks ----------
  document.addEventListener("click", e => {
    if (e.target.closest("[data-search]") || e.target.closest("#search-btn-top")) return openSearch();
    if (e.target.closest("#menu-btn")) return openRail();
    if (e.target.closest("#theme-btn")) { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; store.set("theme", theme); applyTheme(); e.target.textContent = themeLabel(); return; }
    const cp = e.target.closest("[data-copy]");
    if (cp) {
      const text = cp.parentElement.querySelector("code").textContent;
      const done = () => { cp.textContent = "Copied"; setTimeout(() => cp.textContent = "Copy", 1400); };
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(cp.parentElement.querySelector("code")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); cp.textContent = "Press Ctrl+C"; };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch { fallback(); }
    }
  });
  try { history.scrollRestoration = "manual"; } catch { /* not supported */ }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
