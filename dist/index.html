ows. Automate as post-load assertions logged to an audit table with thresholds and alerting."}, {"n": 36, "q": "Write a query to find gaps and islands in a sequence (e.g., consecutive login streaks).", "a": "Gaps-and-islands: assign ROW_NUMBER ordered by date, then group by date minus row_number (constant within a consecutive run) — each group is an island; gaps are boundaries between islands. Used for streaks, continuous coverage, and sessionization."}, {"n": 37, "q": "How do you calculate month-over-month change per entity using window functions?", "a": "prev = LAG(amount) OVER (PARTITION BY entity ORDER BY month); change = amount - prev; pct = (amount - prev) / NULLIF(prev, 0). LAG keeps it single-pass instead of self-joining to the prior month."}, {"n": 38, "q": "How would you find customers who purchased in January but not February?", "a": "SELECT customer_id FROM sales WHERE month='Jan' EXCEPT SELECT customer_id FROM sales WHERE month='Feb' — or a LEFT JOIN from January purchasers to February purchasers filtering NULLs; EXCEPT reads most clearly."}, {"n": 39, "q": "How do you compute median and percentiles in SQL (PERCENTILE_CONT vs PERCENTILE_DISC)?", "a": "PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY val) interpolates a continuous median; PERCENTILE_DISC returns an actual existing value. On engines without them, use APPROX_PERCENTILE for scale or ROW_NUMBER/COUNT math for exact medians."}, {"n": 40, "q": "What is the difference between a view, an indexed/materialized view, and a table? When do you materialize?", "a": "A view is a stored query (no data, always current, can simplify/secure); an indexed/materialized view persists results for fast reads at maintenance cost; a table is fully materialized data you refresh yourself. Materialize when the computation is expensive, reused often, and freshness requirements allow."}, {"n": 41, "q": "What are stored procedures and functions? Scalar vs table-valued functions and their performance traps.", "a": "Procedures encapsulate multi-statement logic with parameters (ETL steps, admin tasks); scalar UDFs run per-row and historically destroy performance (pre-inlining); inline table-valued functions are parameterized views — optimizer-friendly; multi-statement TVFs hide cardinality and mislead plans. Prefer inline TVFs."}, {"n": 42, "q": "What are temp tables vs table variables vs CTEs — how do you choose?", "a": "Temp tables (#t) persist in tempdb with stats and indexes — best for large intermediate sets reused multiple times. Table variables have minimal stats (poor estimates historically) — fine for tiny sets. CTEs are inlined logic, re-evaluated per reference — best for readability and single-use steps."}, {"n": 43, "q": "How do you handle string parsing in SQL (STRING_SPLIT, STRING_AGG, CHARINDEX/SUBSTRING)?", "a": "STRING_SPLIT breaks delimited strings into rows (add ordinal where supported); STRING_AGG concatenates rows into a delimited string with ORDER BY inside WITHIN GROUP; CHARINDEX locates substrings and SUBSTRING extracts by position — combined for parsing semi-structured columns."}, {"n": 44, "q": "How do date functions differ across engines (DATEADD/DATEDIFF, EXTRACT, date truncation)? How do you handle time zones?", "a": "SQL Server uses DATEADD/DATEDIFF/DATETRUNC; ANSI engines use EXTRACT and INTERVAL arithmetic; truncation-to-month varies (DATETRUNC, DATE_TRUNC, EOMONTH). Store timestamps in UTC (datetimeoffset where relevant), convert at presentation with AT TIME ZONE, and never compare naive local times across regions."}, {"n": 45, "q": "What is partitioning in large tables and how does partition elimination speed up queries?", "a": "Partitioning splits a table by a key (usually date) into separately-stored ranges. Queries filtering the partition key touch only relevant partitions (partition elimination); loads can switch partitions in/out for near-instant archival — but it's a manageability feature more than a pure speed feature."}, {"n": 46, "q": "What is columnstore vs rowstore storage and why do columnstores dominate analytics workloads?", "a": "Rowstores store complete rows together — great for OLTP point lookups and updates. Columnstores store each column contiguously with heavy compression, reading only referenced columns with batch-mode execution — 10–100x for scan-and-aggregate analytics over wide tables."}, {"n": 47, "q": "How would you optimize a query joining a billion-row fact to several dimensions? Walk through your checklist.", "a": "Checklist: verify columnstore/partitioning on the fact; ensure predicate pushdown and partition elimination; confirm join keys are same-typed integers; check dimension sizes (broadcastable?); pre-aggregate if the query grain is coarser than fact grain; examine plan for spills and skewed distribution; update stats; consider pre-computed summary tables."}, {"n": 48, "q": "What is dynamic SQL, when is it justified, and how do you prevent SQL injection?", "a": "Dynamic SQL builds statements as strings for variable objects/columns — justified for metadata-driven frameworks and admin tooling. Prevent injection: parameterize with sp_executesql, never concatenate user input, whitelist identifiers via QUOTENAME, and restrict executing accounts."}, {"n": 49, "q": "How do you test SQL transformations (unit tests, known-answer tests, assertions on grain and uniqueness)?", "a": "Test with known-answer fixtures: small input datasets with expected outputs asserted automatically (dbt tests, tSQLt, pytest against a test DB). Always assert grain (unique keys), row-count reconciliations, null/negative checks on critical columns, and referential integrity between layers."}, {"n": 50, "q": "You inherit a 500-line legacy query with nested subqueries that runs for 40 minutes. Describe your refactoring and optimization approach.", "a": "Approach: capture current output on sample data as a baseline; break the monolith into CTE steps; identify the grain of each step and remove premature DISTINCTs masking join fan-out; replace correlated subqueries with window functions; check plan for scans/spills; add missing indexes or pre-aggregations; validate refactor equals baseline, then optimize iteratively with timings."}]}, {"id": "python", "name": "Python (for Data Roles)", "questions": [{"n": 1, "q": "What are Python's core data structures (list, tuple, set, dict) and their time complexities for common operations?", "a": "Lists: ordered, mutable, O(1) append/index, O(n) membership. Tuples: immutable, hashable. Sets: unordered, unique, O(1) membership/add. Dicts: key-value, O(1) lookup/insert. Choosing the right structure (set for membership, dict for lookup) is the most common practical optimization."}, {"n": 2, "q": "When would you use a tuple over a list, or a set over a list?", "a": "Tuples for fixed heterogeneous records, dictionary keys, and signaling immutability. Sets when uniqueness or fast membership tests matter — deduping IDs or checking 'seen' items in loops."}, {"n": 3, "q": "What is the difference between mutable and immutable objects, and what bugs does mutability cause (e.g., mutable default arguments)?", "a": "Immutable: int, str, tuple, frozenset; mutable: list, dict, set. Classic bug: def f(x, acc=[]) — the default list is created once and shared across calls; use None sentinel. Also aliasing: b = a on a list makes both names point to one object."}, {"n": 4, "q": "How does Python pass arguments — by value or by reference? Explain 'pass by object reference'.", "a": "Python passes object references by value: reassigning a parameter doesn't affect the caller, but mutating a passed mutable object does. Understanding this explains most 'my function changed my data' surprises."}, {"n": 5, "q": "What is the difference between == and is?", "a": "== compares values (calls __eq__); is compares identity (same object in memory). Use is only for None/True/False singletons: x is None."}, {"n": 6, "q": "Explain list, dict, and set comprehensions. When do they hurt readability?", "a": "Comprehensions build collections declaratively: [x*2 for x in xs if x>0], {k: v for ...}, {x for ...}. They hurt readability when nested deeply or containing complex conditionals — switch to loops or named helper functions there."}, {"n": 7, "q": "What are generators and the yield keyword? Why are they memory-efficient for large data processing?", "a": "Generators produce values lazily via yield, holding only current state instead of a full collection — so you can stream a 100 GB file line-by-line in constant memory. Generator expressions (sum(x for x in ...)) avoid intermediate lists."}, {"n": 8, "q": "What is the difference between an iterable, an iterator, and a generator?", "a": "An iterable can produce an iterator (has __iter__); an iterator yields items via __next__ and is exhausted once consumed; a generator is an iterator created by a function with yield (or a genexp). Files, ranges, and DataFrame chunks are all iterables you loop lazily."}, {"n": 9, "q": "What are *args and **kwargs and when do you use them?", "a": "*args collects extra positional arguments as a tuple; **kwargs collects extra keyword arguments as a dict. Use for flexible wrappers, decorators, and passing options through to underlying libraries (e.g., forwarding read_csv kwargs)."}, {"n": 10, "q": "What are lambda functions and where are they appropriate (sorted key, map/filter) vs discouraged?", "a": "Lambdas are anonymous single-expression functions — appropriate as short keys: sorted(rows, key=lambda r: r['date']). Discouraged when logic grows, needs a name for testing, or is assigned to a variable (just def it)."}, {"n": 11, "q": "Explain shallow copy vs deep copy.", "a": "Shallow copy (copy.copy, list slicing, dict.copy) duplicates the container but shares nested objects; deep copy (copy.deepcopy) recursively duplicates everything. Nested config dicts modified after shallow copy are a classic pipeline bug."}, {"n": 12, "q": "What are decorators? Write a simple timing or retry decorator and explain how it works.", "a": "A decorator wraps a function to extend behavior: def retry(fn): @wraps(fn) def inner(*a, **k): for attempt in range(3): try: return fn(*a,**k) except Exception: sleep(2**attempt) return inner. Applied with @retry — cross-cutting concerns (timing, retries, logging) without touching business logic."}, {"n": 13, "q": "What are context managers and the with statement? Why do they matter for files and DB connections?", "a": "Context managers guarantee setup/teardown via __enter__/__exit__: with open(path) as f, or with engine.connect() as conn. They release files, connections, and locks even when exceptions occur — essential to avoid leaked handles in long-running pipelines."}, {"n": 14, "q": "How does Python handle exceptions? Explain try/except/else/finally and creating custom exceptions.", "a": "try runs risky code; except catches specific exception types (narrowest first); else runs when no exception occurred; finally always runs (cleanup). Custom exceptions (class DataQualityError(Exception)) let callers distinguish pipeline failure modes."}, {"n": 15, "q": "What is the difference between raising and catching exceptions in a data pipeline — when should a pipeline fail fast vs log and continue?", "a": "Fail fast on structural problems (missing source, schema break, credentials) — continuing produces garbage. Log-and-continue (with quarantine) for isolated bad records when partial delivery is acceptable and tracked. The decision should be explicit per error class, with counts surfaced to monitoring either way."}, {"n": 16, "q": "Explain Python's GIL. What does it mean for multithreading vs multiprocessing in data workloads?", "a": "The Global Interpreter Lock allows only one thread to execute Python bytecode at a time, so threads don't parallelize CPU-bound pure-Python work. Threads still help I/O-bound tasks (waiting releases the GIL); CPU parallelism needs multiprocessing or GIL-releasing native libraries (NumPy, Polars)."}, {"n": 17, "q": "When would you choose multiprocessing, threading, or asyncio for a data task (I/O-bound vs CPU-bound)?", "a": "CPU-bound (parsing, computation): multiprocessing or vectorized libraries. I/O-bound with moderate concurrency (a few API calls, DB queries): threading. I/O-bound with high concurrency (hundreds of requests): asyncio. Measure first — most 'slow Python' in data work is fixed by vectorization, not concurrency."}, {"n": 18, "q": "How does Python manage memory (reference counting, garbage collection)? What are common causes of memory leaks in long-running jobs?", "a": "CPython uses reference counting (objects freed when count hits zero) plus a cyclic garbage collector for reference cycles. Long-running job leaks typically come from unbounded caches/dicts, accumulating global lists, holding DataFrame references, or C-extension leaks — profile with tracemalloc."}, {"n": 19, "q": "What are type hints and tools like mypy/pydantic? Why do they matter in production pipelines?", "a": "Type hints (def load(path: str) -> pd.DataFrame) document intent and let mypy catch type bugs pre-runtime; pydantic validates data at runtime (API payloads, configs) with typed models. In pipelines they turn silent data-shape errors into loud, early failures."}, {"n": 20, "q": "What is the difference between a module and a package? How do imports and __init__.py work?", "a": "A module is a .py file; a package is a directory of modules with __init__.py. Imports resolve via sys.path; absolute imports (from myproj.utils import x) are preferred. Import-time side effects and circular imports are the common traps."}, {"n": 21, "q": "How do virtual environments work (venv, conda, poetry/uv)? Why are pinned dependencies critical for reproducible pipelines?", "a": "Virtual environments isolate per-project dependencies (venv/conda/poetry/uv). Pinned lockfiles guarantee the exact versions in prod match dev — unpinned dependencies are a top cause of 'worked yesterday' pipeline failures, e.g., a pandas minor release changing behavior."}, {"n": 22, "q": "What is if __name__ == '__main__' and why is it used?", "a": "It distinguishes 'run as a script' from 'imported as a module': the guarded block executes only when run directly. It keeps imports side-effect-free — critical for tests, multiprocessing on Windows, and orchestrators importing your module."}, {"n": 23, "q": "Explain OOP basics in Python: classes, inheritance, composition, dunder methods (__init__, __repr__, __eq__).", "a": "Classes bundle state and behavior (__init__ constructor, self instance state); inheritance shares/overrides behavior; composition (has-a) is usually preferable to deep inheritance. __repr__ aids debugging; __eq__ defines equality semantics for comparisons and tests."}, {"n": 24, "q": "What are dataclasses and when are they better than dicts or plain classes for pipeline records/configs?", "a": "Dataclasses auto-generate __init__/__repr__/__eq__ from typed fields: @dataclass class JobConfig: source: str; retries: int = 3. Better than dicts for configs/records — typo-safe attribute access, defaults, type hints, and IDE support — with less boilerplate than manual classes."}, {"n": 25, "q": "What is duck typing? How does it differ from interfaces/ABCs?", "a": "Duck typing: an object's suitability comes from the methods it implements, not its declared type — 'if it quacks'. ABCs/protocols formalize expected interfaces when you want isinstance checks or static verification without giving up flexibility."}, {"n": 26, "q": "How do you read and write files efficiently in Python (streaming large files line by line, csv module, json module)?", "a": "Stream instead of slurping: iterate file objects line-by-line, use csv.reader/DictReader for delimited data, json.load for whole documents vs json.loads per line for JSONL. Always pass encoding explicitly and use newline='' with csv writers."}, {"n": 27, "q": "How do you handle dates and times robustly (datetime, timezone-aware vs naive, ISO 8601 parsing)?", "a": "Use datetime with explicit tzinfo (zoneinfo); store/compare in UTC, convert at edges. Parse ISO 8601 with datetime.fromisoformat (or dateutil for messy formats). Naive-vs-aware mixing raises errors or, worse, silently wrong offsets — normalize on ingestion."}, {"n": 28, "q": "What are f-strings and common string operations you use daily in data work?", "a": "F-strings interpolate expressions with formatting: f\"{amount:,.2f}\", f\"{dt:%Y-%m-%d}\". Daily staples: .strip(), .split(), .join(), .lower(), .replace(), .startswith(), and re for pattern extraction."}, {"n": 29, "q": "How does sorting work — sorted vs .sort, key functions, sorting by multiple fields, stability?", "a": "sorted returns a new list; .sort() mutates in place. key= computes the sort basis: sorted(rows, key=lambda r: (r['region'], -r['sales'])) for multi-field ordering. Python's sort is stable — equal keys keep original order, enabling multi-pass sorts."}, {"n": 30, "q": "What do zip, enumerate, any, all, and itertools utilities do? Give data-processing examples.", "a": "zip pairs iterables element-wise; enumerate yields (index, item); any/all short-circuit boolean checks across iterables; itertools provides chain (concatenate), groupby (consecutive grouping), islice (lazy slicing), product/combinations — building blocks for memory-light record processing."}, {"n": 31, "q": "How do you connect to databases from Python (DB-API, SQLAlchemy, connection pooling, parameterized queries)?", "a": "Use SQLAlchemy (or DB-API drivers like pyodbc) with engine/connection pooling; always parameterize queries (execute(text(sql), params)) — never f-string values into SQL. Use context managers for connections/transactions and pd.read_sql for analysis pulls."}, {"n": 32, "q": "How do you call REST APIs in Python (requests, pagination, retries with backoff, rate limits, auth)?", "a": "requests with a Session for pooling; handle pagination via next-page tokens/links in a loop; implement retries with exponential backoff (urllib3 Retry or custom) honoring Retry-After on 429s; authenticate via headers/OAuth; always set timeouts and raise_for_status()."}, {"n": 33, "q": "How do you structure a Python ETL project (config, logging, src layout, entry points) for maintainability?", "a": "Layout: src/package modules (extract/transform/load separated), config/ per environment, tests/, entry-point CLI, pyproject.toml for dependencies. Keep pure transformation functions separate from I/O so logic is unit-testable; configuration injected, not hardcoded."}, {"n": 34, "q": "How do you implement logging properly (logging module vs print, levels, handlers, structured logs)?", "a": "Use the logging module with module-level loggers (logging.getLogger(__name__)), levels (DEBUG→CRITICAL), and handlers/formatters set once at entry point. Structured logs (JSON with run_id, row counts) make pipeline runs queryable; print offers none of this and can't be filtered or routed."}, {"n": 35, "q": "How do you write unit tests with pytest (fixtures, parametrize, mocking external systems)?", "a": "pytest discovers test_*.py functions with plain asserts; fixtures provide reusable setup (sample frames, temp dirs, fake configs); @pytest.mark.parametrize runs one test across many cases; monkeypatch/unittest.mock replace APIs, clocks, and databases so tests are fast and deterministic."}, {"n": 36, "q": "What is the difference between unit, integration, and end-to-end tests for a data pipeline?", "a": "Unit tests verify pure functions on tiny in-memory data (fast, run every commit); integration tests exercise real components — a test database, real files, Spark local (slower, run in CI); end-to-end tests run the whole pipeline on sample data in a staging environment validating outputs and orchestration."}, {"n": 37, "q": "How do you profile slow Python code (timeit, cProfile, memory_profiler) and what are common speedups?", "a": "Profile before optimizing: timeit for micro-benchmarks, cProfile+snakeviz for hotspots, memory_profiler/tracemalloc for allocation. Common wins: replace row loops with vectorized pandas/NumPy, use sets/dicts for lookups, batch I/O and DB round-trips, and cache repeated computations."}, {"n": 38, "q": "Why are vectorized operations (NumPy/pandas) faster than Python loops?", "a": "Vectorized operations execute in compiled C over contiguous arrays with SIMD and no per-element interpreter overhead or boxing — typically 10–100x faster than Python-level loops doing the same arithmetic element by element."}, {"n": 39, "q": "What are common gotchas with floating point arithmetic in financial/metric calculations, and when do you use Decimal?", "a": "Binary floats can't represent many decimals exactly (0.1+0.2 != 0.3), so equality checks and cumulative sums drift. Use math.isclose for comparisons, round only at presentation, and use Decimal (or integer minor units) for money and anywhere ledger-exact arithmetic is required."}, {"n": 40, "q": "How do you parse and validate JSON safely, including nested/optional fields?", "a": "json.loads inside try/except for malformed payloads; access nested optional fields with .get chains or a small helper; validate structure with pydantic models when shape matters — turning missing/renamed fields into explicit validation errors instead of KeyErrors mid-pipeline."}, {"n": 41, "q": "How do you handle secrets and credentials in Python code (env vars, key vaults — never hardcoding)?", "a": "Read from environment variables or a secrets manager (Key Vault) at runtime; never commit secrets or hardcode them. Use .env only locally (gitignored), rotate credentials, and prefer managed identities over static secrets where the platform allows."}, {"n": 42, "q": "What is pickling/serialization and when is it unsafe?", "a": "Pickle serializes arbitrary Python objects — convenient for caches, but unpickling executes code, so never unpickle untrusted data. Prefer JSON/Parquet for data interchange; pickle only for trusted internal artifacts within one controlled environment and Python version."}, {"n": 43, "q": "Explain error handling and idempotency when writing a script that loads data daily — how do you make reruns safe?", "a": "Make reruns safe by keying work to the load window: delete-then-insert (or MERGE) for the target partition, write to staging then atomically swap, record processed batch IDs to skip duplicates, and make side effects (notifications) conditional on first success."}, {"n": 44, "q": "How do you schedule/parametrize a Python script for different environments (argparse/click, config files, env-based settings)?", "a": "Use argparse/click for CLI parameters (dates, environment, dry-run flags); load environment-specific settings from config files or env vars merged with defaults; keep one codebase where environment is data, not branched code — the orchestrator passes parameters per run."}, {"n": 45, "q": "What are walrus operator, unpacking, and other modern syntax features you actually use?", "a": "The walrus operator assigns within expressions (while (chunk := f.read(65536)):); unpacking spreads sequences (a, *rest = xs; merged = {**d1, **d2}); pathlib for filesystem paths; match statements for structured dispatch — modern syntax that tightens data-handling code."}, {"n": 46, "q": "What is the difference between @staticmethod, @classmethod, and instance methods?", "a": "Instance methods receive self and act on object state; @classmethod receives cls — alternate constructors like from_config(); @staticmethod receives neither — namespaced utility functions logically belonging to the class."}, {"n": 47, "q": "How would you process a 50 GB CSV on a machine with 8 GB RAM using only Python?", "a": "Stream it: iterate with csv.reader aggregating incrementally, or pandas read_csv(chunksize=...) combining per-chunk aggregates, or better, use DuckDB/Polars lazy scan which process larger-than-memory CSVs with predicate pushdown. Never load the whole file; select only needed columns."}, {"n": 48, "q": "How do you detect and handle bad records (schema drift, encoding issues, malformed rows) in file ingestion?", "a": "Validate early: explicit dtypes/schema on read, try/except around parsing with bad rows routed to a quarantine file with reasons, encoding detection/explicit encoding, row-length checks, and counts of rejected rows logged and alerted — so drift is visible, not silent."}, {"n": 49, "q": "Write the logic (pseudo or real) for a function that retries an API call with exponential backoff and jitter.", "a": "import random, time; def call_with_retry(fn, max_tries=5, base=1.0): for i in range(max_tries): try: return fn() except RetryableError: if i == max_tries-1: raise; sleep = base * (2**i) + random.uniform(0, base); time.sleep(sleep). Jitter prevents synchronized retry storms; only retry retryable errors."}, {"n": 50, "q": "Describe a Python automation you built that saved real time — what design decisions made it reliable?", "a": "Strong answers name reliability decisions, not just the task: idempotent reruns, config-driven parameters, structured logging with row counts, validation gates before writes, alerts on failure, and documentation — e.g., an automated reconciliation script that replaced a manual Excel process with logged, rerunnable checks."}]}, {"id": "pandas", "name": "Pandas & DataFrames", "questions": [{"n": 1, "q": "What is a DataFrame and a Series? How does the index work and why is it central to pandas?", "a": "A DataFrame is a 2D table of columns (each a Series) sharing a row index; a Series is one labeled 1D array. The index labels rows and drives alignment: arithmetic and joins match on index labels, not position — the source of both power and silent bugs."}, {"n": 2, "q": "How do loc, iloc, and at/iat differ? Give examples of label vs positional selection.", "a": "loc selects by labels (df.loc['2025-01', ['sales']], inclusive slices); iloc by integer position (df.iloc[0:5, 1:3], exclusive end); at/iat are fast scalar accessors for single cells. Mixing them up on integer-labeled indexes is a classic error."}, {"n": 3, "q": "What is boolean masking/filtering and how do you combine multiple conditions correctly (&, |, parentheses)?", "a": "A boolean mask is a True/False Series used to filter: df[(df.amount > 0) & (df.region == 'GCC')]. Use & | ~ (not and/or) and parenthesize every condition because comparison operators bind looser than &."}, {"n": 4, "q": "What is the SettingWithCopyWarning, what causes it, and how does copy-on-write (pandas 2.x) change things?", "a": "It warns that you may be modifying a temporary copy via chained indexing (df[mask]['col'] = x), leaving the original unchanged. Fix with df.loc[mask, 'col'] = x. Pandas 2.x copy-on-write makes chained assignment consistently not modify the original, removing the ambiguity."}, {"n": 5, "q": "How do you read data efficiently (read_csv options: dtype, usecols, parse_dates, chunksize, nrows)?", "a": "Pass dtype= to avoid inference cost and wrong types, usecols= to read only needed columns, parse_dates= for datetimes, chunksize= to stream large files, nrows= for quick inspection. Explicit dtypes on IDs prevent leading-zero loss and float-ification of nullable ints."}, {"n": 6, "q": "What are pandas dtypes, and why do object columns hurt memory and speed? What is the category dtype?", "a": "Dtypes determine storage and speed: int64/float64/datetime64 are fast NumPy arrays; object columns hold Python objects (usually strings) — slow and memory-hungry. category maps repeated strings to integer codes — huge savings for low-cardinality columns like country or status."}, {"n": 7, "q": "How do nullable dtypes (Int64, boolean, string) differ from NumPy dtypes, and how does NaN vs None vs pd.NA behave?", "a": "Nullable dtypes (Int64, boolean, string) support pd.NA without upcasting to float — classic pandas turns an int column with a missing value into float64 with NaN. NaN is a float, None is a Python object, pd.NA is the unified missing marker; behavior differs in comparisons and groupby."}, {"n": 8, "q": "How do you profile and reduce a DataFrame's memory usage?", "a": "df.info(memory_usage='deep') and df.memory_usage(deep=True) reveal true footprint. Reduce by downcasting numerics (int32/float32), converting strings to category, parsing dates properly, dropping unused columns at read time, and using Arrow-backed dtypes."}, {"n": 9, "q": "How do you handle missing data: isna, fillna, dropna, interpolate — and how do you decide which is analytically correct?", "a": "isna flags missing; dropna removes; fillna imputes (constant, ffill for carrying forward observations); interpolate estimates between points for ordered series. The analytical decision matters most: filling revenue with 0 vs excluding it changes conclusions — choose per column meaning."}, {"n": 10, "q": "How do you find and remove duplicates (duplicated, drop_duplicates, keep parameter)?", "a": "duplicated() flags repeat rows (subset= for key columns, keep= controls which occurrence survives); drop_duplicates removes them. For 'latest record per key', sort by timestamp then drop_duplicates(subset=key, keep='last') — deliberate keep choice is the difference between right and wrong data."}, {"n": 11, "q": "Explain merge vs join vs concat. Map SQL joins to pandas merge how= options.", "a": "merge is SQL-style joining on columns (how='inner/left/right/outer/cross'); join is index-based merge sugar; concat stacks DataFrames vertically (axis=0, like UNION ALL) or horizontally. SQL INNER/LEFT/FULL map directly to merge how= values."}, {"n": 12, "q": "What do the validate and indicator arguments in merge do, and why should you use them?", "a": "validate='one_to_many' etc. asserts key uniqueness expectations and raises on violation — catching fan-out at the join instead of in wrong totals later. indicator=True adds a _merge column (left_only/right_only/both) for reconciliation analysis."}, {"n": 13, "q": "How does groupby work (split-apply-combine)? Difference between agg, transform, apply, and filter on groups?", "a": "groupby splits rows by key, applies a function per group, and combines results. agg computes aggregates (collapses to one row per group); transform returns a result aligned to the original rows (group share, group mean for imputation); apply runs arbitrary functions (flexible, slowest); filter keeps/drops whole groups."}, {"n": 14, "q": "How do you compute multiple named aggregations per group in one pass?", "a": "Named aggregation: df.groupby('region').agg(total=('amount','sum'), orders=('order_id','nunique'), avg_val=('amount','mean')) — one pass, clean output column names."}, {"n": 15, "q": "When is groupby().apply() a performance trap and what are alternatives?", "a": "apply calls a Python function per group with overhead per call — thousands of groups make it crawl. Alternatives: built-in agg/transform (vectorized per group), vectorizing the logic before grouping, or engine alternatives (numba, Polars, DuckDB) for complex per-group logic."}, {"n": 16, "q": "What are pivot, pivot_table, melt, stack, and unstack? When do you reshape wide↔long?", "a": "pivot reshapes long→wide (fails on duplicate index/column pairs); pivot_table aggregates duplicates (aggfunc); melt goes wide→long (tidy data for modeling/plotting); stack/unstack pivot index levels. Reshape long for analysis pipelines, wide for human-readable reports."}, {"n": 17, "q": "What is a MultiIndex? How do you select from it, and when is reset_index the right move?", "a": "A MultiIndex has multiple levels of row/column labels — typically from groupby on several keys. Select with .loc[('A', 2025)], xs(), or IndexSlice. reset_index() is right whenever you're about to merge, export, or the hierarchy adds friction rather than meaning."}, {"n": 18, "q": "How do window operations work: rolling, expanding, ewm? Compute a 7-day moving average per group.", "a": "rolling computes fixed-window stats, expanding computes cumulative from start, ewm weights recent values more. Per group: df.groupby('store')['sales'].transform(lambda s: s.rolling(7, min_periods=1).mean()) — or sort and use groupby().rolling() with droplevel."}, {"n": 19, "q": "How do shift and diff work? Compute month-over-month change per customer.", "a": "shift moves values down/up within order (previous row); diff is value minus shifted value. MoM per customer: df.sort_values(['cust','month']).groupby('cust')['amount'].diff() — or pct_change() for percentage."}, {"n": 20, "q": "How do rank and qcut/cut differ for ranking and bucketing?", "a": "rank() assigns numeric ranks with tie methods (average/min/dense); cut bins values into fixed intervals you define (business thresholds); qcut bins by quantiles for equal-sized buckets (quartiles, deciles) — cut for meaning, qcut for distribution."}, {"n": 21, "q": "How do you work with datetime columns (to_datetime, dt accessor, resample for time-series aggregation)?", "a": "Convert with pd.to_datetime (specify format for speed/safety); access parts via .dt (year, month, day_name); resample('MS').sum() aggregates a datetime index to monthly. Datetime as real dtype unlocks time slicing (df.loc['2025-06']) and joins on dates."}, {"n": 22, "q": "What is the difference between resample and groupby(pd.Grouper(...))?", "a": "resample works on a datetime index/column for frequency conversion with time-aware semantics; groupby(pd.Grouper(key='dt', freq='MS')) does the same inside a groupby, letting you combine time bucketing with other keys (region + month)."}, {"n": 23, "q": "How do you handle time zones in pandas?", "a": "tz_localize attaches a timezone to naive timestamps; tz_convert translates between zones. Store UTC, convert for display; comparing naive and aware timestamps raises — normalize at ingestion, and mind DST when localizing ambiguous local times."}, {"n": 24, "q": "How do you do string operations at scale (str accessor, extract with regex, contains, split/explode)?", "a": "The .str accessor vectorizes string ops: .str.strip/lower/replace/contains/extract(regex with groups)/split(expand=True). Regex-powered .str.extract turns messy codes into clean columns; case=False and na= parameters handle real-world mess."}, {"n": 25, "q": "What does explode do and when do you need it (lists/JSON in cells)?", "a": "explode expands list-like cells into one row per element, repeating other columns — essential after splitting delimited strings or normalizing JSON arrays (order → one row per item). Follow with type fixes since exploded values are often objects."}, {"n": 26, "q": "How do you flatten nested JSON into a DataFrame (json_normalize)?", "a": "pd.json_normalize flattens nested dicts into columns (sep='_' paths) and, with record_path/meta, expands nested arrays into rows while carrying parent fields — the standard API-response-to-DataFrame tool."}, {"n": 27, "q": "What are vectorized operations vs apply vs itertuples vs iterrows — rank them by performance and explain why.", "a": "Fastest to slowest: vectorized column operations (C speed) > .map on a Series > itertuples (namedtuples, no per-row Series construction) > apply(axis=1) > iterrows (builds a Series per row, dtype-mangling). If you're writing iterrows, look for the vectorized formulation first."}, {"n": 28, "q": "What do map, replace, and np.where/np.select do for conditional column creation?", "a": "map applies a dict/function to a Series (value translation); replace substitutes values possibly with regex; np.where(cond, a, b) is a vectorized if/else; np.select([conds], [choices], default) handles multi-branch logic — all vastly faster than row-wise apply."}, {"n": 29, "q": "What is method chaining with assign and pipe, and why does it improve readability and reduce bugs?", "a": "Chaining pipes each step's output forward: (df.query('amount>0').assign(margin=lambda d: d.rev-d.cost).groupby('region').agg(...)). assign adds columns without mutation; pipe inserts custom functions. Benefits: no intermediate-variable state bugs, readable top-to-bottom recipes."}, {"n": 30, "q": "How do you rename, reorder, and change dtypes of columns cleanly?", "a": "rename(columns={...}) or set df.columns from a cleaned list; reorder by indexing df[cols]; convert with astype({'id':'int64'}) or targeted converters (to_datetime, to_numeric with errors='coerce'). Do all typing once, early, in a dedicated cleaning step."}, {"n": 31, "q": "How do you compare two DataFrames for equality or reconcile differences (compare, merge with indicator)?", "a": "df.compare(other) shows aligned cell differences; for keyed reconciliation, merge on keys with indicator=True and suffixes, then filter mismatched rows/columns; assert_frame_equal for exact test equality. Always align dtypes and sort before comparing."}, {"n": 32, "q": "How do you sample data (sample, head/tail by group)?", "a": "sample(n= or frac=, random_state= for reproducibility) for random samples; stratified sampling via groupby().sample(); head/tail per group via groupby().head(n) which keeps the first n rows of each group without collapsing."}, {"n": 33, "q": "How do you get top-N rows per group?", "a": "Top-N per group: df.sort_values(['grp','metric'], ascending=[True,False]).groupby('grp').head(3) — or nlargest via group apply for a single metric. The sort+head pattern is fastest and clearest."}, {"n": 34, "q": "What are common causes of silent wrong answers in pandas (index misalignment, join duplication, NaN in group keys)?", "a": "Silent-wrong-answer causes: join key duplication inflating sums, index misalignment during assignment (values matched by label, not position), NaN group keys silently dropped by groupby (dropna=True default), lossy dtype coercions, and chained assignment not sticking. Defenses: validate= on merges, asserts on row counts and key uniqueness."}, {"n": 35, "q": "How does index alignment affect arithmetic between Series/DataFrames?", "a": "Operations between Series/DataFrames align on index labels first, filling non-matches with NaN — adding two Series with different indexes yields NaN where labels don't intersect. reset or explicitly align (reindex) when position-based math is intended, or use .values deliberately."}, {"n": 36, "q": "How do you write data out (to_parquet, to_csv, to_sql) and why is Parquet preferred for analytics?", "a": "to_parquet preserves dtypes, compresses well, and reads back fast with column selection — the default for pipeline interchange. to_csv is for human/legacy consumption (lossy types); to_sql loads to databases (use chunksize and fast drivers). Parquet's columnar layout matches analytics access patterns."}, {"n": 37, "q": "What is Apache Arrow and how does the pandas Arrow backend change dtypes and performance?", "a": "Arrow is a standardized in-memory columnar format. With dtype_backend='pyarrow', pandas gets proper string/nullable types, lower memory, faster I/O, and zero-copy interchange with Polars/DuckDB/Spark — increasingly the performance-default backend."}, {"n": 38, "q": "When does pandas stop being the right tool? Compare with Polars, DuckDB, Dask, and Spark — and how you'd choose.", "a": "Pandas suits datasets fitting comfortably in memory with single-machine workflows. Polars: faster multi-threaded engine with lazy optimization, similar scale ceiling. DuckDB: SQL over larger-than-memory files, excellent for joins/aggregation. Dask: parallel/out-of-core pandas API. Spark: cluster-scale and production distributed pipelines. Choose the lightest tool that fits data size and team skills."}, {"n": 39, "q": "How do you process a file larger than memory in pandas (chunksize pattern) and aggregate across chunks?", "a": "Loop over read_csv(chunksize=1_000_000), compute per-chunk partial aggregates (sums, counts, per-key dicts), combine at the end (sum of sums; weighted means from sums/counts). Works for distributive aggregations; for joins/medians at that scale, use DuckDB instead."}, {"n": 40, "q": "How do you implement an SCD-style comparison (detect new/changed/deleted rows between snapshots) in pandas?", "a": "Full-outer merge current vs previous snapshot on business keys with indicator: right_only=new, left_only=deleted, both=compare attribute hashes (or column-wise equality) to flag changed. Output insert/update/delete sets — the same logic that feeds an SCD process."}, {"n": 41, "q": "How do you validate a DataFrame's schema and quality programmatically (assertions, pandera/Great Expectations)?", "a": "Programmatic validation: assert on shape, dtypes, key uniqueness (df.key.is_unique), null thresholds, and value ranges after each transformation; pandera schemas or Great Expectations suites formalize these checks as declarative, reusable, CI-runnable contracts."}, {"n": 42, "q": "How do you handle categorical encoding for reporting vs ML (astype('category'), get_dummies)?", "a": "For reporting: astype('category') to fix sort orders (ordered categories) and save memory. For ML: pd.get_dummies for one-hot encoding (drop_first to avoid collinearity), or leave encoding to sklearn transformers within a pipeline for train/serve consistency."}, {"n": 43, "q": "What is the pitfall of chained indexing (df[a][b]) and the correct alternative?", "a": "df['a']['b'] performs two separate indexing operations — reading may work, but assigning through it modifies an intermediate that may be a copy. Always use single-step df.loc[rows, cols] for both reading and assignment."}, {"n": 44, "q": "How do crosstab and pivot_table with margins support quick analysis?", "a": "pd.crosstab counts (or aggregates) combinations of two-plus categoricals with normalize= for percentages; pivot_table(margins=True) adds row/column totals. Both are quick contingency/summary views before formal modeling."}, {"n": 45, "q": "How do you compute percentage of total within groups (transform pattern)?", "a": "Percent of group total: df['pct'] = df.amount / df.groupby('region').amount.transform('sum'). transform broadcasts the group aggregate back to every row, avoiding a merge."}, {"n": 46, "q": "How do you merge on nearest keys or time (merge_asof) — e.g., matching trades to quotes?", "a": "merge_asof joins each left row to the nearest earlier (or nearest, with direction=) right row on a sorted key — matching trades to latest quote, events to most recent config version. Both sides must be sorted; by= adds exact-match grouping keys."}, {"n": 47, "q": "How do you deal with mixed encodings and messy real-world CSVs?", "a": "Try utf-8 first, fall back per-file (encoding='cp1252'/'latin-1'), or detect with charset-normalizer; read with on_bad_lines to route or skip malformed rows, engine='python' for irregular delimiters, and normalize unicode/whitespace after load. Log every fallback so upstream fixes happen."}, {"n": 48, "q": "How do you unit test pandas transformation functions (small fixture frames, assert_frame_equal)?", "a": "Structure transformations as pure functions (frame in, frame out), feed small hand-built fixture frames covering normal + edge cases (nulls, duplicates, empty), assert with pd.testing.assert_frame_equal (check_dtype as appropriate) and targeted asserts on keys and aggregates."}, {"n": 49, "q": "Describe a full EDA workflow you follow on a new dataset before building anything.", "a": "EDA sequence: shape/dtypes/info; head/tail/sample sanity; missingness profile per column; descriptive stats and distributions for numerics; cardinality/top values for categoricals; key uniqueness and duplicates; time coverage and gaps; relationships between key fields; document anomalies and decisions before transforming anything."}, {"n": 50, "q": "You receive a daily 5M-row transactions file and must produce clean monthly KPIs. Design the pandas pipeline: cleaning, typing, dedup, joins, aggregation, and output format.", "a": "Pipeline: read with explicit dtypes and parse_dates; validate schema and row counts vs control totals; standardize strings/currencies; quarantine bad rows with reasons; dedupe on business key keeping latest; join reference dimensions with validate='many_to_one'; derive month and KPIs via groupby agg; assert totals reconcile to input; write monthly Parquet partitions plus a load-audit log row."}]}, {"id": "fabric", "name": "Microsoft Fabric (End-to-End)", "questions": [{"n": 1, "q": "What is Microsoft Fabric and how does it unify Data Factory, Synapse-style engineering, warehousing, real-time analytics, and Power BI?", "a": "Fabric is Microsoft's unified SaaS analytics platform: Data Factory (integration), Data Engineering (Spark), Data Warehouse, Real-Time Intelligence, Data Science, and Power BI share one storage layer (OneLake), one capacity model, one governance/security surface — replacing stitched-together PaaS services."}, {"n": 2, "q": "What is OneLake? Explain the 'one copy' philosophy and how it compares to a traditional data lake setup.", "a": "OneLake is the single, tenant-wide logical data lake (built on ADLS Gen2) that all Fabric workloads read/write. 'One copy' means engines (Spark, SQL, Power BI Direct Lake, KQL) operate on the same Delta Parquet files instead of each maintaining its own copy — shortcuts extend this virtually to external storage."}, {"n": 3, "q": "What is a Fabric capacity (F SKUs)? How do capacity units, smoothing, bursting, and throttling work?", "a": "A capacity (F2–F2048) is purchased compute powering all Fabric workloads, measured in capacity units. Smoothing spreads usage over time windows; bursting borrows beyond baseline temporarily; sustained overload triggers throttling — interactive delays first, then rejections — so sizing and workload isolation matter."}, {"n": 4, "q": "What is the difference between a Lakehouse and a Warehouse in Fabric, and how do you choose between them?", "a": "A Lakehouse is files + Delta tables managed via Spark, flexible for engineering and semi-structured data, with a read-only SQL endpoint. A Warehouse is a full T-SQL engine with multi-table transactions, T-SQL DML/DDL. Choose Lakehouse for Spark-first teams and raw/varied data; Warehouse for SQL-first teams needing T-SQL writes."}, {"n": 5, "q": "What is the SQL analytics endpoint of a Lakehouse and what are its limitations (read-only, sync latency)?", "a": "It exposes Lakehouse Delta tables to T-SQL clients (and Power BI) automatically. Limitations: read-only (no INSERT/UPDATE), Delta-only visibility, and metadata sync latency after Spark writes — a known cause of 'stale data' confusion downstream."}, {"n": 6, "q": "Explain Delta Lake as Fabric's storage format — why is everything Delta Parquet underneath?", "a": "Every Fabric table is Delta Lake: Parquet data files plus a JSON transaction log providing ACID transactions, time travel, schema enforcement, and concurrent reader/writer safety. Standardizing on Delta is what lets all engines share one copy."}, {"n": 7, "q": "What are OneLake shortcuts and how do they enable data virtualization across workspaces, ADLS, and even S3?", "a": "Shortcuts are pointers in OneLake to data elsewhere — other workspaces, ADLS Gen2, Amazon S3, Dataverse — appearing as local folders/tables without copying. They enable cross-domain sharing and gradual migrations, with access governed at the shortcut target."}, {"n": 8, "q": "What is mirroring in Fabric and when would you mirror a database instead of building ETL?", "a": "Mirroring continuously replicates operational databases (Azure SQL, Cosmos DB, Snowflake) into OneLake as Delta with near-real-time CDC — zero-ETL analytics on operational data. Use it when you need current source data queryable without building ingestion pipelines."}, {"n": 9, "q": "Explain Direct Lake mode: how it works, when it falls back to DirectQuery, and how framing/reframing affects it.", "a": "Direct Lake loads Delta Parquet column data straight into memory on demand — Import-like speed with no scheduled copy. Framing pins the model to a table version; refresh is just re-framing (metadata). It falls back to DirectQuery for unsupported features (certain views, security setups, guardrail limits) — silently costing performance."}, {"n": 10, "q": "Compare Import vs DirectQuery vs Direct Lake for a Fabric semantic model — decision criteria?", "a": "Import: best raw performance and full features, needs refresh cycles and duplicates data. DirectQuery: real-time, source-bound performance limits. Direct Lake: near-Import speed on lakehouse data with no data duplication — the Fabric default when data is already Delta and features are compatible; verify fallback behavior."}, {"n": 11, "q": "What are the main compute experiences in Fabric (Data Engineering notebooks, Data Factory pipelines, Dataflows Gen2, Warehouse SQL, Real-Time Intelligence)?", "a": "Data Engineering: Spark notebooks and lakehouses for code-first transformation. Data Factory: pipelines (orchestration/copy) and Dataflows Gen2 (low-code Power Query). Warehouse: T-SQL analytics. Real-Time Intelligence: Eventstreams and KQL for streaming. Plus Power BI for semantic models/reports — all on OneLake."}, {"n": 12, "q": "What is a Fabric notebook and how does the Spark runtime work (starter pools, custom pools, high concurrency mode)?", "a": "Fabric notebooks run Spark (PySpark/Scala/SparkSQL/R) with lakehouses attached. Starter pools give fast session start with default sizing; custom pools tune node size/autoscale; high-concurrency mode shares one Spark session across notebooks/users for cost and startup efficiency."}, {"n": 13, "q": "What is the difference between Dataflows Gen2 and pipelines? When do you use each — or both together?", "a": "Dataflows Gen2 is low-code Power Query with data destinations — analyst-friendly transformation. Pipelines orchestrate: copy activities, control flow, scheduling, calling notebooks and dataflows. Typical pattern: pipeline orchestrates ingestion, then triggers dataflows or notebooks for transformation."}, {"n": 14, "q": "How do pipelines in Fabric compare to Azure Data Factory? What activities do you commonly use (Copy, Notebook, dataflow, Invoke)?", "a": "Fabric pipelines are ADF's successor inside Fabric: same concepts (Copy activity, ForEach, Lookup, If, parameters), tighter OneLake integration, some connector/IR differences (on-prem access via gateway rather than self-hosted IR). Common activities: Copy, Notebook, Dataflow, Stored procedure, Web/Invoke."}, {"n": 15, "q": "How do you implement medallion architecture (Bronze/Silver/Gold) in Fabric? Which engine handles each layer in your design?", "a": "Bronze lands raw immutable data (files/Delta, append-only); Silver cleans, dedupes, conforms types and keys (Spark notebooks typically); Gold serves dimensional/star models for the semantic layer (notebooks or Warehouse SQL). Each layer is separate lakehouse/schema with clear contracts; Direct Lake models sit on Gold."}, {"n": 16, "q": "How do you ingest data incrementally in Fabric (watermarks, CDC, incremental copy patterns)?", "a": "Incremental patterns: watermark columns tracked in a control table (pipeline Lookup → filtered Copy), Delta MERGE in notebooks for upserts, mirroring/CDC for databases, and incremental refresh for Dataflows Gen2. Log high-water marks after each successful load for restartability."}, {"n": 17, "q": "What is the Copy activity vs COPY INTO vs notebook-based ingestion — trade-offs?", "a": "Copy activity: configuration-driven bulk movement, best connector breadth. COPY INTO: T-SQL bulk load into Warehouse from files. Notebook ingestion: full control, validation, complex sources/APIs — more code to own. Start with Copy for movement; notebooks when logic exceeds configuration."}, {"n": 18, "q": "How do you parameterize pipelines and notebooks for reusable, environment-aware pipelines?", "a": "Parameterize pipelines (parameters + expressions on connections/paths) and notebooks (parameter cells receiving pipeline values) so one artifact serves all environments and sources — the foundation of metadata-driven frameworks and clean deployment across Dev/Test/Prod."}, {"n": 19, "q": "How do you orchestrate dependencies and scheduling in Fabric (pipeline triggers, notebook scheduling, orchestration patterns)?", "a": "Schedule pipelines (or event triggers), chain activities with dependencies, call notebooks/dataflows inline; notebook-only jobs can be scheduled directly. Complex dependency graphs use a master pipeline invoking child pipelines; monitor centrally via Monitoring hub."}, {"n": 20, "q": "What is the difference between a Fabric Warehouse and Azure Synapse Dedicated SQL Pool?", "a": "Fabric Warehouse is SaaS: automatic scaling within capacity, storage as open Delta in OneLake, no distribution-key management; Synapse dedicated pools are provisioned DWUs with hash-distribution design and proprietary storage. Fabric trades knob control for simplicity and open format."}, {"n": 21, "q": "What T-SQL surface differences/limitations exist in Fabric Warehouse compared to SQL Server?", "a": "Differences from SQL Server: historically limited constraint enforcement (PK/unique not enforced), some T-SQL surface gaps (certain identity/merge behaviors evolving), case-sensitive default collation considerations, no cross-database three-part queries outside the workspace model. Check current docs — the gap narrows continuously."}, {"n": 22, "q": "How do V-Order and optimized write improve Delta performance in Fabric?", "a": "V-Order is Microsoft's write-time Parquet optimization (sorting, encoding, compression tuning) making files dramatically faster for VertiPaq/Direct Lake reads; optimized write targets healthy file sizes instead of many small files. Both are on by default in most Fabric write paths."}, {"n": 23, "q": "How do you run OPTIMIZE and VACUUM in Fabric, and why does small-file compaction matter?", "a": "OPTIMIZE compacts small files (optionally V-Order) via table maintenance or Spark SQL; VACUUM removes unreferenced files past retention (mind time-travel needs). Streaming/frequent small writes demand scheduled compaction — small files degrade every downstream reader including Direct Lake."}, {"n": 24, "q": "What is the semantic model's role in Fabric and how do you build one on top of a Lakehouse for Power BI?", "a": "The semantic model is the metric/relationship layer over Gold tables that Power BI queries. Build via Direct Lake on the lakehouse: define relationships, DAX measures, RLS; keep one certified model per domain serving many reports — the contract between engineering and the business."}, {"n": 25, "q": "How does workspace design work in Fabric — how would you structure workspaces across domains, environments, and layers?", "a": "Common pattern: workspaces per layer×environment (e.g., Sales-Dev/Test/Prod) or per domain with medallion inside; separate engineering workspaces from consumer-facing report workspaces; capacity assignment per workload criticality. Fewer, well-governed workspaces beat sprawl."}, {"n": 26, "q": "What are domains in Fabric and how do they support data mesh-style organization?", "a": "Domains group workspaces by business area with delegated domain admins and branding — supporting data-mesh operating models: domain ownership of data products, federated governance from the center, easier discovery in the OneLake catalog."}, {"n": 27, "q": "How does Git integration work in Fabric (connect workspace to Azure DevOps/GitHub, commit, branch out)?", "a": "Connect a workspace to an Azure DevOps/GitHub branch; supported items (notebooks, semantic models, reports, pipelines) serialize to source files; commit/update from the workspace; developers branch out to isolated workspaces, PR back, and sync main to upstream environments."}, {"n": 28, "q": "What are deployment pipelines in Fabric and how do deployment rules handle environment-specific connections?", "a": "Deployment pipelines promote items Dev→Test→Prod between workspaces with diff views; deployment rules rebind environment-specific settings (lakehouse connections, parameters) per stage. Combine Git (versioning/PR) with deployment pipelines (promotion) or drive everything via fabric-cicd/APIs from DevOps."}, {"n": 29, "q": "How do you implement security in Fabric: workspace roles, item permissions, OneLake data access roles, and sharing?", "a": "Layers: workspace roles (Admin/Member/Contributor/Viewer) for content management; item-level sharing for granular access; OneLake data access roles for folder/table-level lakehouse security; SQL permissions in Warehouse; plus semantic-model RLS for report consumers. Grant least privilege at the narrowest effective layer."}, {"n": 30, "q": "How does RLS/OLS in semantic models interact with Direct Lake and Lakehouse security?", "a": "Semantic-model RLS/OLS applies to users on the model; but Direct Lake queries read the lakehouse — under fixed identity, model RLS governs; if falling back or users hit the SQL endpoint directly, lakehouse/SQL security applies. Align both layers so bypass paths don't leak data."}, {"n": 31, "q": "What is Microsoft Purview integration in Fabric — sensitivity labels, endorsement, lineage?", "a": "Purview integration provides sensitivity labels flowing from source through reports, endorsement (promoted/certified), lineage views across items, and estate-wide scanning/glossary via the Purview hub — governance evidence for audits and trust signals for consumers."}, {"n": 32, "q": "How do you monitor Fabric: Monitoring hub, capacity metrics app, Spark monitoring, pipeline run history?", "a": "Monitoring hub shows run history/status for pipelines, notebooks, refreshes; the Capacity Metrics app breaks down CU consumption by item/operation for throttling analysis; Spark monitoring exposes job/executor detail; alerting via Data Activator or pipeline failure activities to Teams/email."}, {"n": 33, "q": "What causes capacity throttling and how do you investigate and remediate interactive vs background operation overload?", "a": "Throttling arises when sustained CU demand exceeds capacity after smoothing — symptoms: slow interactive queries, delayed/rejected jobs. Investigate with the metrics app to find top-consuming items/operations; remediate by optimizing offenders, rescheduling background load, isolating workloads across capacities, or scaling the SKU."}, {"n": 34, "q": "What is Real-Time Intelligence (Eventstream, Eventhouse/KQL database) and give a use case.", "a": "Real-Time Intelligence ingests streams via Eventstream (Event Hubs, IoT, CDC sources) into Eventhouse/KQL databases for sub-second analytics. Use case: live shipment-tracking telemetry powering operational dashboards and threshold alerts alongside batch analytics."}, {"n": 35, "q": "What is KQL and how does it differ from SQL at a high level?", "a": "KQL (Kusto) is a pipe-based query language optimized for logs/telemetry/time-series: table | where ts > ago(1h) | summarize count() by bin(ts, 5m). It excels at time-window aggregation and text/trace exploration; SQL remains the relational workhorse."}, {"n": 36, "q": "What is Data Activator (Reflex/alerts) and how do you trigger actions from data conditions?", "a": "Data Activator (Reflex) monitors data streams/query results for conditions (threshold breached, value changed, pattern over time) and triggers actions — Teams/email alerts, Power Automate flows, pipeline runs — no-code operational alerting on your data."}, {"n": 37, "q": "How do you use Fabric's SQL database (transactional) offering and when would it fit?", "a": "Fabric SQL database is an OLTP-capable SQL database within Fabric whose data auto-replicates to OneLake for analytics — fitting operational apps that want built-in analytical availability without separate ETL."}, {"n": 38, "q": "How do notebooks read/write across Lakehouses and Warehouses (mounts, ABFS paths, spark connectors, T-SQL magic)?", "a": "Notebooks attach lakehouses (default lakehouse for relative paths), read via spark.read.table or abfss:// paths, write Delta with saveAsTable; cross-workspace access via shortcuts or full ABFS paths; Warehouse tables reachable through the SQL endpoint connector or T-SQL magic; %%sql magic runs SparkSQL inline."}, {"n": 39, "q": "What is semantic link (sempy) and how can notebooks read from semantic models?", "a": "Semantic link (sempy) lets notebooks read semantic models — evaluate DAX, pull measures/tables into pandas/Spark, run model quality checks programmatically — bridging data science and the BI layer (e.g., validating measures against Silver data automatically)."}, {"n": 40, "q": "How do you handle schema evolution in Fabric Lakehouse tables?", "a": "Delta supports additive evolution with mergeSchema on write and column mapping for renames/drops; overwriteSchema replaces schemas deliberately. Govern changes: additive by default, versioned contracts for breaking changes, and communicate to semantic-model owners since Direct Lake sees schema immediately."}, {"n": 41, "q": "What are materialized lake views / metadata-driven pipelines patterns you'd use for scale?", "a": "Materialized lake views (declarative, auto-refreshed Silver/Gold transformations) reduce hand-built orchestration; metadata-driven frameworks store source/table configs in control tables and loop them with parameterized pipelines/notebooks — onboarding source #50 becomes a config row, not new code."}, {"n": 42, "q": "How do you migrate an existing Synapse or ADF + ADLS + Power BI stack to Fabric — what's your assessment approach?", "a": "Assess inventory (ADF pipelines, Synapse pools, ADLS layout, Power BI models), map to Fabric equivalents (pipelines, notebooks/Warehouse, OneLake shortcuts to existing ADLS for zero-copy migration start), migrate incrementally domain-by-domain with parallel-run validation, and convert Import models to Direct Lake where guardrails allow."}, {"n": 43, "q": "How does licensing work for consumers of Fabric content (F64 threshold for free viewers, Pro requirements)?", "a": "Content in F64+ capacity workspaces is viewable by users with Free licenses (viewer role); below F64, consumers need Pro. Authors/publishers need Pro regardless. This threshold often drives capacity sizing economics for large report audiences."}, {"n": 44, "q": "How do you estimate and control costs in Fabric (capacity sizing, pausing, workload distribution)?", "a": "Estimate from workload simulation on trial capacity using the metrics app; control costs by right-sizing SKU, pausing dev capacities off-hours (PAYG), scheduling background jobs off-peak, optimizing hot items, and splitting capacities to isolate expensive workloads from interactive BI."}, {"n": 45, "q": "What is the difference between staging and non-staged Dataflow Gen2 writes, and the performance implications?", "a": "Staged Gen2 writes land data in an internal staging lakehouse before the destination, enabling engine-assisted (fast copy/SQL) processing of large volumes; non-staged writes go direct — simpler for small loads. Large merges benefit from staging; misconfigured staging is a common Gen2 performance complaint."}, {"n": 46, "q": "How do you implement data quality checks in a Fabric pipeline (notebook asserts, pipeline fail activities, logging tables)?", "a": "Implement quality gates as notebook assertions (row counts, null/key checks) that raise to fail the pipeline activity, DQ result tables logged per run, pipeline If/fail activities acting on check outputs, and alerts on failure — quarantine bad batches in Bronze rather than letting them poison Silver."}, {"n": 47, "q": "How do you implement CI/CD for Fabric items end-to-end (Git branches, PRs, deployment pipelines, fabric-cicd/APIs)?", "a": "End-to-end CI/CD: feature workspaces from Git branches → PR with review into main → workspace sync (or fabric-cicd/Fabric APIs in Azure DevOps pipelines) deploying to Dev → deployment pipeline or scripted promotion to Test/Prod with deployment rules rebinding connections → automated post-deploy validation notebooks."}, {"n": 48, "q": "How do you test a Direct Lake model's performance and diagnose fallback to DirectQuery?", "a": "Test with Performance Analyzer and DAX Studio timings against realistic concurrency; check DirectLakeBehavior/fallback via analysis tools (queries hitting DirectQuery instead of memory), guardrail limits (row counts per SKU), framing recency, and file health (V-Order, compaction) — most 'slow Direct Lake' is fallback or small files."}, {"n": 49, "q": "Describe an end-to-end Fabric solution you would design: sources → ingestion → Bronze/Silver/Gold → semantic model → report → monitoring — with reasoning for each choice.", "a": "Design: sources land via mirroring/pipelines/API notebooks into Bronze lakehouse; Spark notebooks conform to Silver (dedupe, SCD, quality gates); Gold star schema built via notebooks or Warehouse; certified Direct Lake semantic model with RLS; Power BI app for consumers; orchestrated by parameterized pipelines; monitored via Monitoring hub + capacity metrics; Git + deployment pipelines for lifecycle."}, {"n": 50, "q": "A Direct Lake report shows stale data after a pipeline run. Walk through the possible causes (framing, refresh, SQL endpoint sync) and fixes.", "a": "Stale Direct Lake data causes: model not re-framed after load (refresh the model — cheap metadata operation), SQL analytics endpoint metadata sync lag, pipeline wrote to a different lakehouse/table than modeled, fallback querying a stale cache path, or automatic framing disabled. Verify Delta commit timestamps, sync the endpoint, then re-frame and retest."}]}, {"id": "spark", "name": "Apache Spark / Spark SQL / PySpark", "questions": [{"n": 1, "q": "What is Apache Spark and how does it differ from MapReduce? Why is in-memory processing faster?", "a": "Spark is a distributed compute engine processing data across a cluster in memory. MapReduce writes intermediate results to disk between every map/reduce stage; Spark keeps data in memory across a DAG of operations and only shuffles when required — orders of magnitude faster for iterative and multi-step jobs."}, {"n": 2, "q": "Explain Spark's architecture: driver, executors, cluster manager, cores, and how a job is distributed.", "a": "The driver runs your program, builds the DAG, and schedules tasks; executors are JVM processes on workers running tasks and caching data; the cluster manager (YARN/Kubernetes/standalone/Databricks) allocates resources. Each executor has cores (task slots) and memory; a job is split into tasks distributed to slots."}, {"n": 3, "q": "What are jobs, stages, and tasks? What causes a stage boundary?", "a": "An action spawns a job; a job splits into stages at shuffle boundaries; each stage runs one task per partition. Wide dependencies (data must move between partitions) force a stage boundary — the shuffle write/read separating stages."}, {"n": 4, "q": "What is a shuffle, why is it expensive, and which operations trigger it?", "a": "A shuffle redistributes data across the cluster by key: map tasks write sorted/partitioned files, reduce tasks fetch their partitions over the network. It's expensive because of disk I/O, serialization, and network transfer. Triggered by joins (non-broadcast), groupBy/agg, distinct, repartition, and orderBy."}, {"n": 5, "q": "Explain transformations vs actions and lazy evaluation. Why does laziness matter?", "a": "Transformations (select, filter, join) build a lazy logical plan; actions (count, collect, write) trigger execution. Laziness lets Catalyst optimize the entire plan — pushing filters early, pruning columns — instead of executing operations naively in written order."}, {"n": 6, "q": "What is the difference between narrow and wide transformations?", "a": "Narrow transformations need only one parent partition per output partition (map, filter) — pipelined within a stage. Wide transformations need data from many partitions (groupByKey, join, distinct) — requiring a shuffle and new stage."}, {"n": 7, "q": "What are RDDs, DataFrames, and Datasets? Why are DataFrames preferred today?", "a": "RDDs are the low-level distributed object collections (no schema, no optimization). DataFrames add schema and run through Catalyst/Tungsten — optimized columnar execution. Datasets add compile-time typing (Scala/Java only). Use DataFrames; drop to RDDs only for exotic low-level needs."}, {"n": 8, "q": "What is the Catalyst optimizer and what optimizations does it perform (predicate pushdown, column pruning, constant folding)?", "a": "Catalyst converts your query through logical/physical plans applying rule-based and cost-based optimization: predicate pushdown (filters to the source/scan), column pruning (read only needed columns), constant folding, join reordering, and choosing physical join strategies."}, {"n": 9, "q": "What is the Tungsten engine / whole-stage codegen?", "a": "Tungsten is the execution layer: off-heap binary memory format avoiding JVM object overhead, cache-friendly processing, and whole-stage code generation — compiling operator chains into single JVM functions eliminating virtual call overhead per row."}, {"n": 10, "q": "What is Adaptive Query Execution (AQE) and what does it fix at runtime (skew joins, coalescing partitions, join strategy switch)?", "a": "AQE re-optimizes at runtime using real shuffle statistics: coalesces many small post-shuffle partitions, switches sort-merge joins to broadcast when a side turns out small, and splits skewed partitions into subtasks. It fixes plans that static estimates got wrong — leave it on."}, {"n": 11, "q": "Explain partitions in Spark. How do you choose the number of shuffle partitions?", "a": "A partition is the unit of parallelism — one task processes one partition. Shuffle partitions default to 200 (spark.sql.shuffle.partitions); tune so partitions are roughly 100–200 MB, or rely on AQE coalescing. Too few = underutilization and memory pressure; too many = scheduling overhead and small files."}, {"n": 12, "q": "What is the difference between repartition and coalesce?", "a": "repartition(n or cols) fully reshuffles to n partitions or by column hash — even distribution, full shuffle cost, usable to increase partitions. coalesce(n) merges existing partitions without shuffle — cheap for reducing partition count (pre-write), but can create uneven sizes and can't increase count."}, {"n": 13, "q": "What is data skew, how do you detect it in the Spark UI, and how do you fix it (salting, AQE, broadcast)?", "a": "Skew: a few keys hold most data, so their tasks run far longer — visible in the Spark UI as stages where max task duration/input dwarfs the median. Fixes: AQE skew-join handling, salting hot keys (append random suffix, replicate the other side), broadcasting the smaller table, or isolating hot keys into a separate handled path."}, {"n": 14, "q": "What is a broadcast join and when does Spark choose it? How do you force or block it?", "a": "A broadcast join ships the small table to every executor, joining without shuffling the large side. Spark auto-broadcasts under spark.sql.autoBroadcastJoinThreshold (default 10 MB); force with broadcast(df) hint; block by setting threshold -1. Beware broadcasting tables too big for driver/executor memory."}, {"n": 15, "q": "Compare join strategies: broadcast hash, shuffle hash, sort-merge. When does each win?", "a": "Broadcast hash: one side small — no shuffle, fastest. Shuffle hash: both shuffled, smaller side hashed in memory — good when one side is much smaller but too big to broadcast. Sort-merge: both shuffled and sorted — the scalable default for two large tables. AQE can demote/promote between them at runtime."}, {"n": 16, "q": "What is caching/persisting? Explain storage levels and when caching helps vs hurts.", "a": "cache()/persist() store a DataFrame's computed partitions (MEMORY_AND_DISK default) for reuse across multiple actions — valuable for iterative access to the same intermediate. Costs memory that competes with execution; caching something used once is pure overhead. Unpersist when done."}, {"n": 17, "q": "What is checkpointing and how does it differ from caching?", "a": "Checkpointing writes data to reliable storage and truncates lineage — useful for very long lineage chains (iterative algorithms, streaming state) where recomputation or stack depth becomes a problem. Cache is temporary and lineage-preserving; checkpoint is durable and lineage-cutting."}, {"n": 18, "q": "How does Spark achieve fault tolerance (lineage, DAG recomputation)?", "a": "Each partition's lineage (the chain of transformations from source) is recorded; on executor loss, missing partitions are recomputed from lineage on other nodes. Shuffle files and caching reduce recomputation scope; checkpoints cut lineage for long chains."}, {"n": 19, "q": "Explain spark-submit and key configs: executor memory, executor cores, driver memory, dynamic allocation.", "a": "spark-submit deploys jobs with resource configs: --executor-memory, --executor-cores, --num-executors (or dynamic allocation min/max), --driver-memory. Balanced sizing: ~4–5 cores per executor, memory per core matched to data; dynamic allocation scales executors with load on shared clusters."}, {"n": 20, "q": "How does Spark memory management work (unified memory, execution vs storage, off-heap)? What causes OOM in executors vs driver?", "a": "Unified memory splits executor heap into execution (shuffles, joins, sorts) and storage (cache) regions that borrow from each other. Executor OOM: oversized partitions, skew, huge broadcasts, memory-hungry UDFs. Driver OOM: collect() on big data, too many tasks/partitions metadata, large broadcast creation."}, {"n": 21, "q": "What does collect() do and why is it dangerous? What are safer alternatives?", "a": "collect() ships the entire distributed dataset to the driver — OOM risk and cluster-to-single-machine bottleneck. Alternatives: show()/limit() for inspection, take(n) for samples, write() for outputs, toPandas() only on aggregated/small results."}, {"n": 22, "q": "What are UDFs in PySpark, why are they slow, and how do pandas (vectorized) UDFs improve them? Why prefer built-in functions?", "a": "Python UDFs serialize rows to a Python worker per executor, breaking codegen and columnar flow — slow. Pandas UDFs batch via Arrow into vectorized pandas operations — much faster. Built-in functions (pyspark.sql.functions) run in the JVM with full optimization — always prefer them; UDFs are the last resort."}, {"n": 23, "q": "How do you read/write data in PySpark (formats, options, modes: overwrite/append/errorifexists/ignore)?", "a": "spark.read.format('parquet'/'csv'/'json'/'delta').options(...).load(path); write with df.write.format(...).mode(m).save(path). Modes: overwrite replaces, append adds, errorifexists (default) fails on existing, ignore skips silently. Prefer explicit schemas over inference in production."}, {"n": 24, "q": "Why is Parquet the default analytics format? Explain row groups, encoding, and predicate pushdown.", "a": "Parquet is columnar with per-column encoding/compression: readers scan only referenced columns (column pruning), row-group min/max statistics enable predicate pushdown skipping chunks, and splittable files parallelize well — ideal for analytical scan-heavy access."}, {"n": 25, "q": "How do you handle schemas: inferSchema vs explicit StructType, and schema evolution options (mergeSchema)?", "a": "inferSchema samples data (extra pass, wrong guesses on messy data); explicit StructType is deterministic and fast — mandatory for production CSV/JSON. Delta enforces schema on write; mergeSchema opts into additive evolution; overwriteSchema replaces intentionally."}, {"n": 26, "q": "How do you handle corrupt records when reading files (PERMISSIVE, DROPMALFORMED, FAILFAST, _corrupt_record)?", "a": "CSV/JSON readers offer modes: PERMISSIVE (default) nulls bad fields and captures raw text into _corrupt_record for quarantine analysis; DROPMALFORMED discards bad rows; FAILFAST errors immediately. Production pattern: PERMISSIVE + route corrupt records to a rejects table with counts alerted."}, {"n": 27, "q": "Explain the withColumn, select, filter/where, groupBy/agg API — and why chaining many withColumns can be slow.", "a": "withColumn adds/replaces one column; select projects/computes many at once; filter/where filters rows; groupBy().agg() aggregates. Long withColumn chains bloat the logical plan (analysis overhead) — prefer a single select with multiple expressions, or selectExpr, for many derivations."}, {"n": 28, "q": "How do window functions work in PySpark (Window.partitionBy/orderBy, rowsBetween)? Give a dedup-latest-record example.", "a": "Window: from pyspark.sql.window import Window; w = Window.partitionBy('key').orderBy(F.col('updated').desc()); df.withColumn('rn', F.row_number().over(w)).filter('rn=1') — the latest-record-per-key dedup. rowsBetween defines frames for running/rolling aggregates."}, {"n": 29, "q": "How do you dedupe data at scale: dropDuplicates vs window row_number — trade-offs?", "a": "dropDuplicates(keys) keeps an arbitrary row per key — fine when duplicates are identical. The window row_number pattern picks a deterministic winner (latest timestamp) — required when duplicates differ. Both shuffle; window adds a sort but gives control."}, {"n": 30, "q": "How do explode, arrays, maps, and structs work? How do you flatten deeply nested JSON in PySpark?", "a": "Arrays/maps/structs model nested data; explode flattens arrays to rows (explode_outer keeps empties); dot notation and getField access struct members; flatten deeply nested JSON iteratively: explode arrays, select struct fields to top level, repeat — or use higher-order functions (transform, filter) to process arrays without exploding."}, {"n": 31, "q": "What is the difference between Spark SQL and the DataFrame API — do they perform differently?", "a": "They compile to the same plans through Catalyst — performance is equivalent. Spark SQL suits SQL-fluent teams and set-based logic; the DataFrame API composes programmatically (loops, conditionals, testing). Mix freely: createOrReplaceTempView bridges them."}, {"n": 32, "q": "How do temp views, global temp views, and catalog tables (managed vs external) differ?", "a": "Temp views are session-scoped names over DataFrames; global temp views live in global_temp across sessions on one application; catalog tables persist in the metastore — managed tables let Spark own data lifecycle (drop deletes data), external tables reference paths (drop keeps data)."}, {"n": 33, "q": "How do you optimize small files problems on write (repartition before write, maxRecordsPerFile, compaction)?", "a": "Small files: repartition/coalesce to target ~128 MB–1 GB files before write, set maxRecordsPerFile, enable optimized write (Delta/Databricks), and run OPTIMIZE compaction on Delta tables regularly — small files inflate metadata, task counts, and read latency platform-wide."}, {"n": 34, "q": "What is partitionBy on write (hive-style partitioning) and how do you choose partition columns? What is partition pruning?", "a": "partitionBy('date') writes hive-style directory partitions; queries filtering the partition column read only matching directories (partition pruning). Choose low-cardinality, commonly-filtered columns (date, region). Over-partitioning (high-cardinality keys) creates a small-files catastrophe."}, {"n": 35, "q": "What is bucketing and when does it help joins?", "a": "Bucketing pre-hashes data into fixed buckets by key at write; joins/aggregations on the bucket key can avoid shuffling when bucket specs match. Useful for repeated large joins on the same key; less used in Delta world where liquid clustering/Z-order and AQE cover most needs."}, {"n": 36, "q": "What is Delta Lake? Explain the transaction log, ACID guarantees, and time travel.", "a": "Delta Lake adds a transaction log (_delta_log JSON/checkpoints) over Parquet: ACID commits, concurrent reader/writer
