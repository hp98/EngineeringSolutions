<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Engineering Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (topics as a pipeline index) + reading column; rail collapses to a drawer on phones. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --sunken: #e9edf2;
  --ink: #0e1a28;
  --muted: #56667a;
  --line: #d8dfe8;
  --accent: #1d5bd0;
  --accent-ink: #ffffff;
  --accent-soft: #e3ecfb;
  --code-bg: #0f1b2b;
  --code-ink: #dbe4f0;
  --code-kw: #8fb8ff;
  --code-str: #f0c28a;
  --code-com: #7c8ba0;
  --code-num: #c9a2f5;
  --code-tpl: #7fd6c2;
  --core: #0b7f62;     --core-bg: #dff3ec;
  --applied: #1d5bd0;  --applied-bg: #e3ecfb;
  --advanced: #a8480f; --advanced-bg: #fbe9dc;
  --scenario: #7a34b8; --scenario-bg: #efe4fa;
  --good: #0b7f62; --warn: #a8480f;
  --shadow: 0 1px 2px rgba(14,26,40,.06), 0 8px 24px rgba(14,26,40,.06);
  --f-display: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --rail: 272px;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1420; --surface: #121c2a; --sunken: #18243444; --ink: #e6edf6; --muted: #93a3b8; --line: #243245;
    --accent: #6d9cf5; --accent-ink: #0c1420; --accent-soft: #1a2a45;
    --code-bg: #08101b; --code-ink: #d6e0ee;
    --core: #4fd1a7; --core-bg: #12302a; --applied: #7fa8f7; --applied-bg: #1a2a45;
    --advanced: #f2a46e; --advanced-bg: #3a2416; --scenario: #c79af2; --scenario-bg: #2e1f42;
    --good: #4fd1a7; --warn: #f2a46e;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1420; --surface: #121c2a; --sunken: #18243444; --ink: #e6edf6; --muted: #93a3b8; --line: #243245;
  --accent: #6d9cf5; --accent-ink: #0c1420; --accent-soft: #1a2a45;
  --code-bg: #08101b; --code-ink: #d6e0ee;
  --core: #4fd1a7; --core-bg: #12302a; --applied: #7fa8f7; --applied-bg: #1a2a45;
  --advanced: #f2a46e; --advanced-bg: #3a2416; --scenario: #c79af2; --scenario-bg: #2e1f42;
  --good: #4fd1a7; --warn: #f2a46e;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 15px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code, pre, kbd { font-family: var(--f-mono); }
kbd { font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); color: var(--muted); }
.eyebrow { font: 600 11px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; gap: 18px; padding: 20px 14px 16px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font: 800 17px/1.05 var(--f-display); letter-spacing: -0.02em; }
.brand-name small { display: block; font: 500 11px/1.4 var(--f-body); color: var(--muted); letter-spacing: 0; }
.search-btn {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--muted); text-align: left;
}
.search-btn span { flex: 1; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group .eyebrow { padding: 0 8px 6px; }
.nav-link {
  display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 7px;
  text-decoration: none; color: var(--ink); font-weight: 500; font-size: 14px;
}
.nav-link:hover { background: var(--bg); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav-link .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--stage, var(--muted)); }
.nav-link .label { flex: 1; min-width: 0; }
.nav-link .meter { width: 36px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; flex: none; }
.nav-link .meter i { display: block; height: 100%; background: var(--good); }
.rail-foot { margin-top: auto; display: flex; gap: 8px; align-items: center; padding: 0 6px; color: var(--muted); font-size: 12px; }
.theme-btn { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 5px 10px; font-size: 12px; }

.topbar { display: none; }
.main { min-width: 0; padding-inline: clamp(16px, 4vw, 56px); padding-block: 36px 80px; }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }

/* stage colours (pipeline position) */
[data-stage="Ingest"]      { --stage: #d08a1d; }
[data-stage="Transform"]   { --stage: #1d5bd0; }
[data-stage="Orchestrate"] { --stage: #0b7f62; }
[data-stage="Serve"]       { --stage: #c2366b; }
[data-stage="Platform"]    { --stage: #6b4fc2; }
[data-stage="Principles"]  { --stage: #56667a; }

/* ---------- home ---------- */
.hero { display: grid; gap: 18px; padding-top: 8px; }
.hero h1 { font-size: clamp(34px, 5.4vw, 58px); font-weight: 800; letter-spacing: -0.035em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lede { font-size: 17px; color: var(--muted); max-width: 62ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: 14px; color: var(--muted); }
.facts b { font: 700 20px/1 var(--f-display); color: var(--ink); margin-right: 6px; font-variant-numeric: tabular-nums; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); font-weight: 600; font-size: 14px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 6px 11px; font-size: 13px; }

.section-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 20px; margin-bottom: 16px; }
.section-head h2 { font-size: 24px; }
.section-head p { color: var(--muted); max-width: 60ch; }

/* pipeline map */
.pipeline { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
.pipe-scroll { overflow-x: auto; padding-bottom: 4px; }
.pipe-grid { display: grid; grid-template-columns: 0.8fr repeat(4, 1fr); gap: 10px; min-width: 760px; position: relative; }
.pipe-col { display: flex; flex-direction: column; gap: 8px; position: relative; }
.pipe-col + .pipe-col::before {
  content: ""; position: absolute; left: -10px; top: 13px; width: 10px; height: 2px; background: var(--line);
}
.pipe-step { display: flex; align-items: center; gap: 8px; font: 700 13px/1 var(--f-display); }
.pipe-step b { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--stage); color: #fff; font-size: 12px; flex: none; }
.pipe-cap { font-size: 12.5px; color: var(--muted); line-height: 1.45; min-height: 54px; }
.node {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
  text-decoration: none; color: var(--ink); font-weight: 600; font-size: 14px;
  border-left: 3px solid var(--stage);
  transition: transform .15s ease, border-color .15s ease;
}
.node:hover { transform: translateY(-1px); border-color: var(--stage); }
.node small { font-weight: 500; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.node.static { border-left-color: var(--line); color: var(--muted); font-weight: 500; cursor: default; }
.node.static:hover { transform: none; border-color: var(--line); }
.pipe-band { grid-column: 2 / -1; display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; border: 1px dashed var(--stage); text-decoration: none; color: var(--ink); background: var(--bg); }
.pipe-band strong { font-size: 14px; }
.pipe-band span { font-size: 12.5px; color: var(--muted); }
.pipe-band:hover { border-style: solid; }
.pipe-band .tag { font: 600 10.5px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--stage); flex: none; width: 84px; }
.pipe-band-label { grid-column: 1; align-self: center; font-size: 12px; color: var(--muted); }

/* study plan */
.plan { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.plan-step { display: grid; gap: 6px; padding: 16px; border-top: 3px solid var(--accent); background: var(--surface); border-radius: 0 0 var(--r) var(--r); }
.plan-step .eyebrow { color: var(--accent); }
.plan-step h3 { font-size: 16px; }
.plan-step p { font-size: 13.5px; color: var(--muted); }
.method { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.method div { padding: 14px 16px; display: grid; gap: 4px; }
.method div + div { border-left: 1px solid var(--line); }
.method strong { font-family: var(--f-display); font-size: 15px; }
.method span { color: var(--muted); font-size: 13.5px; }

/* topic cards */
.part-title { display: flex; align-items: baseline; gap: 12px; margin: 6px 0 12px; }
.part-title h3 { font-size: 18px; }
.part-title span { color: var(--muted); font-size: 13.5px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.tcard {
  display: grid; grid-template-rows: auto 1fr auto; gap: 10px; padding: 16px 16px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--ink);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.tcard:hover { border-color: var(--stage); box-shadow: var(--shadow); }
.tcard-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tcard h4 { font-size: 18px; }
.stage-pill { font: 600 10.5px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--stage); padding: 4px 7px; border-radius: 20px; border: 1px solid currentColor; }
.tcard p { color: var(--muted); font-size: 13.5px; }
.progress { display: grid; gap: 5px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { display: flex; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; }
.bar .k { background: var(--good); }
.bar .r { background: var(--warn); }

/* ---------- topic page ---------- */
.crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.topic-head { display: grid; gap: 12px; }
.topic-head h1 { font-size: clamp(30px, 4.6vw, 46px); font-weight: 800; letter-spacing: -0.03em; }
.topic-head .tagline { font-size: 17px; color: var(--muted); max-width: 60ch; }
.topic-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; color: var(--muted); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-top: 6px; overflow-x: auto; }
.tab { padding: 10px 14px; border: 0; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 600; color: var(--muted); text-decoration: none; white-space: nowrap; font-size: 14px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab small { font-weight: 500; margin-left: 4px; font-variant-numeric: tabular-nums; }

.intro { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; }
.intro-what p { font-size: 16px; max-width: 64ch; }
.analogy { padding: 16px 18px; border-radius: var(--r); background: var(--accent-soft); display: grid; gap: 6px; }
.analogy .eyebrow { color: var(--accent); }
.analogy p { font-size: 14.5px; }
.story { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; padding: 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.story svg { width: 40px; height: 40px; color: var(--stage); }
.story h3 { font-size: 15px; margin-bottom: 4px; }
.story p { color: var(--ink); font-size: 14.5px; max-width: 70ch; }

.concepts { display: grid; gap: 14px; counter-reset: c; }
.concept { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 14px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.concept::before { counter-increment: c; content: counter(c); grid-row: 1 / span 4; width: 30px; height: 30px; border-radius: 8px; background: var(--sunken); border: 1px solid var(--line); display: grid; place-items: center; font: 700 14px/1 var(--f-display); color: var(--stage); }
.concept h3 { font-size: 18px; margin-bottom: 4px; }
.concept > p { max-width: 70ch; }
.example { margin-top: 10px; padding: 12px 14px; border-left: 3px solid var(--stage); background: var(--bg); border-radius: 0 8px 8px 0; display: grid; gap: 4px; }
.example .eyebrow { color: var(--stage); }
.example p { font-size: 14px; }
.related { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.qchip { font: 500 12px/1 var(--f-mono); padding: 5px 7px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-decoration: none; }
.qchip:hover { border-color: var(--accent); color: var(--accent); }

.code { position: relative; margin-top: 10px; border-radius: 8px; background: var(--code-bg); color: var(--code-ink); }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-size: 12.8px; line-height: 1.6; tab-size: 4; }
.code .lang { position: absolute; top: 8px; right: 54px; font: 500 10.5px/1 var(--f-mono); color: var(--code-com); text-transform: uppercase; letter-spacing: .06em; }
.code .copy { position: absolute; top: 5px; right: 6px; border: 1px solid #ffffff22; background: #ffffff10; color: var(--code-ink); border-radius: 5px; font-size: 11px; padding: 3px 7px; }
.code .copy:hover { background: #ffffff22; }
.tk-k { color: var(--code-kw); }
.tk-s { color: var(--code-str); }
.tk-c { color: var(--code-com); font-style: italic; }
.tk-n { color: var(--code-num); }
.tk-t { color: var(--code-tpl); }

.pitfalls { display: grid; gap: 10px; padding: 18px 20px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.pitfalls h3 { font-size: 17px; }
.pitfalls ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.pitfalls li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 14.5px; }
.pitfalls li::before { content: "!"; width: 18px; height: 18px; border-radius: 50%; background: var(--advanced-bg); color: var(--advanced); font: 700 11px/18px var(--f-display); text-align: center; margin-top: 2px; }
.next-cta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 18px 20px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.next-cta p { color: var(--muted); }

/* questions */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.field { flex: 1 1 240px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.field input { flex: 1; min-width: 0; border: 0; background: none; padding: 9px 0; font: inherit; color: var(--ink); outline: none; }
.field:focus-within { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 11px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
select.chip { padding-right: 8px; }
.list-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.list-meta button { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 13px; padding: 0; }
.qlist { display: grid; gap: 8px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; scroll-margin-top: 70px; }
.q.flash { animation: flash 1.4s ease; }
@keyframes flash { 0%, 40% { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); } }
.q-head { width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 14px 16px; border: 0; background: none; text-align: left; }
.q-num { font: 500 12.5px/1.6 var(--f-mono); color: var(--muted); padding-top: 1px; font-variant-numeric: tabular-nums; }
.q-text { font-weight: 500; font-size: 15px; }
.q-side { display: flex; gap: 6px; align-items: center; padding-top: 2px; }
.lvl { font: 600 10.5px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 5px; white-space: nowrap; }
.lvl-core { color: var(--core); background: var(--core-bg); }
.lvl-applied { color: var(--applied); background: var(--applied-bg); }
.lvl-advanced { color: var(--advanced); background: var(--advanced-bg); }
.lvl-scenario { color: var(--scenario); background: var(--scenario-bg); }
.st { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; }
.st.known { background: var(--good); border-color: var(--good); }
.st.review { background: var(--warn); border-color: var(--warn); }
.chev { width: 16px; height: 16px; color: var(--muted); transition: transform .2s ease; }
.q-head[aria-expanded="true"] .chev { transform: rotate(180deg); }
.q-body { padding: 0 16px 16px 70px; display: grid; gap: 14px; }
.ans { font-size: 15px; line-height: 1.7; max-width: 74ch; border-left: 2px solid var(--line); padding-left: 14px; }
.ans mark, .q-text mark, .res mark { background: #ffd86a66; color: inherit; border-radius: 2px; }
.q-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.mark-btn { padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; font-weight: 600; }
.mark-btn.known:hover, .mark-btn.known[aria-pressed="true"] { border-color: var(--good); color: var(--good); }
.mark-btn.review:hover, .mark-btn.review[aria-pressed="true"] { border-color: var(--warn); color: var(--warn); }
.empty { padding: 30px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }

/* flashcards */
.deck { display: grid; gap: 14px; max-width: 760px; width: 100%; margin: 0 auto; }
.deck-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.deck-bar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.deck-bar i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.fcard { min-height: 300px; padding: 28px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; align-content: center; gap: 16px; }
.fcard .fq { font: 700 clamp(19px, 2.6vw, 24px)/1.3 var(--f-display); letter-spacing: -0.01em; text-wrap: balance; }
.fcard .fa { font-size: 15.5px; line-height: 1.7; border-top: 1px solid var(--line); padding-top: 16px; }
.fcard .hint { color: var(--muted); font-size: 13.5px; }
.fcard.flipped { animation: flip .28s ease; }
@keyframes flip { from { transform: rotateX(8deg); opacity: .6; } to { transform: none; opacity: 1; } }
.deck-ctrl { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.deck-ctrl .btn { min-width: 150px; justify-content: center; }
.btn.good { border-color: var(--good); color: var(--good); }
.btn.again { border-color: var(--warn); color: var(--warn); }
.deck-done { text-align: center; display: grid; gap: 12px; justify-items: center; padding: 30px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.deck-done h3 { font-size: 24px; }

/* practice */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 16px; }
.panel h3 { font-size: 16px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.mode { display: grid; gap: 4px; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); text-align: left; }
.mode strong { font-size: 14px; }
.mode span { font-size: 12.5px; color: var(--muted); }
.mode em { font-style: normal; font: 700 18px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.mode[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.ptable-wrap { overflow-x: auto; }
.ptable { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px; }
.ptable th { text-align: left; font: 600 11px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.ptable td { padding: 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.ptable td:first-child a { color: var(--ink); text-decoration: none; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
.ptable td:first-child a:hover { color: var(--accent); }
.ptable .bar { width: 160px; }
.reset { border: 0; background: none; color: var(--muted); font-size: 12.5px; text-decoration: underline; padding: 0; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }

/* search overlay */
.overlay { position: fixed; inset: 0; background: rgba(8,14,24,.5); z-index: 50; display: flex; justify-content: center; align-items: flex-start; padding: max(10vh, env(safe-area-inset-top, 0px)) 16px 16px; }
.sbox { width: min(720px, 100%); max-height: 78vh; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden; }
.sbox .field { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 4px 16px; flex: none; }
.sbox .field input { font-size: 16px; padding: 12px 0; }
.results { overflow-y: auto; padding: 6px; }
.res { display: grid; gap: 3px; padding: 10px 12px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.res:hover, .res.sel { background: var(--accent-soft); }
.res .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.res .rq { font-weight: 500; font-size: 14.5px; }
.res .ra { font-size: 13px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.sfoot { padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }

/* ---------- responsive ---------- */
@media (max-width: 1000px) {
  .intro { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 40; transform: translateX(-102%); transition: transform .22s ease; padding-top: calc(20px + env(safe-area-inset-top, 0px)); box-shadow: var(--shadow); }
  .rail.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(8,14,24,.45); z-index: 39; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .icon-btn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; width: 38px; height: 38px; display: grid; place-items: center; }
  .tabs { top: calc(59px + env(safe-area-inset-top, 0px)); }
  .main { padding-block: 22px 60px; }
  .q-body { padding-left: 16px; }
  .method div + div { border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 520px) {
  .q-head { grid-template-columns: 36px minmax(0, 1fr); }
  .q-side { grid-column: 2; padding-top: 0; }
  .concept { grid-template-columns: minmax(0, 1fr); }
  .concept::before { grid-row: auto; }
  .story { grid-template-columns: minmax(0, 1fr); }
  .fcard { padding: 20px; min-height: 260px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>
window.QB = [{"id": "powerbi", "name": "Power BI", "questions": [{"n": 1, "q": "What are the main components of Power BI (Desktop, Service, Report Server, Mobile) and when do you use each?", "a": "Desktop is the free authoring tool for models and reports; Service is the cloud platform for sharing, refresh, apps, and governance; Report Server is on-premises hosting for restricted environments; Mobile is the consumption app. Author in Desktop, deploy and manage in Service."}, {"n": 2, "q": "Explain the difference between Import, DirectQuery, Dual, and Live Connection storage modes. What are the trade-offs of each?", "a": "Import copies compressed data into VertiPaq — fastest queries, needs refresh. DirectQuery leaves data at source — real-time but slower and feature-limited. Dual lets a table act as either depending on the query. Live Connection points to an existing model (AAS/Power BI dataset) with no local model. Trade-off: performance vs freshness vs data volume."}, {"n": 3, "q": "What is a composite model and when would you use one?", "a": "A composite model mixes Import and DirectQuery sources (or extends a live-connected dataset with local tables) in one model. Use it to blend a large DirectQuery fact with imported dimensions, or to add local data to a certified enterprise model."}, {"n": 4, "q": "Walk through the difference between a dataset (semantic model), a report, a dashboard, and an app in the Power BI Service.", "a": "A semantic model holds tables, relationships, and measures; a report is a multi-page visual layer bound to one model; a dashboard pins tiles from multiple reports for at-a-glance monitoring; an app packages workspaces content for distribution to audiences."}, {"n": 5, "q": "What is the VertiPaq engine and how does its columnar compression work? Why does cardinality matter for model size?", "a": "VertiPaq is the in-memory columnar engine: each column is encoded (value/dictionary/RLE) and compressed independently. Compression depends on distinct values, so high-cardinality columns (IDs, timestamps) inflate model size — reduce cardinality (split datetime, remove keys) to shrink models."}, {"n": 6, "q": "What is Power Query (M) and how does it differ from DAX? Where does each execute?", "a": "Power Query (M) shapes data before load — extraction, cleaning, joins; it runs at refresh time. DAX defines calculations evaluated at query time inside the model. Rule of thumb: transform as upstream as possible (source/M), calculate business logic in DAX measures."}, {"n": 7, "q": "What is query folding, why is it important, and how do you check whether a step folds?", "a": "Query folding pushes M steps back to the source as native SQL, so filtering and joins happen in the database instead of the mashup engine — critical for refresh performance and required for incremental refresh. Check via right-click 'View native query' or query diagnostics; steps like adding index columns break folding."}, {"n": 8, "q": "How do you design a star schema in Power BI? Why is a star schema preferred over a flat table or snowflake?", "a": "Model facts at the correct grain in the center, one dimension table per entity, single-direction 1:many relationships from dimensions to facts. Star schemas give predictable filter propagation, simpler DAX, and better VertiPaq performance; flat tables bloat cardinality and snowflakes add join hops and complexity."}, {"n": 9, "q": "What is the difference between a fact table and a dimension table? Give examples of degenerate and junk dimensions.", "a": "Facts hold events/measurements at a declared grain (order lines, shipments); dimensions hold descriptive context (customer, product, date). A degenerate dimension is an attribute like invoice number kept on the fact; a junk dimension groups miscellaneous low-cardinality flags into one table."}, {"n": 10, "q": "How do relationships work in Power BI? Explain cardinality (1:1, 1:many, many:many) and cross-filter direction (single vs both).", "a": "Relationships propagate filters between tables. Cardinality describes key uniqueness on each side (1:1, 1:many, many:many). Cross-filter direction controls propagation: single (dimension→fact, default and safest) or both. Filters flow along relationship paths at query time."}, {"n": 11, "q": "What are the risks of bidirectional relationships and many-to-many relationships? How do you handle them safely?", "a": "Bidirectional filters create ambiguity, circular paths, and performance costs; many-to-many loses guaranteed uniqueness so totals can surprise. Prefer single direction plus CROSSFILTER in specific measures, or model a proper bridge table with controlled filter direction."}, {"n": 12, "q": "What is a bridge table and when do you need one?", "a": "A bridge table resolves genuine many-to-many relationships (e.g., one account belongs to multiple customers) by holding the key pairs. Both entities relate 1:many into the bridge, often with one bidirectional edge or TREATAS to propagate filters correctly."}, {"n": 13, "q": "How do you handle role-playing dimensions (e.g., Order Date vs Ship Date) in Power BI?", "a": "Create one physical date table and multiple relationships to the fact (order date active, ship date inactive), then activate the inactive one per-measure with USERELATIONSHIP. Alternatively duplicate the date dimension when users need simultaneous independent slicing."}, {"n": 14, "q": "Explain Row-Level Security (RLS): static vs dynamic RLS, USERPRINCIPALNAME(), and how roles are tested and assigned.", "a": "RLS filters rows per user via DAX on roles. Static RLS hardcodes filters per role; dynamic RLS filters with USERPRINCIPALNAME() against a security/mapping table, scaling to thousands of users with one role. Test with 'View as role' in Desktop and assign members in the Service; RLS applies to viewers, not workspace editors."}, {"n": 15, "q": "What is Object-Level Security (OLS) and how does it differ from RLS?", "a": "OLS hides entire tables or columns from specified roles (defined via Tabular Editor), securing the metadata itself — a secured column errors rather than filters. RLS restricts rows; OLS restricts schema objects like a sensitive salary column."}, {"n": 16, "q": "What is incremental refresh? Explain RangeStart/RangeEnd parameters, partitions, and the 'detect data changes' option.", "a": "Incremental refresh partitions a large table by date and refreshes only recent partitions. You define RangeStart/RangeEnd parameters, filter the source on them (must fold), then set archive/refresh windows. 'Detect data changes' refreshes only partitions whose max update timestamp changed."}, {"n": 17, "q": "What are aggregation tables and how does Power BI decide when to hit the aggregation vs the detail table?", "a": "Aggregation tables pre-summarize facts at coarser grain (imported) over a DirectQuery detail table. The engine transparently answers queries from the agg when the query's grain and columns are covered by mappings, falling back to detail otherwise — giving speed on big data with drill-to-detail."}, {"n": 18, "q": "What is the difference between calculated columns, calculated tables, and measures? When is each appropriate, and what are the memory implications?", "a": "Calculated columns are computed row-by-row at refresh and stored (consume memory, materialized); calculated tables similarly materialize DAX results; measures compute at query time in filter context and store nothing. Prefer measures for aggregations; push static columns to source/M."}, {"n": 19, "q": "How do you optimize a slow Power BI report? Describe your end-to-end approach (Performance Analyzer, DAX Studio, model review, visual reduction).", "a": "Measure with Performance Analyzer to find slow visuals, copy the DAX into DAX Studio for server timings (SE vs FE), inspect model with VertiPaq Analyzer for oversized columns, fix relationships/cardinality, simplify DAX (avoid iterators over facts), reduce visuals per page, and consider aggregations or Direct Lake."}, {"n": 20, "q": "What is DAX Studio / Tabular Editor and what do you use them for (server timings, VertiPaq Analyzer, calculation groups, scripting)?", "a": "DAX Studio runs queries with server timings and query plans, and hosts VertiPaq Analyzer for column-size diagnostics. Tabular Editor edits models at scale — calculation groups, OLS, scripting bulk measure changes, Best Practice Analyzer — beyond Desktop's UI."}, {"n": 21, "q": "What are calculation groups and what problems do they solve?", "a": "Calculation groups apply reusable calculation items (YTD, PY, YoY%) over any selected measure via SELECTEDMEASURE(), replacing dozens of near-duplicate time-intelligence measures with one maintainable structure. They also enable dynamic format strings."}, {"n": 22, "q": "What are dataflows (Gen1/Gen2) and how do they differ from datasets? When would you centralize transformations in a dataflow?", "a": "Dataflows are self-contained Power Query transformations stored in the Service (Gen2 writes to Fabric destinations), reusable across multiple datasets. Centralize shared cleansing logic in a dataflow so many models consume one certified, transformed source instead of duplicating M."}, {"n": 23, "q": "What are deployment pipelines in Power BI and how do you promote content across Dev/Test/Prod?", "a": "Deployment pipelines promote content through Dev → Test → Prod workspaces with compare views and deployment rules that rebind data sources/parameters per stage — enabling controlled releases instead of manual republish."}, {"n": 24, "q": "How does Power BI integrate with Git / Azure DevOps for version control (PBIP format, TMDL)?", "a": "PBIP saves reports/models as folder-based text files (model as TMDL), enabling real Git workflows: commit from Desktop, sync workspaces to Azure DevOps/GitHub branches, review diffs in PRs, and branch out per developer."}, {"n": 25, "q": "What is the XMLA endpoint and what advanced scenarios does it enable?", "a": "The XMLA endpoint exposes Premium/Fabric datasets as Analysis Services servers: connect Tabular Editor/DAX Studio, deploy models programmatically, manage partitions, run DAX/TMSL, and enable enterprise CI/CD and fine-grained refresh."}, {"n": 26, "q": "Explain workspace roles (Admin, Member, Contributor, Viewer) and how app audiences control access.", "a": "Admin has full control including deletion; Member can publish/share; Contributor can edit content but not manage access; Viewer is read-only. Apps add audience-level control so consumers see curated content without workspace access."}, {"n": 27, "q": "What is a shared/certified/promoted dataset and why does endorsement matter in a large organization?", "a": "A shared dataset is consumed by reports across workspaces ('one model, many reports'). Promotion is a self-declared quality flag; certification is centrally governed endorsement. Endorsement steers analysts to trusted models, reducing metric sprawl and duplicated logic."}, {"n": 28, "q": "How do you implement drillthrough, drill down, and tooltips pages? How do they differ?", "a": "Drill down navigates a hierarchy within one visual; drillthrough jumps to a detail page filtered to the selected data point; tooltip pages show a mini report page on hover. Drillthrough carries context via drillthrough filters (and optionally all filters)."}, {"n": 29, "q": "What are bookmarks and how do you use them for navigation and toggling visuals?", "a": "Bookmarks capture report state — filters, slicers, visual visibility — and are triggered by buttons for navigation, view toggles, and reset-to-default experiences. Combine with selection pane to build tab-like interfaces."}, {"n": 30, "q": "What are field parameters and what UX problems do they solve compared to bookmarks?", "a": "Field parameters let users swap the dimension or measure a visual displays via slicer, generating a real parameter table — cleaner and more scalable than maintaining bookmark permutations for metric/axis switching."}, {"n": 31, "q": "How do slicers, filters (visual/page/report level), and filter pane differ? How does slicer selection affect filter context?", "a": "Slicers are on-canvas filters affecting the page (or synced pages); the filter pane offers visual, page, and report-level filters with more conditions and less canvas cost. All ultimately modify the filter context that measures evaluate in."}, {"n": 32, "q": "What is the difference between a live connection to a dataset and a local model? What is 'edit data model' on a live connection (composite over Power BI datasets)?", "a": "Live connection binds a report to a remote model with no local modeling. Composite over a Power BI dataset ('DirectQuery for PBI datasets') converts it to a local model that can add tables and measures while chaining to the enterprise model — powerful but adds a query hop."}, {"n": 33, "q": "How do you handle large datasets that exceed Pro limits (Premium/Fabric capacities, large semantic model format)?", "a": "Use Premium/Fabric capacity with the large semantic model format (removes the ~10 GB effective ceiling), incremental refresh, aggregations over DirectQuery, or Direct Lake in Fabric. Also reduce model size: drop columns, lower cardinality, disable auto date/time."}, {"n": 34, "q": "What licensing options exist (Free, Pro, PPU, Premium/Fabric capacity) and what capabilities does each unlock?", "a": "Free authors personal content; Pro enables sharing and workspace collaboration (per-user); PPU adds Premium features per-user (larger models, XMLA, more refreshes); Premium/Fabric capacity (P/F SKUs) provides dedicated compute, large models, and — at F64+ — free viewer access."}, {"n": 35, "q": "How does scheduled refresh work? What is a gateway, and when do you need a personal vs standard (enterprise) gateway?", "a": "Scheduled refresh re-imports data on a timetable (8/day Pro, 48 PPU/Premium). A gateway is on-prem software bridging the Service to private sources: personal is single-user Desktop-style, standard/enterprise is centrally managed with clusters for HA and multiple sources."}, {"n": 36, "q": "What causes refresh failures most often and how do you troubleshoot them?", "a": "Common causes: expired credentials, gateway offline or outdated, source schema changes breaking queries, timeouts on non-folding queries, and memory limits. Troubleshoot via refresh history error details, gateway logs, testing the query in Desktop, and validating folding."}, {"n": 37, "q": "How do you implement dynamic formatting or dynamic titles based on slicer selection?", "a": "Create a measure returning formatted text (SELECTEDVALUE + FORMAT) for titles via conditional formatting fx, or dynamic format strings (calculation groups/model measures) for value formatting that responds to selection."}, {"n": 38, "q": "What is the difference between duplicate and reference queries in Power Query, and how does it affect refresh?", "a": "Reference creates a query that reads another query's output, chaining logic (each reference may re-evaluate the source per load); duplicate copies the M code independently. References aid maintainability but can multiply source calls — staging via dataflows avoids this."}, {"n": 39, "q": "How do you handle slowly changing dimensions (SCD Type 1 vs Type 2) in a Power BI model?", "a": "Handle SCD upstream ideally; in-model, Type 1 simply overwrites attributes on refresh. Type 2 requires the source/warehouse to provide versioned rows with surrogate keys and effective dates — the fact joins on the surrogate key so history is preserved; Power BI just models the result."}, {"n": 40, "q": "How do you model and visualize a parent-child hierarchy (e.g., org chart, chart of accounts) in Power BI?", "a": "Use PATH functions (PATH, PATHITEM) in calculated columns to flatten the parent-child recursion into level columns, build a hierarchy from them, and handle ragged depth with ISINSCOPE-based measures."}, {"n": 41, "q": "What are the best practices for date/calendar tables? Why should you mark a table as a date table?", "a": "Use a dedicated date table spanning full years, one row per day, with year/month/quarter columns, related to facts on a date key. Mark it as a date table so time intelligence works on the key and Power BI trusts its completeness."}, {"n": 42, "q": "What is auto date/time and why is it usually recommended to turn it off?", "a": "Auto date/time silently builds a hidden date hierarchy table per date column, bloating the model and encouraging inconsistent time logic. Disable it and use a single marked date dimension instead."}, {"n": 43, "q": "How do you implement currency conversion or unit conversion in a semantic model?", "a": "Store rates in a table (date × currency), and convert via measures: multiply base amounts by the selected currency's rate using TREATAS/relationships at the correct grain. Decide converting at transaction vs reporting grain, and handle missing rates explicitly."}, {"n": 44, "q": "How do you audit and document a semantic model (Best Practice Analyzer, INFO functions, external tools)?", "a": "Run Best Practice Analyzer in Tabular Editor for rule-based auditing, use INFO/DMV queries or VertiPaq Analyzer to inventory columns and sizes, document measures with descriptions, and export documentation from model metadata (TMDL diffs in Git aid review)."}, {"n": 45, "q": "What is DirectLake mode (Fabric) and how does it differ from Import and DirectQuery?", "a": "Direct Lake reads Delta Parquet files in OneLake directly into VertiPaq-style columnar memory on demand — Import-level speed without scheduled copy refresh. It falls back to DirectQuery when features/limits are exceeded, and 'framing' controls which data version is seen."}, {"n": 46, "q": "How do you handle report accessibility and usability (themes, consistent formatting, tab order, alt text)?", "a": "Use consistent themes (JSON theme files), readable contrast, alt text on visuals, logical tab order, meaningful titles, and avoid conveying meaning by color alone — improving usability for all users and meeting accessibility requirements."}, {"n": 47, "q": "How would you design a semantic model to serve both self-service analysts and standardized executive reporting?", "a": "Publish one certified semantic model with clean naming, folder-organized measures, and RLS; executives get curated apps/reports on it, while analysts connect via 'live connect' or Analyze in Excel for self-service — one governed truth, two consumption modes."}, {"n": 48, "q": "Describe a time you reduced a model's size or refresh time significantly. What levers did you pull?", "a": "Strong answers name concrete levers: removed high-cardinality columns, split datetime into date+time, replaced calculated columns with source columns, enabled incremental refresh, fixed non-folding steps, and pre-aggregated a billion-row fact — with before/after numbers."}, {"n": 49, "q": "How do you embed Power BI content (Publish to web vs secure embed vs Power BI Embedded) and what are the security implications?", "a": "Publish to web is anonymous public embedding — never for confidential data. Secure embed and Embed in SharePoint respect AAD auth and RLS. Power BI Embedded (APIs + capacity) serves external apps with app-owns-data tokens; security hinges on token scope and RLS."}, {"n": 50, "q": "A stakeholder says 'the numbers are wrong' in a report. Walk through your systematic debugging process from visual to source.", "a": "Reproduce the number, identify the visual's filter context (Performance Analyzer captures the DAX), test the measure in isolation, check slicers/filters/RLS, validate relationships (fan-out, missing keys), trace to Silver/source with SQL, and compare grain and dedup logic — communicate findings with evidence."}]}, {"id": "dax", "name": "DAX", "questions": [{"n": 1, "q": "What is evaluation context in DAX? Explain row context and filter context with examples.", "a": "Evaluation context is the environment a DAX expression evaluates in. Row context is 'the current row' (calculated columns, iterators); filter context is the set of filters (slicers, visual coordinates, CALCULATE) restricting the model. Measures see only filter context unless an iterator creates row context."}, {"n": 2, "q": "What does CALCULATE actually do? Explain context transition and filter arguments.", "a": "CALCULATE evaluates an expression in a modified filter context: it transforms existing row contexts into equivalent filter contexts (context transition), then applies its filter arguments (overwriting same-column filters by default). It is the only function that changes filter context."}, {"n": 3, "q": "What is context transition and when does it happen implicitly?", "a": "Context transition converts the current row context into filter context — each column of the iterated row becomes a filter. It happens implicitly whenever a measure is referenced inside row context (measures are wrapped in CALCULATE), e.g., inside SUMX or a calculated column."}, {"n": 4, "q": "Explain the difference between SUM and SUMX. When do you need an iterator?", "a": "SUM aggregates a single column; SUMX iterates a table evaluating an expression per row, then sums. You need an iterator when the calculation involves row-level logic first, like SUMX(Sales, Sales[Qty]*Sales[Price])."}, {"n": 5, "q": "What are the performance implications of iterators over large tables? How do you minimize them?", "a": "Iterators over large tables are fine when the expression is simple (storage-engine friendly) but slow when they force formula-engine work per row — nested measures with context transitions, IF/complex logic, or callbacks. Minimize by pre-computing columns upstream, simplifying expressions, and iterating smaller tables (VALUES of a dimension)."}, {"n": 6, "q": "What is the difference between ALL, ALLSELECTED, ALLEXCEPT, and REMOVEFILTERS?", "a": "ALL removes filters from a table/column (also usable as a table function). ALLSELECTED restores the 'outer' filter context of the visual, respecting slicers. ALLEXCEPT removes all filters on a table except listed columns. REMOVEFILTERS is a clearer, filter-only alias for ALL."}, {"n": 7, "q": "Explain FILTER vs direct boolean filter arguments in CALCULATE. Which is faster and why?", "a": "A boolean argument like Sales[Region]=\"West\" is sugar for FILTER(ALL(Sales[Region]), ...) — it operates on one column efficiently. Explicit FILTER over a whole table iterates every row, keeps other filters, and is slower; use boolean predicates where possible and FILTER only for row-by-row multi-column logic."}, {"n": 8, "q": "What does KEEPFILTERS do and when do you need it?", "a": "KEEPFILTERS intersects a CALCULATE filter with the existing filter context instead of overwriting it — so filtering to 'Red' inside a visual sliced to 'Blue' yields empty rather than switching to Red. Use it when you must respect user selections while adding conditions."}, {"n": 9, "q": "What is the difference between VALUES, DISTINCT, and ALL on a column?", "a": "ALL returns all values ignoring filter context (including blank row from invalid relationships); DISTINCT returns distinct visible values without the blank relationship row; VALUES returns visible values including the blank row when referential integrity is violated."}, {"n": 10, "q": "How do RELATED and RELATEDTABLE work, and what contexts do they require?", "a": "RELATED fetches a column value from the one-side following a many→one relationship and requires row context. RELATEDTABLE goes the other way, returning the related many-side rows for the current row (it's CALCULATETABLE, so it performs context transition)."}, {"n": 11, "q": "What does USERELATIONSHIP do? Give a role-playing dimension example.", "a": "USERELATIONSHIP activates an inactive relationship for one calculation: CALCULATE([Sales], USERELATIONSHIP(Sales[ShipDate], 'Date'[Date])) computes sales by ship date while the order-date relationship stays active elsewhere."}, {"n": 12, "q": "What is CROSSFILTER and when would you change filter direction in a measure?", "a": "CROSSFILTER changes a relationship's filter direction (or disables it) within a calculation — e.g., enabling both-direction filtering for a distinct-count across a bridge without making the model globally bidirectional."}, {"n": 13, "q": "Explain variables (VAR/RETURN) in DAX. How do they affect both readability and performance? When are variables evaluated?", "a": "Variables store a value/table once, evaluated where defined (not where used), improving performance by avoiding repeated evaluation and improving readability. Key subtlety: a VAR captured before CALCULATE keeps its original context — useful for 'freeze this value' patterns."}, {"n": 14, "q": "What is the difference between a measure and a calculated column in terms of evaluation context and storage?", "a": "A calculated column computes once per row at refresh with row context and is stored in the model; a measure computes at query time in filter context and stores nothing. Columns are for slicing/grouping values; measures are for aggregations."}, {"n": 15, "q": "Write and explain a year-to-date (YTD) measure. What does TOTALYTD require from the date table?", "a": "Total YTD = TOTALYTD([Sales], 'Date'[Date]) or CALCULATE([Sales], DATESYTD('Date'[Date])). It requires a contiguous, marked date table covering full years; DATESYTD replaces the date filter with 1-Jan-through-current-max range."}, {"n": 16, "q": "How do you compute year-over-year (YoY) growth? Compare SAMEPERIODLASTYEAR, DATEADD, and PARALLELPERIOD.", "a": "YoY% = DIVIDE([Sales] - [Sales PY], [Sales PY]) with Sales PY = CALCULATE([Sales], SAMEPERIODLASTYEAR('Date'[Date])). SAMEPERIODLASTYEAR shifts the selected dates back one year; DATEADD is the general shifter (any interval, handles partial periods); PARALLELPERIOD returns whole parallel periods regardless of partial selection."}, {"n": 17, "q": "How do you build a rolling 12-month (or N-day moving average) measure?", "a": "Rolling 12M = CALCULATE([Sales], DATESINPERIOD('Date'[Date], MAX('Date'[Date]), -12, MONTH)). For N-day averages, divide the rolling sum by distinct days in the window; anchor on MAX of date to roll from the current context's edge."}, {"n": 18, "q": "How do time intelligence functions behave with non-standard calendars (4-4-5, fiscal years)? What alternatives exist?", "a": "Built-in time intelligence assumes standard Gregorian calendars; 4-4-5/fiscal calendars break SAMEPERIODLASTYEAR-style logic. Alternatives: enrich the date table with fiscal period columns and write custom logic (offset columns like YearOffset/MonthOffset enable simple filter arithmetic)."}, {"n": 19, "q": "What is the difference between DATESINPERIOD and DATESBETWEEN?", "a": "DATESINPERIOD returns a rolling window of a given length back/forward from a start date (e.g., last 12 months); DATESBETWEEN returns dates between two explicit boundary dates you compute yourself."}, {"n": 20, "q": "How do you calculate 'sales of the last non-empty date' (semi-additive measures, e.g., inventory or account balances)?", "a": "Use LASTNONBLANK/LASTNONBLANKVALUE or CALCULATE(SUM(Balance), LASTNONBLANK('Date'[Date], [Balance])) so period totals show the closing value instead of summing daily snapshots — the semi-additive pattern for balances and inventory."}, {"n": 21, "q": "Explain RANKX. What are common pitfalls (ties, context, using the measure inside RANKX)?", "a": "RANKX(ALL(Dim[Col]), [Measure]) ranks the current context's measure value against the measure evaluated over each ranked row. Pitfalls: forgetting ALL (everything ranks 1), ties defaulting to SKIP, ranking by an expression not matching the displayed measure, and blank handling."}, {"n": 22, "q": "How does TOPN work and how do you handle ties?", "a": "TOPN returns the top N rows of a table by an expression — typically wrapped in CALCULATE([Sales], TOPN(...)) or used for top-N visuals. Ties: TOPN returns more than N rows when boundary values tie, so handle deterministic tiebreakers (add a second sort expression)."}, {"n": 23, "q": "What is the difference between SUMMARIZE, SUMMARIZECOLUMNS, and ADDCOLUMNS+SUMMARIZE best practice?", "a": "SUMMARIZE groups a table by columns (safe for grouping, risky for adding computed columns due to context ambiguity); ADDCOLUMNS(SUMMARIZE(...), ...) is the recommended pattern to group then compute; SUMMARIZECOLUMNS is the modern, optimized query-level function (used by visuals) but has limitations inside measures."}, {"n": 24, "q": "What do TREATAS, INTERSECT, and virtual relationships do? When would you use TREATAS instead of a physical relationship?", "a": "TREATAS applies a table's values as filters onto target columns without a physical relationship — powering virtual relationships (e.g., filtering by a disconnected parameter table). INTERSECT/EXCEPT do set operations on tables; TREATAS is preferred for lineage-preserving virtual filters when a physical relationship isn't possible."}, {"n": 25, "q": "What is expanded table theory and how does it explain RELATED and filter propagation?", "a": "Each table logically 'expands' to include all one-side related tables' columns. Filters on a table filter its expanded version — explaining why filtering a dimension filters facts, how RELATED works (reading expanded columns), and subtle behaviors of ALL on expanded tables."}, {"n": 26, "q": "What is the difference between ISFILTERED, ISCROSSFILTERED, HASONEVALUE, HASONEFILTER, and SELECTEDVALUE?", "a": "ISFILTERED: direct filter on a column; ISCROSSFILTERED: filtered directly or via relationships; HASONEVALUE: exactly one visible value; HASONEFILTER: exactly one directly-filtered value; SELECTEDVALUE returns the single visible value or an alternate — the standard for reading slicer selections."}, {"n": 27, "q": "How do you write a measure that responds differently at different hierarchy levels (ISINSCOPE)?", "a": "Use ISINSCOPE('Dim'[Level]) to detect which hierarchy level the current cell is computing at, then SWITCH logic per level — e.g., show ratios at leaf level but sums at subtotal rows."}, {"n": 28, "q": "How do you handle division safely? DIVIDE vs the / operator.", "a": "DIVIDE(numerator, denominator [, alternate]) handles divide-by-zero/blank safely and is optimized; the / operator raises errors on zero. Use DIVIDE everywhere denominators can be zero or blank."}, {"n": 29, "q": "What is the difference between BLANK() and 0 in DAX? How do blanks propagate in visuals and how do you control them?", "a": "BLANK() is absence of value: it's ignored by aggregations, rows with blank measures are hidden in visuals by default, and BLANK()=0 is TRUE in comparisons (a classic trap). Convert deliberately (COALESCE/+0) only when display requires it."}, {"n": 30, "q": "Why can returning 0 instead of BLANK() destroy report performance on sparse data?", "a": "Returning 0 makes the measure non-blank for every dimension combination, forcing visuals to materialize the full cross-join (e.g., every customer × every product) instead of only existing combinations — turning fast sparse scans into enormous result sets."}, {"n": 31, "q": "Explain CALCULATETABLE vs FILTER for producing filtered tables.", "a": "CALCULATETABLE is CALCULATE for tables: it modifies filter context (with context transition) before evaluating a table expression — efficient for applying filters. FILTER iterates row-by-row with a predicate — needed for complex per-row conditions but slower for simple filters."}, {"n": 32, "q": "What are the storage engine (SE) and formula engine (FE) in VertiPaq? How do you identify which one is the bottleneck?", "a": "The storage engine (VertiPaq) scans compressed columns fast and parallel; the formula engine executes the query plan single-threaded and handles complex logic. In DAX Studio server timings, high SE% with few queries is healthy; high FE time or huge SE result rows indicate the bottleneck."}, {"n": 33, "q": "What is a CallbackDataID and why is it bad for performance?", "a": "A CallbackDataID appears when the storage engine must call the formula engine per row (e.g., IF or error-handling inside an iterated expression) — it disables SE caching and parallel efficiency. Refactor expressions (remove IFs from tight loops, use DIVIDE, pre-compute columns) to eliminate them."}, {"n": 34, "q": "How do you read a DAX query plan / server timings in DAX Studio?", "a": "Focus on: total duration split FE vs SE, number of SE queries and their rows/KB returned (huge materializations are red flags), CallbackDataID presence, and repeated identical SE queries (missing cache reuse). Optimize the biggest SE materialization or FE-heavy operation first."}, {"n": 35, "q": "What does EVALUATE do? Write a basic DAX query with DEFINE MEASURE for testing.", "a": "EVALUATE is the DAX query statement returning a table: DEFINE MEASURE Sales[Test] = ... EVALUATE SUMMARIZECOLUMNS('Date'[Year], \"Sales\", [Test]) — the standard way to test measures in DAX Studio/DAX query view without touching the model."}, {"n": 36, "q": "What are calculation groups and how do calculation items with SELECTEDMEASURE() work? What is precedence?", "a": "Calculation items are DAX expressions applied over SELECTEDMEASURE() — e.g., a 'PY' item wraps any measure in SAMEPERIODLASTYEAR. Precedence orders application when multiple calculation groups are active; lower precedence applies first (closest to the measure)."}, {"n": 37, "q": "How do you implement dynamic measure selection (field parameters vs SWITCH-based disconnected tables)?", "a": "Field parameters swap actual fields/measures natively in visuals with automatic axis labels — preferred for UX. SWITCH-based disconnected tables (SELECTEDVALUE driving SWITCH([A],[B],...)) offer full control including conditional formatting/logic but require writing the dispatch measure."}, {"n": 38, "q": "How do you implement ABC/Pareto classification in DAX?", "a": "Compute each item's cumulative share: rank items by measure, sum measure for items with rank ≤ current (via FILTER over VALUES), divide by total, then classify with IF thresholds (A ≤70%, B ≤90%, else C) — typically as a measure or a calculated column if static slicing is needed."}, {"n": 39, "q": "How would you compute a cumulative total that works across any filter (not just dates)?", "a": "Cumulative = CALCULATE([Measure], FILTER(ALLSELECTED(Dim[Col]), Dim[Col] <= MAX(Dim[Col]))) — works for any ordered column, not just dates, by re-filtering the dimension up to the current row's value while respecting outer selections."}, {"n": 40, "q": "How do you calculate distinct customers who bought in both period A and period B (basket/cohort overlap)?", "a": "Compute each period's customer set with CALCULATETABLE(VALUES(Sales[CustomerID]), period filter), then COUNTROWS(INTERSECT(setA, setB)) — table functions and set operators express basket/cohort overlap cleanly."}, {"n": 41, "q": "How do you build a cohort retention analysis in DAX?", "a": "Tag each customer with a cohort (first purchase month, via MINX/calculated column), then for each cohort × months-since matrix cell compute DISTINCTCOUNT of active customers divided by cohort size — using offset math on the date table for the 'months since' axis."}, {"n": 42, "q": "What are the pitfalls of using FILTER over an entire fact table inside CALCULATE?", "a": "FILTER over an entire fact iterates millions of rows in the formula engine, prevents efficient SE plans, and breaks filter overwrite semantics expectations. Filter dimension columns instead, or FILTER(ALL(Fact[Column]), ...) on a single column when unavoidable."}, {"n": 43, "q": "Explain how a measure total row can differ from the sum of its parts, and how to control totals (SUMX over VALUES pattern).", "a": "Totals are not sums of visible rows — the measure re-evaluates in the total's (broader) filter context, so MAX-style, ratio, or TOPN measures diverge naturally. To force additive totals use SUMX(VALUES(Dim[Col]), [Measure]), iterating the visual's rows explicitly."}, {"n": 44, "q": "What is the 'measure branching' technique and why does it help maintainability?", "a": "Measure branching builds complex measures from small named building blocks ([Sales], [Sales PY], [YoY %]) instead of monolithic expressions — enabling reuse, easier testing, single-point fixes, and consistent logic across reports."}, {"n": 45, "q": "How do LOOKUPVALUE and RELATED differ, and why is LOOKUPVALUE often a performance smell?", "a": "RELATED follows an existing relationship (fast, engine-optimized); LOOKUPVALUE searches a table by matching column values with no relationship needed. Frequent LOOKUPVALUE usually signals a missing relationship or modeling problem, and it's slower."}, {"n": 46, "q": "What does GENERATE / GENERATEALL do? Give a practical use case.", "a": "GENERATE evaluates a second table expression for each row of the first and unions results (correlated cross join); GENERATEALL keeps rows with empty results. Use for per-group top-N tables (each category with its top products) or generating parameter combinations."}, {"n": 47, "q": "How do you debug a complex DAX measure step by step (variables returning intermediates, TOCSV/EVALUATEANDLOG, DAX query view)?", "a": "Break the measure into VARs and return intermediates one at a time; test in DAX query view with EVALUATE and known filters; use EVALUATEANDLOG or TOCSV to inspect tables; compare against hand-computed expected values on a tiny filter; check filter context with dummy measures like COUNTROWS(VALUES(...))."}, {"n": 48, "q": "What is the difference between ALLSELECTED and ALL in the context of visual totals? Why is ALLSELECTED considered tricky?", "a": "ALL ignores everything including slicers; ALLSELECTED removes only the filters introduced 'inside' the visual (rows/columns) while keeping user selections — so '% of visible total' uses ALLSELECTED. It's tricky because its result depends on shadow filter contexts, behaving unexpectedly when nested in iterators."}, {"n": 49, "q": "How do you optimize a many-to-many measure pattern over a bridge table?", "a": "Ensure the bridge is thin (just keys), keep the dimension→bridge relationship bidirectional (or use CROSSFILTER in-measure), pre-aggregate where possible, and consider replacing the M2M with a denormalized fact key or TREATAS on a smaller intermediate table if performance suffers."}, {"n": 50, "q": "You need a measure for '% of total by category, respecting slicers but ignoring the category filter itself' — write it and explain each function choice.", "a": "Pct = VAR t = CALCULATE([Sales], REMOVEFILTERS(Dim[Category])) RETURN DIVIDE([Sales], t). REMOVEFILTERS clears only the category filter so slicers on other columns still apply; DIVIDE guards zero; using ALLSELECTED(Dim[Category]) instead would make the denominator respect other visuals' cross-highlighting of category."}]}, {"id": "sql", "name": "SQL", "questions": [{"n": 1, "q": "Explain the logical order of SQL query execution (FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT) and why aliases behave the way they do.", "a": "Logical order: FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT/TOP. SELECT aliases don't exist yet in WHERE/GROUP BY (they're assigned in SELECT), but ORDER BY can use them because it runs after SELECT."}, {"n": 2, "q": "What is the difference between WHERE and HAVING?", "a": "WHERE filters rows before grouping (no aggregates allowed); HAVING filters groups after aggregation. Filter as early as possible in WHERE for performance; use HAVING only for aggregate conditions like HAVING SUM(amount) > 1000."}, {"n": 3, "q": "Explain INNER, LEFT, RIGHT, FULL OUTER, CROSS, and SELF joins with use cases.", "a": "INNER returns only matches; LEFT keeps all left rows with NULLs for non-matches (find-missing patterns); RIGHT mirrors it; FULL OUTER keeps both sides; CROSS produces the Cartesian product (date scaffolds); SELF joins a table to itself (employees to managers, row-to-previous-row pre-window-functions)."}, {"n": 4, "q": "What happens to row counts when you join on a non-unique key? How do you detect and handle join fan-out (duplication)?", "a": "Joining on a non-unique key multiplies rows (fan-out): each left row repeats per matching right row, inflating aggregates. Detect by comparing pre/post counts or GROUP BY key HAVING COUNT(*)>1 on the join key; fix by deduplicating/aggregating the many-side to the join grain first."}, {"n": 5, "q": "What is the difference between UNION and UNION ALL, and the performance implication?", "a": "UNION removes duplicates (implicit sort/hash — expensive); UNION ALL simply appends. Default to UNION ALL unless dedup is a requirement; both need matching column counts and compatible types."}, {"n": 6, "q": "What are INTERSECT and EXCEPT and when are they cleaner than joins?", "a": "INTERSECT returns rows in both sets; EXCEPT returns rows in the first not the second — both dedup and treat NULLs as equal, making 'what's missing between tables' cleaner and safer than LEFT JOIN...IS NULL with NULLable keys."}, {"n": 7, "q": "What is the difference between DISTINCT and GROUP BY for deduplication?", "a": "Both can dedup, but DISTINCT applies to the selected row as a whole while GROUP BY defines groups you can aggregate over. Use GROUP BY when you need aggregates; use DISTINCT for simple uniqueness. Performance is typically equivalent — same plan."}, {"n": 8, "q": "Explain window functions: ROW_NUMBER, RANK, DENSE_RANK, NTILE. How do they differ on ties?", "a": "Window functions compute over a partition without collapsing rows. ROW_NUMBER gives unique sequence (ties broken arbitrarily); RANK leaves gaps after ties (1,1,3); DENSE_RANK doesn't (1,1,2); NTILE(n) splits rows into n near-equal buckets."}, {"n": 9, "q": "Explain LAG, LEAD, FIRST_VALUE, LAST_VALUE, and window frames (ROWS BETWEEN vs RANGE BETWEEN).", "a": "LAG/LEAD read previous/next row values within a partition ordering; FIRST_VALUE/LAST_VALUE read frame edges — LAST_VALUE needs ROWS BETWEEN ... AND UNBOUNDED FOLLOWING because the default frame ends at the current row. ROWS counts physical rows; RANGE groups peers with equal ORDER BY values."}, {"n": 10, "q": "How do you compute a running total and a moving average with window functions?", "a": "Running total: SUM(amount) OVER (PARTITION BY k ORDER BY dt ROWS UNBOUNDED PRECEDING). Moving average: AVG(amount) OVER (PARTITION BY k ORDER BY dt ROWS BETWEEN 6 PRECEDING AND CURRENT ROW) for a 7-row window."}, {"n": 11, "q": "What is the difference between PARTITION BY and GROUP BY?", "a": "GROUP BY collapses rows into one per group; PARTITION BY defines groups for a window calculation while keeping every row. Use windows when you need detail rows alongside group-level values (share of group, running totals, rankings)."}, {"n": 12, "q": "Write a query to find the second-highest salary (multiple approaches) and discuss trade-offs.", "a": "Approaches: SELECT MAX(sal) WHERE sal < (SELECT MAX(sal)); OFFSET 1 FETCH 1 after ORDER BY DESC; DENSE_RANK()=2 in a CTE. DENSE_RANK generalizes to Nth and handles ties correctly; OFFSET is simplest but tie behavior depends on requirement."}, {"n": 13, "q": "How do you deduplicate rows keeping the latest record per key (ROW_NUMBER pattern)?", "a": "ROW_NUMBER() OVER (PARTITION BY key ORDER BY updated_at DESC) AS rn in a CTE, then WHERE rn = 1 — the canonical latest-record-per-key pattern; QUALIFY shortens it on engines that support it."}, {"n": 14, "q": "What are CTEs? How do they compare to subqueries and temp tables for readability and performance?", "a": "CTEs (WITH) name subqueries for readable, composable steps and enable recursion. Vs subqueries: same performance usually (inlined), better readability. Vs temp tables: temp tables materialize once with stats — better when reused many times or when the optimizer mis-estimates a complex CTE."}, {"n": 15, "q": "Explain recursive CTEs with an example (org hierarchy, date series).", "a": "A recursive CTE has an anchor member UNION ALL a recursive member referencing itself, iterating until empty — e.g., walking manager_id chains to build org paths/levels, or generating a continuous date series between two dates."}, {"n": 16, "q": "What is a correlated subquery and why can it be slow? How would you rewrite one as a join?", "a": "A correlated subquery references outer-query columns, so it logically executes per outer row — often O(n×m). Rewrite as a JOIN to a pre-aggregated derived table (GROUP BY the correlation key) or a window function, letting the engine hash/merge once."}, {"n": 17, "q": "What is the difference between EXISTS, IN, and JOIN for semi-joins? How do they treat NULLs (especially NOT IN)?", "a": "EXISTS short-circuits on first match and handles NULLs sanely — preferred for semi-joins. IN is fine for small lists but NOT IN returns zero rows if the subquery yields any NULL (three-valued logic trap) — use NOT EXISTS. JOIN risks row duplication when used just to filter."}, {"n": 18, "q": "How does NULL behave in comparisons, aggregations, GROUP BY, and joins? What do COALESCE and NULLIF do?", "a": "NULL compares as UNKNOWN (use IS NULL, not = NULL); aggregates ignore NULLs (COUNT(col) skips them); GROUP BY treats NULLs as one group; joins never match NULL keys. COALESCE returns first non-null; NULLIF(a,b) returns NULL when a=b — handy to avoid divide-by-zero."}, {"n": 19, "q": "Explain the difference between COUNT(*), COUNT(column), and COUNT(DISTINCT column).", "a": "COUNT(*) counts rows; COUNT(col) counts rows where col is non-null; COUNT(DISTINCT col) counts unique non-null values (more expensive — requires dedup). Differences between them are a quick data-quality signal for null density."}, {"n": 20, "q": "What are GROUPING SETS, ROLLUP, and CUBE?", "a": "They compute multiple grouping levels in one pass: GROUPING SETS lists explicit combinations; ROLLUP produces hierarchical subtotals (a,b → a → grand total); CUBE produces all combinations. GROUPING() identifies subtotal rows."}, {"n": 21, "q": "How do you pivot and unpivot data in SQL (PIVOT operator vs conditional aggregation)?", "a": "Conditional aggregation pivots portably: SUM(CASE WHEN month='Jan' THEN amt END) per column; the PIVOT operator does it declaratively on SQL Server. Unpivot via UNPIVOT or CROSS APPLY (VALUES ...) to rotate columns into rows."}, {"n": 22, "q": "What is the difference between DELETE, TRUNCATE, and DROP?", "a": "DELETE removes rows (logged per-row, WHERE-able, triggers fire, rollback-friendly); TRUNCATE deallocates all pages (fast, minimal logging, resets identity, no WHERE); DROP removes the object entirely including structure."}, {"n": 23, "q": "Explain primary keys, foreign keys, unique constraints, and check constraints. How do they support data quality?", "a": "Primary keys enforce unique, non-null row identity; foreign keys enforce referential integrity to a parent; unique constraints enforce alternate keys; checks enforce value rules. They push data quality into the database so bad data fails loudly at write time."}, {"n": 24, "q": "What is normalization (1NF, 2NF, 3NF) and when do you deliberately denormalize for analytics?", "a": "1NF: atomic values; 2NF: no partial dependency on a composite key; 3NF: no transitive dependencies. OLTP normalizes to prevent anomalies; analytics denormalizes (star schemas, wide tables) to reduce joins and favor scan-heavy columnar engines."}, {"n": 25, "q": "What is a surrogate key vs a natural key, and why do warehouses prefer surrogates?", "a": "A natural key comes from business data (email, order number); a surrogate is a meaningless generated integer/hash. Warehouses prefer surrogates for stable joins despite source changes, SCD2 versioning (multiple rows per natural key), compact fact keys, and cross-source integration."}, {"n": 26, "q": "How do clustered and non-clustered indexes work? What is a covering index?", "a": "A clustered index defines the physical row order of the table (one per table); non-clustered indexes are separate ordered structures pointing back to rows. A covering index includes all queried columns so the engine never touches the base table, eliminating key lookups."}, {"n": 27, "q": "How do you read an execution plan? What are seeks vs scans, and common red flags (key lookups, spills, implicit conversions)?", "a": "Read plans right-to-left/inner-to-outer, checking estimated vs actual rows. Seeks touch selective ranges; scans read everything (fine for analytics, bad for selective OLTP queries). Red flags: massive estimate misses, key lookups on many rows, hash/sort spills to tempdb, implicit conversions killing sargability."}, {"n": 28, "q": "What are statistics and why do stale statistics cause bad plans?", "a": "Statistics are histograms of column value distributions the optimizer uses to estimate row counts and choose join/scan strategies. Stale stats after big loads cause wildly wrong estimates and bad plans — update statistics post-load or enable auto-update with care on large tables."}, {"n": 29, "q": "What is parameter sniffing and how do you mitigate it?", "a": "The engine compiles a procedure's plan using the first parameter values seen; atypical values then get a plan tuned for someone else's data. Mitigate with OPTION(RECOMPILE) on the problem statement, OPTIMIZE FOR, dynamic branching into separate procedures, or engine-specific parameter-sensitive plan features."}, {"n": 30, "q": "What makes a predicate non-SARGable? Give examples and fixes.", "a": "Non-SARGable predicates prevent index seeks: functions on columns (YEAR(dt)=2025), leading-wildcard LIKE ('%abc'), implicit type conversions, OR sprawl. Fix by rewriting to range predicates (dt >= '2025-01-01' AND dt < '2026-01-01'), computed/persisted columns, or matching types exactly."}, {"n": 31, "q": "Explain ACID properties and transaction isolation levels (read uncommitted → serializable). What anomalies does each prevent?", "a": "Atomicity: all-or-nothing; Consistency: constraints hold; Isolation: concurrent transactions don't interfere; Durability: commits survive crashes. Isolation levels trade anomalies for concurrency — read uncommitted allows dirty reads; read committed blocks them; repeatable read stops non-repeatable reads; serializable stops phantoms; snapshot/RCSI gives readers versioned non-blocking reads."}, {"n": 32, "q": "What is the difference between optimistic and pessimistic concurrency? What are deadlocks and how do you reduce them?", "a": "Pessimistic locking blocks conflicts up front (locks); optimistic assumes rare conflicts and validates at commit (row versions), retrying losers. Deadlocks are circular waits — reduce by consistent object access order, short transactions, appropriate indexes, and snapshot isolation to remove reader-writer blocking."}, {"n": 33, "q": "What is MERGE (upsert) and what are its pitfalls?", "a": "MERGE performs INSERT/UPDATE/DELETE in one statement by matching source to target. Pitfalls: unexpected multi-match errors when the source isn't unique on the key, historical SQL Server bugs, concurrency race conditions without HOLDLOCK, and complex semantics — many teams prefer explicit UPDATE-then-INSERT."}, {"n": 34, "q": "How do you implement SCD Type 2 in pure SQL (effective dates, current flag, hash compare)?", "a": "SCD2 upsert: close changed current rows (set end_date/current_flag=0) where the natural key matches and attribute hash differs, then insert new versions with start_date=load date and current_flag=1. A hash/CHECKSUM over tracked attributes makes change detection cheap."}, {"n": 35, "q": "How do you validate row counts and reconcile data between source and target tables in SQL?", "a": "Reconcile at multiple levels: row counts per partition/day, SUM/hash totals of measures, distinct key counts, and EXCEPT queries to find exact mismatched r
