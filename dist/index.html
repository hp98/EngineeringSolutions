 isolation via optimistic concurrency, schema enforcement/evolution, time travel to prior versions, and DML (UPDATE/DELETE/MERGE) — turning a lake into a lakehouse."}, {"n": 37, "q": "How does MERGE INTO work in Delta, and how do you implement upserts and SCD2 with it?", "a": "MERGE INTO target USING source ON keys WHEN MATCHED [AND cond] THEN UPDATE SET ... WHEN NOT MATCHED THEN INSERT ... — atomic upserts. SCD2: match on business key + current flag; when matched and hash changed, update to close the old row and insert the new version (two-pass or union trick for insert-on-change)."}, {"n": 38, "q": "What are OPTIMIZE, Z-ORDER (or liquid clustering), and VACUUM in Delta?", "a": "OPTIMIZE compacts small files into large ones; Z-ORDER co-locates data by high-selectivity filter columns for data skipping (liquid clustering is its successor — incremental, no full rewrite, evolvable keys); VACUUM deletes files unreferenced beyond retention (default 7 days) — balancing storage vs time travel."}, {"n": 39, "q": "How do you implement incremental processing (watermark columns, Delta Change Data Feed, Structured Streaming)?", "a": "Incremental options: watermark column filters (process rows newer than last high-water mark stored in a control table), Delta Change Data Feed (read row-level changes between versions), and Structured Streaming with Delta sources (checkpoint-tracked exactly-once incremental consumption) — trigger.availableNow for batch-style runs."}, {"n": 40, "q": "Explain Structured Streaming basics: micro-batches, triggers, checkpoints, output modes, exactly-once semantics.", "a": "Structured Streaming processes micro-batches from sources (files, Kafka, Delta) with a checkpoint directory storing progress/state — enabling exactly-once with idempotent/transactional sinks. Triggers control cadence (processingTime, availableNow); output modes: append (new rows), update (changed aggregates), complete (full result)."}, {"n": 41, "q": "What are watermarks in streaming and how do they handle late data?", "a": "Watermarks bound event-time lateness for stateful operations: withWatermark('event_time', '1 hour') admits data up to 1 hour late, finalizing windows and evicting state beyond it. Later data is dropped — the trade between completeness and unbounded state growth."}, {"n": 42, "q": "How do you monitor and debug a Spark job in the Spark UI (stages, tasks, spill, GC time, skewed task duration)?", "a": "Spark UI: Jobs/Stages show duration, task distribution (min/median/max — skew detection), shuffle read/write sizes, and spills; Executors show GC time and memory; SQL tab shows the physical plan with per-operator metrics. Start from the longest stage, inspect its slowest tasks, and read the plan feeding it."}, {"n": 43, "q": "What is a spill to disk and what config/code changes reduce it?", "a": "Spill occurs when execution memory can't hold a shuffle/sort/join working set, writing to disk (visible in stage metrics as memory/disk spill). Reduce with more partitions (smaller per-task data), more executor memory or fewer concurrent cores, AQE, salting skew, and avoiding wide rows through early projection."}, {"n": 44, "q": "How do you tune a chronically slow Spark job — walk through your systematic checklist.", "a": "Systematic tuning: read the Spark UI (longest stage, skew, spills, GC); check plan for unexpected scans/joins order/missing pushdown; right-size shuffle partitions or trust AQE; broadcast appropriately; eliminate UDFs; cache reused intermediates; fix small files at sources; scale/rebalance cluster only after the plan is sane."}, {"n": 45, "q": "What is the difference between client and cluster deploy modes?", "a": "Client mode runs the driver on your submitting machine (notebooks, dev) — driver dies if your session dies; cluster mode runs the driver on the cluster (production jobs) — resilient and closer to executors."}, {"n": 46, "q": "How does PySpark actually execute Python code (JVM, Py4J, serialization overhead) and what is Arrow's role?", "a": "The PySpark driver builds JVM plans via Py4J; execution happens in the JVM. Only Python UDFs invoke Python workers per executor with serialization overhead; Arrow accelerates JVM↔Python transfers (pandas UDFs, toPandas). Hence: DataFrame API = JVM speed; row-wise Python = pay the bridge toll."}, {"n": 47, "q": "How do you test PySpark code (local SparkSession, chispa/assertDataFrameEqual, fixture data)?", "a": "Test with a local SparkSession fixture (pytest, session-scoped), tiny hand-built DataFrames, pure transformation functions (df in → df out), and assertions via chispa or pyspark.testing.assertDataFrameEqual; keep I/O at the edges so logic tests need no cluster or real storage."}, {"n": 48, "q": "What is the cost of count(), distinct(), and orderBy() on large data — and cheaper alternatives for each intent?", "a": "count() scans everything (fine, but don't call repeatedly — cache first if reused); distinct() is a full shuffle — prefer approx_count_distinct for cardinality estimates; orderBy() globally sorts (range partition + sort) — use sortWithinPartitions or top-N via window/limit patterns when global order isn't truly needed."}, {"n": 49, "q": "Design a PySpark job that ingests daily JSON files, validates, dedupes, and merges into a partitioned Delta table idempotently.", "a": "Design: explicit schema read of the day's files (badRecordsPath/PERMISSIVE quarantine); validate counts and required fields against thresholds; dedupe via row_number over business key ordered by event time; MERGE into the Delta target on business key (idempotent — reruns re-merge the same day harmlessly); partition by event date; log metrics and OPTIMIZE on schedule."}, {"n": 50, "q": "Your join of two large tables runs for hours and one task runs forever. Diagnose and fix — cover skew detection, salting, broadcast thresholds, and AQE.", "a": "Diagnose: Spark UI stage metrics — if one task's input/duration dwarfs peers, it's skew; find the hot key via groupBy count on join keys. Fix: enable AQE skew handling; broadcast the smaller side if it fits (raise threshold deliberately); salt the hot keys (explode small side across salt range); or split hot keys into a separate broadcast-joined path and union results."}]}, {"id": "databricks", "name": "Databricks", "questions": [{"n": 1, "q": "What is Databricks and how does the lakehouse platform differ from a warehouse-plus-lake architecture?", "a": "Databricks is a managed lakehouse platform unifying data engineering, SQL analytics, and ML on open formats (Delta/Parquet) with collaborative notebooks, jobs, and governance (Unity Catalog). Versus warehouse-plus-lake: one copy of data, one security model, and both SQL and Spark/ML engines over the same tables."}, {"n": 2, "q": "Explain the Databricks architecture: control plane vs compute (data) plane. What stays in your cloud account?", "a": "The control plane (Databricks account: UI, job scheduler, notebook code, metadata) runs in Databricks' cloud; the compute/data plane (clusters, your data in ADLS/S3) runs in your cloud subscription — data stays in your tenancy; serverless shifts compute into Databricks-managed accounts with isolation guarantees."}, {"n": 3, "q": "What cluster types exist (all-purpose, job clusters, SQL warehouses, serverless) and when do you use each?", "a": "All-purpose clusters: interactive development, shared, expensive to leave running. Job clusters: created per job run, cheaper DBUs, isolated, terminate on completion — the production default. SQL warehouses: Photon-powered SQL endpoints for BI/analysts (serverless option). Serverless compute: instant-start managed capacity for jobs/notebooks/DLT."}, {"n": 4, "q": "How do you size and configure a cluster (node types, autoscaling, spot instances, Photon)?", "a": "Choose node types by workload (memory-optimized for joins/wide aggregations, compute-optimized for CPU-heavy parsing); enable autoscaling with sensible min/max; spot instances for fault-tolerant batch at steep discount (with on-demand driver); Photon for SQL/DataFrame-heavy pipelines; auto-termination always for interactive."}, {"n": 5, "q": "What is Photon and what workloads does it accelerate?", "a": "Photon is Databricks' C++ vectorized execution engine, transparently accelerating SQL and DataFrame operations (scans, joins, aggregations, Delta writes) typically 2–5x — priced at a DBU premium that usually nets positive for SQL-style workloads; it doesn't accelerate Python UDFs."}, {"n": 6, "q": "What are Databricks Runtime versions and why does pinning them matter?", "a": "Runtimes bundle Spark, Delta, and library versions (plus ML variants). Pinning a runtime per job guarantees reproducible behavior; upgrades happen deliberately with testing, since Spark/Delta behavior changes across versions — 'it broke after the runtime auto-updated' is a preventable incident."}, {"n": 7, "q": "What is Unity Catalog? Explain the three-level namespace (catalog.schema.table) and what problems it solves.", "a": "Unity Catalog is the centralized governance layer: one metastore per region governing catalogs → schemas → tables/views/volumes/models across workspaces, with ANSI GRANTs, lineage capture, auditing, and cross-workspace sharing — replacing per-workspace Hive metastores and mount-point security."}, {"n": 8, "q": "How does Unity Catalog handle permissions (GRANT model), lineage, and audit?", "a": "Permissions are ANSI SQL GRANTs (USE CATALOG/SCHEMA, SELECT, MODIFY, CREATE, EXECUTE) on securables, inherited down the hierarchy, assigned to groups; lineage is captured automatically at table and column level from queries; audit logs record access — governance evidence and impact analysis built in."}, {"n": 9, "q": "What are managed vs external tables in Unity Catalog, and where does the data live?", "a": "Managed tables: UC controls both metadata and the data location (managed storage) — dropping deletes data; supports optimizations like predictive maintenance. External tables: data at your specified path, registered in UC — dropping removes only metadata. Prefer managed for full lifecycle governance; external for shared/legacy paths."}, {"n": 10, "q": "What are volumes in Unity Catalog and how do they replace DBFS mounts for files?", "a": "Volumes are UC-governed storage for non-tabular files (raw landing files, configs, model artifacts) with path access (/Volumes/catalog/schema/vol/...) — replacing DBFS mounts so file access follows the same GRANT model and audit as tables."}, {"n": 11, "q": "What is Delta Sharing and when would you use it?", "a": "Delta Sharing is an open protocol for sharing live Delta tables with external consumers (any platform, no Databricks required) or across metastores — no data copies, recipient reads current data with revocable grants. Use for partner data products and cross-org distribution."}, {"n": 12, "q": "How do notebooks work in Databricks (magic commands, widgets for parameters, %run vs importing modules)?", "a": "Notebooks support multiple languages via %python/%sql/%scala magics, widgets for parameters, %run to inline another notebook, and Repos-backed files so shared logic lives in .py modules imported normally — preferred over %run chains for testable code."}, {"n": 13, "q": "What is Databricks Repos/Git folders and how do you structure notebook + module code for version control?", "a": "Git folders (Repos) clone repositories into the workspace: develop on branches, commit/push from the UI or CLI, and structure projects as notebooks for orchestration entry points plus python packages for logic — enabling PR review and CI over Databricks code."}, {"n": 14, "q": "How do you pass parameters into and results out of notebook jobs (widgets, dbutils.jobs.taskValues, job parameters)?", "a": "Parameters: job parameters/widgets (dbutils.widgets.get) feed values in; dbutils.jobs.taskValues.set/get passes small values between tasks in a job; dbutils.notebook.exit returns a value to a caller. Keep payloads small — pass references (paths, dates), not data."}, {"n": 15, "q": "What is dbutils and what are its common uses (fs, secrets, widgets)?", "a": "dbutils provides workspace utilities: dbutils.fs (list/copy/rm files), dbutils.secrets.get (secret retrieval without exposure), dbutils.widgets (parameters), dbutils.jobs.taskValues (inter-task values) — the glue for operational notebook code."}, {"n": 16, "q": "How do secrets and secret scopes work, including Azure Key Vault-backed scopes?", "a": "Secret scopes store credentials accessed via dbutils.secrets.get(scope, key) with values redacted in output. Azure Key Vault-backed scopes read directly from AKV so rotation is centralized; access is governed by scope ACLs — never hardcode credentials in notebooks."}, {"n": 17, "q": "What are Databricks Workflows (Jobs)? Explain tasks, dependencies, retries, schedules, and triggers (file arrival, continuous).", "a": "Workflows define jobs as task DAGs (notebook, python wheel, SQL, dbt, DLT tasks) with depends_on, per-task clusters or shared job clusters, retries with backoff, schedules/cron, and triggers including file arrival and continuous mode; parameters flow to tasks; failure notifications built in."}, {"n": 18, "q": "Job cluster vs all-purpose cluster for scheduled workloads — cost and isolation reasoning?", "a": "Job clusters spin up per run: cheaper DBU rate, clean environment, isolation between runs, right-sized per job. All-purpose clusters for scheduled jobs waste money (idle time, dev contention) and risk dependency drift — use them only for interactive development."}, {"n": 19, "q": "What is Delta Live Tables (DLT / Lakeflow Declarative Pipelines)? How do declarative pipelines differ from imperative notebooks?", "a": "DLT (Lakeflow Declarative Pipelines) declares tables as queries with @dlt.table decorators; the framework infers the DAG, manages compute, handles retries, tracks quality metrics, and supports streaming and materialized tables. You state 'what', it manages 'how' — versus notebooks where you own orchestration and recovery."}, {"n": 20, "q": "What are DLT expectations and how do they enforce data quality (warn, drop, fail)?", "a": "Expectations are declarative row-level constraints on DLT tables: @dlt.expect (log violations), expect_or_drop (discard bad rows), expect_or_fail (abort). Violation metrics land in the pipeline event log — quality enforcement and observability without hand-rolled checks."}, {"n": 21, "q": "What is Auto Loader (cloudFiles)? How does it track processed files and handle schema inference/evolution?", "a": "Auto Loader (format 'cloudFiles') incrementally ingests new files from cloud storage using file notification or listing, tracking processed files in checkpoint state (exactly-once), inferring and evolving schema with rescue of unexpected columns (_rescued_data), scaling to millions of files — the standard landing-zone reader."}, {"n": 22, "q": "Compare Auto Loader vs COPY INTO vs plain spark.read for ingestion.", "a": "Auto Loader: continuous/incremental file discovery, schema evolution, scale — the default for ongoing ingestion. COPY INTO: idempotent SQL bulk load, good for periodic manual/simple loads. spark.read: one-off full reads with no processed-file tracking — you own incrementality."}, {"n": 23, "q": "How do you implement medallion architecture in Databricks — concretely, what happens in Bronze, Silver, Gold?", "a": "Bronze: raw append of source data (Auto Loader), minimal transformation, retains history. Silver: dedupe, type conformance, quality gates, business keys, joins into clean entity tables (MERGE/CDC application). Gold: dimensional models and aggregates serving BI/ML — each layer a schema/catalog with explicit contracts."}, {"n": 24, "q": "How do you implement SCD Type 1 and Type 2 in Databricks (MERGE, DLT apply_changes)?", "a": "SCD1: MERGE matching business key, update-in-place attributes. SCD2: MERGE closing changed current rows (end_date, is_current=false) and inserting new versions; or DLT's apply_changes/AUTO CDC with stored_as_scd_type=2 handling sequencing, out-of-order events, and history columns declaratively."}, {"n": 25, "q": "What is Change Data Feed in Delta and how does it enable incremental downstream processing?", "a": "CDF (delta.enableChangeDataFeed) records row-level inserts/updates/deletes with version metadata; downstream reads table_changes between versions to process only deltas — enabling incremental Silver→Gold without full recomputes and feeding external sync consumers."}, {"n": 26, "q": "What is liquid clustering and how does it compare to partitioning + Z-ORDER?", "a": "Liquid clustering replaces partitioning + Z-ORDER: cluster keys co-locate data incrementally without directory explosion, keys can change without rewrites, and it handles skewed/high-cardinality columns gracefully — the current recommendation for new large tables (CLUSTER BY)."}, {"n": 27, "q": "What are deletion vectors and predictive optimization?", "a": "Deletion vectors mark rows deleted without rewriting files, making DELETE/UPDATE/MERGE far cheaper (reads apply vectors); predictive optimization lets Databricks automatically run OPTIMIZE/VACUUM/clustering maintenance on managed tables based on usage patterns — maintenance without cron jobs."}, {"n": 28, "q": "How do you handle GDPR-style deletes in a Delta lakehouse (vacuum retention, CDF implications)?", "a": "Right-to-be-forgotten: DELETE removes rows logically, but old files persist for time travel — run VACUUM past retention to physically purge, mind CDF retaining change rows, and document the purge SLA (e.g., deletes physical within 7+ days). Design PII into few tables to limit blast radius."}, {"n": 29, "q": "What is Databricks SQL? How do SQL warehouses, queries, alerts, and dashboards fit analyst workflows?", "a": "Databricks SQL provides SQL warehouses for BI-scale concurrency, a SQL editor, saved queries, alerts (threshold-triggered notifications), dashboards, and query history/profiles — making the lakehouse a warehouse-grade serving layer for analysts."}, {"n": 30, "q": "How does Databricks connect to Power BI / other BI tools (Partner Connect, SQL warehouse endpoints, OAuth)?", "a": "Power BI connects via the Databricks connector to a SQL warehouse (Import or DirectQuery), authenticating with Entra ID/OAuth (preferred over PATs); Partner Connect automates setup. Serverless warehouses minimize latency; Photon + result caching make DirectQuery viable for many models."}, {"n": 31, "q": "What is the Databricks CLI / REST API / SDK and what have you automated with them?", "a": "CLI/REST/SDKs automate everything: deploying jobs, managing clusters/permissions, triggering runs, exporting artifacts. Typical automation: CI pipelines validating and deploying bundles, operational scripts for user/grant management, run-triggering from external orchestrators."}, {"n": 32, "q": "What are Databricks Asset Bundles (DABs) and how do they enable CI/CD for jobs and pipelines?", "a": "Asset Bundles (DABs) define jobs, pipelines, and code as YAML + source in Git, with environment targets (dev/staging/prod variable substitution); databricks bundle deploy/run applies them — infrastructure-as-code for Databricks enabling reviewable, repeatable deployments."}, {"n": 33, "q": "How do you design CI/CD for Databricks with Azure DevOps or GitHub Actions (branching, testing, deploy to envs)?", "a": "CI/CD: feature branches with unit tests on pure functions (local Spark) → PR validation pipeline (lint, tests, bundle validate) → merge deploys bundle to staging with integration test job on sample data → approval gate → prod bundle deploy; secrets from Key Vault; job configs versioned, never hand-edited in prod."}, {"n": 34, "q": "How do you test Databricks code — unit testing modules outside notebooks, integration testing with sample data?", "a": "Structure code as Python packages (wheel) with pure transformation functions unit-tested via local SparkSession in CI; notebooks only as thin entry points; integration tests run as staging jobs against fixture data in a test catalog asserting outputs, counts, and expectations."}, {"n": 35, "q": "How do you monitor jobs and clusters (job run history, cluster metrics, system tables, alerting on failures)?", "a": "Monitor via job run history and failure notifications (email/Teams/webhooks), cluster metrics UI, the Spark UI per run, and Unity Catalog system tables (billing, job run timelines, audit) queried for trends and SLA dashboards; alert on failures, duration anomalies, and cost spikes."}, {"n": 36, "q": "What are system tables in Unity Catalog and how do you use them for cost and audit analysis?", "a": "System tables (system.billing.usage, system.lakeflow/jobs run data, access audit) expose platform telemetry as queryable Delta tables — build cost-per-job dashboards, job SLA trend reports, audit investigations, and chargeback allocation directly in SQL."}, {"n": 37, "q": "How do you control and reduce Databricks costs (cluster policies, auto-termination, spot, serverless, DBU analysis)?", "a": "Cost levers: job clusters not all-purpose, auto-termination, right-sized autoscaling, spot workers, Photon where it nets positive, serverless for spiky workloads, cluster policies capping sizes, scheduling heavy work off-peak, monitoring DBU by job via system tables, and deleting zombie jobs/clusters."}, {"n": 38, "q": "What are cluster policies and why do platform teams enforce them?", "a": "Cluster policies are admin-defined templates constraining cluster creation (allowed node types, max workers, mandatory tags, auto-termination, spot settings) — enforcing cost control, tagging for chargeback, and configuration consistency while letting teams self-serve within guardrails."}, {"n": 39, "q": "What are instance pools and when do they help?", "a": "Instance pools hold pre-warmed idle VMs so clusters attach in seconds instead of minutes — valuable for many short job runs and latency-sensitive scheduled pipelines; idle pool capacity costs cloud VM price without DBUs, so size pools to demand patterns."}, {"n": 40, "q": "How does Databricks integrate with ADLS Gen2 on Azure (service principals, managed identities, credential passthrough history → UC)?", "a": "Access ADLS through Unity Catalog: storage credentials (managed identity of the access connector) + external locations govern paths centrally with GRANTs — replacing legacy per-cluster service principal configs, mount points, and credential passthrough; managed identities avoid secret rotation entirely."}, {"n": 41, "q": "What is the difference between Databricks on Azure vs the same workloads in Microsoft Fabric — how would you position each?", "a": "Databricks: code-first Spark platform, deepest engineering/streaming/ML capability, multicloud. Fabric: SaaS all-in-one tightly integrated with Power BI/Office, capacity-based pricing, faster for Microsoft-centric BI teams. They interoperate (Fabric can shortcut to ADLS Delta written by Databricks); position by team skills, workload complexity, and ecosystem gravity."}, {"n": 42, "q": "What is MLflow and what do experiments, runs, and the model registry provide (even for a DE supporting DS teams)?", "a": "MLflow tracks experiments (parameters, metrics, artifacts per run), packages models, and registers them in UC Model Registry with versions/aliases for controlled promotion — for a DE, it's the contract for handing reproducible features/models between DS and production serving."}, {"n": 43, "q": "What is Feature Store at a high level?", "a": "Feature Store centralizes feature definitions/tables so training and serving read identical features (with point-in-time correct joins), preventing training/serving skew and duplicate feature engineering across teams."}, {"n": 44, "q": "How do you serve or expose Gold data to consumers (SQL warehouse, Delta Sharing, external tables, APIs)?", "a": "Serving options: SQL warehouses for BI tools (Power BI DirectQuery/Import), Delta Sharing for external consumers, external tables read by other engines, feature/online tables and model serving for ML apps, or APIs over SQL execution endpoints — choose by consumer type and latency needs."}, {"n": 45, "q": "How do you handle concurrent writes to the same Delta table (optimistic concurrency, conflict classes, retry patterns)?", "a": "Delta uses optimistic concurrency: transactions validate at commit against the log; conflicting commits (overlapping files/partitions) raise ConcurrentModificationException classes. Mitigate by partition-disjoint writes, retry loops with backoff, avoiding concurrent OPTIMIZE with rewrites, and serializing writers per table where needed."}, {"n": 46, "q": "How do you orchestrate Databricks from external tools (ADF/Airflow operators) and when do you prefer native Workflows?", "a": "External orchestration (ADF's Databricks activities, Airflow's DatabricksSubmitRun/Jobs operators) suits estates with existing cross-system orchestrators — submit jobs via API and poll. Prefer native Workflows when the DAG is Databricks-internal: richer task types, repair runs, cheaper, less moving parts."}, {"n": 47, "q": "What is table history/time travel used for operationally (debugging, rollback, reproducing runs)?", "a": "Table history (DESCRIBE HISTORY) shows every commit with operation, user, and metrics — operationally used for debugging what changed and when, RESTORE to roll back bad loads, time-travel queries to reproduce reports as-of a version, and auditing write patterns."}, {"n": 48, "q": "How do you implement an idempotent daily batch job in Databricks so reruns don't duplicate data?", "a": "Idempotency: MERGE on business keys instead of blind appends; or overwrite the specific date partition (replaceWhere) per run; make file ingestion exactly-once via Auto Loader checkpoints; key notifications/side effects to run IDs; then any rerun converges to the same state."}, {"n": 49, "q": "Describe your end-to-end design for migrating an on-prem SQL Server ETL to Databricks: landing, transformation, quality, orchestration, and BI serving.", "a": "Migration design: land source extracts via ADF/Lakeflow connectors into Bronze (Auto Loader on files); rebuild transformations as PySpark/dbt on Databricks writing Silver/Gold Delta under Unity Catalog; enforce quality via expectations/tests; orchestrate with Workflows; parallel-run against the legacy ETL reconciling outputs; serve BI via SQL warehouse; cut over source-by-source with rollback via time travel."}, {"n": 50, "q": "A nightly job's runtime doubled after a month in production. Walk through your investigation: data growth, small files, skew, cluster health, plan changes.", "a": "Investigate in order: data volume growth (input metrics per run vs history); small-file accumulation (file counts, OPTIMIZE cadence); skew emergence (stage max vs median task time); plan changes (runtime upgrade, statistics, join strategy flips); cluster health (spot evictions, autoscale ceilings); and upstream latency (waiting on late files). System tables + run history give the trendline; fix the dominant factor, then re-baseline."}]}, {"id": "dbt", "name": "dbt", "questions": [{"n": 1, "q": "What is dbt and what problem does it solve? Why 'ELT' with transformation in the warehouse?", "a": "dbt is a transformation framework: SQL SELECT statements become version-controlled, tested, documented models that dbt compiles and runs in dependency order inside your warehouse. ELT loads raw data first, then transforms with the warehouse's own scalable compute — dbt brings software engineering discipline to that T."}, {"n": 2, "q": "What is the difference between dbt Core and dbt Cloud?", "a": "dbt Core is the open-source CLI you run/orchestrate yourself; dbt Cloud adds a managed scheduler, IDE, CI integration, hosted docs, and the semantic layer as a paid service. Core + Airflow/Workflows is a common self-managed equivalent."}, {"n": 3, "q": "What is a dbt model? How does dbt compile SQL and decide execution order?", "a": "A model is one SELECT statement in a .sql file; dbt wraps it in DDL per its materialization, compiles Jinja/refs to real names, and executes models in DAG order. One model = one table/view = one logical transformation step."}, {"n": 4, "q": "Explain ref() and source() — why should you never hardcode table names?", "a": "ref('model') resolves to the correct database.schema.object per environment and registers the dependency edge in the DAG; source() does the same for declared raw tables. Hardcoding names breaks environment separation, lineage, and selective builds — the DAG only knows what ref/source tell it."}, {"n": 5, "q": "What is the DAG in dbt and how does dependency inference actually work?", "a": "The DAG is built entirely from ref()/source() calls parsed from model code — no manual ordering. dbt topologically sorts models, runs them in dependency order with configured threads parallelizing independent branches."}, {"n": 6, "q": "What is a dbt project structure best practice (staging, intermediate, marts layers)?", "a": "Standard structure: models/staging (one folder per source system; 1:1 with source tables; renaming, typing, light cleaning), models/intermediate (reusable business-logic joins), models/marts (facts and dimensions per domain). Staging views, marts tables/incremental — clear layers keep lineage legible."}, {"n": 7, "q": "What naming conventions do you follow for staging vs mart models (stg_, int_, fct_, dim_)?", "a": "Conventions: stg_<source>__<entity> for staging, int_<entity>_<verb> for intermediate, fct_<event> for facts and dim_<entity> for dimensions. Consistent prefixes make the DAG self-describing and enable selection by pattern."}, {"n": 8, "q": "What are sources, and what do source freshness checks do?", "a": "Sources declare raw tables in YAML (database/schema/table) with descriptions and tests, referenced via source(). Freshness checks (loaded_at_field with warn_after/error_after) verify raw data recency via dbt source freshness — catching upstream pipeline failures before transforming stale data."}, {"n": 9, "q": "What are the model materializations: view, table, incremental, ephemeral — trade-offs of each?", "a": "View: no storage, always current, compute at query time — staging default. Table: full rebuild each run — simple, fine for small/medium marts. Incremental: processes only new/changed data into an existing table — for large facts. Ephemeral: inlined as a CTE, no object — for lightweight shared logic (limits debuggability)."}, {"n": 10, "q": "How do incremental models work? Explain is_incremental(), the unique_key, and incremental strategies (append, merge, delete+insert, insert_overwrite).", "a": "On incremental runs, dbt wraps your filter in is_incremental() (e.g., WHERE loaded_at > (SELECT MAX(loaded_at) FROM {{ this }})) and applies the configured strategy: append (insert only), merge (upsert on unique_key), delete+insert (replace matching keys), insert_overwrite (replace partitions). unique_key defines the merge grain."}, {"n": 11, "q": "When does an incremental model need a --full-refresh, and what are the risks of late-arriving data?", "a": "Full-refresh (--full-refresh rebuilds from scratch) is needed after logic changes affecting history, schema changes, or corruption. Risks: late-arriving data outside the incremental window is silently missed — mitigate with lookback windows (process last N days, merge dedupes) and periodic full refreshes."}, {"n": 12, "q": "What are dbt snapshots and how do they implement SCD Type 2 (timestamp vs check strategy)?", "a": "Snapshots capture SCD2 history of mutating sources: dbt compares current source rows to the snapshot table and versions changes with dbt_valid_from/to. Timestamp strategy trusts an updated_at column; check strategy compares configured columns — for sources without reliable timestamps."}, {"n": 13, "q": "What are seeds and what are they appropriate for (and not)?", "a": "Seeds are CSVs in the repo loaded via dbt seed — for small, static reference data (country codes, mappings) that belongs in version control. Not for real data loads: no scale, no lineage from sources, and PII in Git is a governance failure."}, {"n": 14, "q": "Explain schema tests (generic tests): unique, not_null, accepted_values, relationships. How do they run under the hood?", "a": "Generic tests are YAML-declared assertions compiled to SQL returning failing rows: unique and not_null enforce grain/completeness, accepted_values enforces domains, relationships enforces referential integrity to another model. Any returned rows = test failure — data quality as code, run with every build."}, {"n": 15, "q": "How do you write singular (bespoke) tests and custom generic tests?", "a": "Singular tests are bespoke SQL files in tests/ returning rows that violate an expectation (e.g., revenue reconciliation between layers). Custom generic tests are parameterized test macros ({% test positive_value(model, column_name) %}) reusable in YAML across models."}, {"n": 16, "q": "What are test severities (warn vs error) and store_failures — how do you operationalize test results?", "a": "severity: warn logs without failing the build (new/noisy checks), error blocks (contract-critical checks); store_failures persists failing rows to audit tables for triage. Operationalize: alert on errors, review warn trends weekly, and promote stabilized warns to errors."}, {"n": 17, "q": "What packages have you used (dbt_utils, dbt_expectations, codegen) and what do they add?", "a": "dbt_utils: surrogate keys, date spines, union_relations, pivot, and extra generic tests. dbt_expectations: Great Expectations-style rich assertions (distributions, row counts vs source). codegen: generates staging model/YAML boilerplate from sources — accelerating standards-compliant scaffolding."}, {"n": 18, "q": "What is Jinja in dbt? Give examples of loops/conditionals generating SQL.", "a": "Jinja templates SQL before compilation: {% for status in ['open','closed'] %} sum(case when status='{{ status }}' then 1 end) as {{ status }}_count, {% endfor %} generates repetitive SQL; {% if target.name == 'prod' %} branches logic — metaprogramming that keeps SQL DRY."}, {"n": 19, "q": "What are macros and how do you write and reuse one across models?", "a": "Macros are reusable Jinja functions in macros/: {% macro cents_to_currency(col) %} round({{ col }}/100.0, 2) {% endmacro %}, called as {{ cents_to_currency('amount') }} in any model — centralizing business rules and warehouse-dialect quirks in one tested place."}, {"n": 20, "q": "What are variables (var), environment variables, and how do you make models environment-aware?", "a": "var('key', default) reads variables from dbt_project.yml or --vars CLI overrides (run dates, feature flags); env_var('NAME') reads environment variables (credentials, environment names). Combine with target properties to make models environment-aware without code changes."}, {"n": 21, "q": "What is the target and profiles.yml? How do dev vs prod profiles/schemas work?", "a": "The target is the active connection profile (warehouse, database, schema, threads) from profiles.yml; each developer targets a personal dev schema, CI targets a temp schema, prod targets production — same code, isolated outputs, selected by --target."}, {"n": 22, "q": "How does dbt handle documentation (description fields, doc blocks, dbt docs generate, lineage graph)?", "a": "YAML descriptions on models/columns plus {% docs %} markdown blocks compile via dbt docs generate into a browsable site with column-level docs, test coverage, and an interactive DAG lineage graph — documentation generated from the code that's actually running."}, {"n": 23, "q": "What is the semantic layer / metrics concept in dbt at a high level?", "a": "The semantic layer defines metrics (measures, dimensions, joins) once in dbt, served consistently to downstream tools via APIs — one governed definition of 'revenue' instead of each dashboard reinventing it. MetricFlow handles query generation."}, {"n": 24, "q": "How do exposures declare downstream dependencies like Power BI dashboards?", "a": "Exposures declare downstream consumers (dashboards, apps, ML jobs) in YAML with owner and dependencies — appearing in lineage so impact analysis covers 'which Power BI dashboards break if this model changes' and dbt can build/test everything an exposure needs."}, {"n": 25, "q": "What are model contracts and constraints, and why do they matter for reliable interfaces?", "a": "Contracts enforce a model's declared schema (column names, types, constraints) at build time — the model fails to build if it drifts from its contract. Essential for models consumed by other teams: interface stability becomes enforced, not hoped for."}, {"n": 26, "q": "What are model versions and deprecations for breaking-change management?", "a": "Model versions let you run v1 and v2 of a breaking-change model side by side with a deprecation window, while consumers migrate refs at their pace — managed breaking changes instead of coordinated big-bang cutovers."}, {"n": 27, "q": "How do hooks work (pre-hook, post-hook, on-run-start/end)? Give practical uses (grants, audit logging).", "a": "Hooks run SQL around model builds: pre-hook/post-hook per model (grants after build, audit-log inserts), on-run-start/on-run-end per invocation (create audit schemas, log run summaries). Grants are the canonical post-hook (or the grants config)."}, {"n": 28, "q": "What is state and deferral (--defer, state:modified) and how does 'slim CI' build only changed models?", "a": "State comparison (--state path/to/prod/manifest) enables state:modified selection — build only models changed vs production and their children (slim CI); --defer resolves unbuilt upstream refs to production objects so CI needn't rebuild the whole DAG. PR pipelines become minutes, not hours."}, {"n": 29, "q": "How do you structure a CI/CD pipeline for dbt (PR checks, test runs, prod deployment, artifacts)?", "a": "CI/CD: PR triggers a job running dbt build --select state:modified+ --defer against a CI schema, plus SQLFluff linting; merge to main deploys and runs production build on schedule; artifacts (manifest) stored per environment for state comparison; failures block merge — transformations ship like software."}, {"n": 30, "q": "How does dbt fit with Airflow or other orchestrators — how do you schedule and monitor dbt in production?", "a": "Airflow (or Databricks Workflows/ADF) triggers dbt on schedule after upstream loads complete: BashOperator/dbt Cloud API/Cosmos rendering the dbt DAG as Airflow tasks. Orchestrator owns when and alerting; dbt owns transformation order within the run."}, {"n": 31, "q": "What do run, test, build, compile, and ls commands each do — and why is 'dbt build' usually preferred?", "a": "run executes models; test runs tests; build runs models, tests, snapshots, seeds interleaved in DAG order — a model's tests gate its downstream consumers, so build is the production default. compile renders SQL without executing; ls lists selected nodes for debugging selection."}, {"n": 32, "q": "How do node selection syntax and graph operators work (model+, +model, tag:, path:)?", "a": "Selection: dbt build --select my_model+ (model and descendants), +my_model (ancestors and model), tag:nightly, path:models/marts, intersections (tag:daily,marts) and exclusions (--exclude) — precise control over what builds when."}, {"n": 33, "q": "What are tags and how do you use them for selective runs (e.g., nightly vs hourly)?", "a": "Tags label models in config for operational grouping: tag daily vs hourly models, pii for governance, critical for priority alerting — then schedule dbt build --select tag:hourly independently of the nightly full build."}, {"n": 34, "q": "How do you handle grain and uniqueness in fact models — how do tests encode the grain?", "a": "Declare grain explicitly (one row per what?) and enforce it: unique test on the key (or dbt_utils.unique_combination_of_columns for composite grains), not_null on grain columns. Most downstream bugs are silent grain violations — tests make them loud at the source model."}, {"n": 35, "q": "How do you implement a star schema in dbt — staging to dimensional marts workflow?", "a": "Star schema workflow: staging models standardize each source; intermediate models resolve entity dedup and business logic; dim_ models build dimensions with surrogate keys (snapshots feeding SCD2 dims); fct_ models join facts to dimension keys at declared grain; tests enforce keys and relationships; exposures link the semantic model."}, {"n": 36, "q": "How do you manage surrogate keys in dbt (dbt_utils.generate_surrogate_key, hashing)?", "a": "Use dbt_utils.generate_surrogate_key([cols]) hashing business key columns into deterministic keys — stable across environments and rebuilds (unlike sequences), consistent for SCD2 versioning when combined with valid_from, and portable across warehouses."}, {"n": 37, "q": "How does dbt work on different engines you know (Databricks, Fabric, SQL Server/Synapse) — adapters and dialect differences?", "a": "Adapters translate dbt to each engine: dbt-databricks (Delta merges, catalogs), dbt-fabric/dbt-synapse (T-SQL dialect, different incremental strategies), dbt-sqlserver. Differences surface in supported incremental strategies, DDL quirks, and grants — macros with adapter dispatch handle cross-dialect logic."}, {"n": 38, "q": "What does the dbt-databricks adapter offer (merge strategies, file formats, catalogs)?", "a": "dbt-databricks supports Delta-native features: merge and insert_overwrite/replace_where incremental strategies, liquid clustering/partitioning configs, Unity Catalog three-level namespaces, SQL warehouse or cluster execution, and python models — making dbt a first-class lakehouse transformation layer."}, {"n": 39, "q": "How do you optimize slow dbt models (materialization choice, incremental logic, warehouse-side tuning)?", "a": "Optimize by materialization choice (incremental for big facts), tightening incremental predicates (partition pruning), pre-aggregating in intermediates rather than repeated joins, warehouse-side tuning (clustering, file compaction, warehouse sizing), and inspecting compiled SQL query plans exactly as you'd tune hand-written SQL."}, {"n": 40, "q": "What are common anti-patterns in dbt projects (monolithic models, ref-less SQL, over-ephemeralization, untested marts)?", "a": "Anti-patterns: 1,000-line monolith models (split into staging/intermediate), hardcoded table names (breaks DAG), everything-ephemeral (undebuggable), untested marts (silent grain drift), business logic in staging, circular jinja complexity, and no CI so main is perpetually broken."}, {"n": 41, "q": "How do you do code review for dbt PRs — what do you look for?", "a": "dbt PR review checklist: correct layer and naming, grain declared and tested, ref/source discipline, incremental logic handles late data, tests on new keys/joins (relationships), YAML docs updated, compiled SQL sanity (no accidental cross joins), and slim CI green."}, {"n": 42, "q": "How do you backfill historical data through an incremental dbt model safely?", "a": "Backfill safely: for date-partitioned incrementals use vars (--vars '{start: ..., end: ...}') driving the incremental predicate to reprocess a window, run in batches, verify with reconciliation queries; if logic changed historically, prefer --full-refresh in off-peak with the table swap pattern for zero downtime."}, {"n": 43, "q": "How do you handle multiple environments/databases in one project (custom schemas, generate_schema_name macro)?", "a": "Multiple environments: profiles/targets set database per environment; generate_schema_name macro controls schema naming (dev_username schemas for developers, clean names in prod); CI builds into ephemeral schemas dropped after; environment-specific behavior via target.name conditionals kept minimal."}, {"n": 44, "q": "What are on-run-end results and artifacts (manifest.json, run_results.json) and what can you build with them?", "a": "Artifacts: manifest.json (full DAG, configs — powers state selection and lineage tooling), run_results.json (per-model status/timing — powers observability dashboards and alerting), catalog.json (docs). on-run-end contexts can log results to warehouse tables for run-history analytics."}, {"n": 45, "q": "How do you monitor dbt in production (logging, alerting on test failures, freshness SLAs)?", "a": "Production monitoring: parse run_results into a run-history table (model durations, failures, test results), alert on errored builds and failed error-severity tests via the orchestrator, track freshness SLAs with source freshness checks, and watch duration trends to catch degrading models before SLAs break."}, {"n": 46, "q": "What is unit testing in dbt (dbt unit tests) and how does it differ from data tests?", "a": "dbt unit tests define given-inputs/expect-output fixtures in YAML, testing model logic on mock data at compile-time — verifying transformations before touching real data. Data tests validate actual warehouse contents post-build. Unit tests catch logic bugs; data tests catch data bugs."}, {"n": 47, "q": "How would you introduce dbt into a team currently using stored procedures — migration and adoption strategy?", "a": "Migration from stored procedures: inventory and rank procedures by criticality; carve out lineage into staged models (staging → intermediate → mart) rather than 1:1 translation; parallel-run with reconciliation tests; train the team on Git/PR workflow; migrate consumers gradually; retire procedures with celebration — adoption is as much cultural as technical."}, {"n": 48, "q": "How do you document and enforce style (SQLFluff, formatting standards, PR templates)?", "a": "Style enforcement: SQLFluff with dbt templater in pre-commit and CI (naming, keywords, indentation), a documented style guide (CTE-first, one model one purpose, explicit casts), PR templates with checklists, and codegen for consistent scaffolding — consistency makes a large project navigable."}, {"n": 49, "q": "Design a dbt project for a freight/logistics mart: sources, staging, dimensional models, tests, and exposures for Power BI.", "a": "Freight mart design: sources for booking/shipment/invoice systems with freshness checks; staging per source standardizing charge codes and units; intermediates resolving shipment lifecycle and charge allocation (FCL/LCL, TEU/CBM normalization); dim_customer, dim_lane, dim_charge_type, fct_shipment_charges at charge-line grain with unique tests; exposures declaring the Power BI revenue model."}, {"n": 50, "q": "A nightly dbt build failed at 3 AM on a relationships test. Walk through triage: identify the model, inspect failures, decide warn vs block, and prevent recurrence.", "a": "Triage at 3 AM: run_results identifies the failing test and model; query the stored failures/compiled test SQL to see offending rows; classify — upstream data issue (quarantine/fix source, rerun) vs logic bug (hotfix PR) vs legitimately evolving data (adjust test); decide severity policy; then post-incident: add an upstream source test or contract so the same break is caught earlier next time."}]}, {"id": "airflow", "name": "Airflow & Orchestration", "questions": [{"n": 1, "q": "What is Apache Airflow and what problems does an orchestrator solve beyond cron?", "a": "Airflow is a platform to programmatically author, schedule, and monitor workflows as Python-defined DAGs. Beyond cron: dependency management between tasks, retries, backfills, SLA tracking, a UI with run history and logs, alerting, parameterization, and horizontal scaling of execution."}, {"n": 2, "q": "Explain Airflow's architecture: scheduler, webserver, metadata database, executor, workers, triggerer.", "a": "The scheduler parses DAGs and queues due task instances; the webserver serves the UI/API; the metadata database stores DAG/task state (source of truth); the executor dispatches tasks to workers (local process, Celery queue, or Kubernetes pods); the triggerer runs deferred (async) operators' waiting loops efficiently."}, {"n": 3, "q": "What is a DAG? How do you define one in Python (context manager, @dag decorator)?", "a": "A DAG is a directed acyclic graph of tasks with a schedule. Define via context manager: with DAG(dag_id='daily_load', schedule='@daily', start_date=..., catchup=False) as dag: — or the @dag decorator on a function containing @task-decorated tasks (TaskFlow style)."}, {"n": 4, "q": "What are operators, sensors, and hooks? How do they differ?", "a": "Operators encapsulate one unit of work (BashOperator, PythonOperator, DatabricksRunNowOperator); sensors wait for a condition (file exists, task in another DAG done, API ready); hooks are the reusable connection clients operators use to talk to external systems (credentials from Connections)."}, {"n": 5, "q": "What is the TaskFlow API (@task) and how does it change passing data between tasks?", "a": "TaskFlow defines tasks as decorated Python functions; return values pass automatically between tasks via XCom with dependency edges inferred from function calls — less boilerplate than PythonOperator + manual xcom_push/pull for Python-centric DAGs."}, {"n": 6, "q": "What are XComs, what are they for, and why shouldn't you pass large data through them?", "a": "XComs are small key-value messages between tasks stored in the metadata DB — task A pushes a filename or row count, task B pulls it. Not for data: the DB bloats and payload limits break; pass references (paths, table names, run IDs) and keep data in storage systems."}, {"n": 7, "q": "How do you set task dependencies (>>, <<, chain, cross_downstream)?", "a": "Dependencies: t1 >> t2 (t2 after t1), t2 << t1 equivalently; lists for fan-out/in (t1 >> [t2, t3] >> t4); chain() for linear sequences; cross_downstream() for many-to-many meshes. TaskFlow infers edges from data flow."}, {"n": 8, "q": "Explain schedule intervals, logical (execution) date, and data intervals — why does a daily DAG run 'one day behind'?", "a": "A run for interval [logical_date, logical_date + interval) starts after the interval ends — the run 'for Monday' executes Tuesday 00:00, because Monday's data is only complete then. logical_date (execution_date) identifies the data interval being processed, not the wall-clock trigger time — the classic Airflow mental-model hurdle."}, {"n": 9, "q": "What are catchup and backfill? When do you disable catchup, and how do you run a controlled backfill?", "a": "Catchup auto-creates runs for every missed interval between start_date and now — disable (catchup=False) for jobs where only 'latest' matters. Backfill deliberately runs historical intervals (airflow dags backfill -s -e), relying on tasks being parameterized by data interval and idempotent."}, {"n": 10, "q": "What is idempotency in the context of Airflow tasks and why is it non-negotiable?", "a": "An idempotent task produces the same end state no matter how many times it runs for the same interval — delete-insert its partition, MERGE by keys, overwrite its output file. Non-negotiable because retries, backfills, and manual reruns are routine; without idempotency every recovery duplicates data."}, {"n": 11, "q": "How do retries, retry_delay, exponential backoff, and SLAs work?", "a": "retries + retry_delay (with retry_exponential_backoff and max_delay) re-attempt failed tasks — absorbing transient failures (network, spot eviction). SLAs flag tasks exceeding expected duration triggering callbacks/alerts — detecting slowness, not just failure."}, {"n": 12, "q": "What are trigger rules (all_success, one_failed, all_done, none_failed_min_one_success) and use cases for each?", "a": "Trigger rules govern when a task runs given upstream states: all_success (default), one_failed (react to any failure — cleanup/alert), all_done (run regardless — teardown), none_failed_min_one_success (join after branching where skipped is acceptable). They enable failure handling and branch joins."}, {"n": 13, "q": "How do you implement branching (BranchPythonOperator / @task.branch)?", "a": "@task.branch (BranchPythonOperator) returns the task_id(s) to follow; unselected branches are skipped. Use for conditional paths — full vs incremental load by date, weekday vs weekend logic — pairing the join task with none_failed_min_one_success so skips don't block it."}, {"n": 14, "q": "What are Airflow variables and connections, and how do you manage secrets (secrets backends, Key Vault)?", "a": "Variables are global key-values for config; Connections store credentials/endpoints centrally (encrypted, referenced by conn_id). Back both with a secrets backend (Azure Key Vault, AWS Secrets Manager) so secrets live in the vault, never in code or the metadata DB unencrypted."}, {"n": 15, "q": "How do you parameterize DAG runs (params, dag_run.conf, templating)?", "a": "params define per-DAG defaults overridable at trigger time (validated, templated); dag_run.conf carries arbitrary JSON passed when triggering (API/UI) — read via context or templates. Together they let one DAG serve ad-hoc reprocessing with custom dates or scopes."}, {"n": 16, "q": "What is Jinja templating in Airflow and what are commonly templated fields ({{ ds }}, {{ data_interval_start }})?", "a": "Templated fields render Jinja before execution with context: {{ ds }} (interval start date), {{ data_interval_start/end }}, {{ params.x }}, macros for date math. Operators template specific fields (bash_command, sql) — enabling interval-aware SQL and paths without Python glue."}, {"n": 17, "q": "What executors exist (Sequential, Local, Celery, Kubernetes) and how do you choose?", "a": "SequentialExecutor: single task at a time (dev only). LocalExecutor: parallel processes on one machine — small deployments. CeleryExecutor: distributed workers via a broker — classic scale-out. KubernetesExecutor: a pod per task — elastic isolation, per-task resources/images. Choose by scale, isolation needs, and ops maturity."}, {"n": 18, "q": "What are pools, priority weights, and concurrency controls (max_active_runs, max_active_tasks, task concurrency)?", "a": "Pools cap concurrent tasks sharing a resource (e.g., 5 slots for the warehouse); priority_weight orders queued tasks; max_active_runs limits simultaneous DAG runs; max_active_tasks caps per-DAG concurrency; task-level concurrency limits a single task across runs — collectively preventing resource stampedes."}, {"n": 19, "q": "What are sensors' modes (poke vs reschedule) and deferrable operators — why do deferrables save resources?", "a": "Poke mode holds a worker slot while sleeping between checks (wasteful for long waits); reschedule frees the slot between pokes. Deferrable operators go further: they suspend to the triggerer's async event loop, occupying no worker at all while waiting — the efficient default for long waits on modern Airflow."}, {"n": 20, "q": "What are datasets / data-aware scheduling — triggering DAGs when upstream data updates rather than by time?", "a": "Datasets (assets) let a producer task declare outputs and consumer DAGs schedule on dataset updates instead of time — 'run when upstream data actually landed'. This replaces fragile time-offset scheduling and ExternalTaskSensors for data-driven dependencies."}, {"n": 21, "q": "How do you create dynamic tasks with dynamic task mapping (expand/partial)?", "a": "Dynamic task mapping creates task instances at runtime from data: process = transform.expand(file=list_files()) spawns one mapped task per file with partial() for fixed arguments — parallel fan-out sized by actual workload, visible individually in the UI."}, {"n": 22, "q": "What is the difference between dynamic task mapping and generating DAGs dynamically from config?", "a": "Dynamic task mapping varies task count per run from runtime data (files arrived today). Dynamically generating DAGs (loops over config creating DAG objects at parse time) varies structure per deployment — config-driven pipelines for many similar sources. Mapping is runtime; generation is parse-time."}, {"n": 23, "q": "How do you structure a repository of DAGs for a team (folder layout, shared libs, avoiding top-level heavy code)?", "a": "Repository layout: dags/ thin DAG definitions only, plugins or a proper installed package for shared operators/logic, separate requirements management, tests/ mirroring structure, per-environment config. Keep business logic out of DAG files — import it — so it's testable without Airflow."}, {"n": 24, "q": "Why is heavy computation in DAG-definition (top-level) code a problem for the scheduler?", "a": "The scheduler re-parses DAG files continuously; top-level code (API calls, DB queries, heavy imports) runs on every parse, throttling scheduling for the entire deployment. Keep module level to lightweight definitions; do work inside task callables; cache expensive dynamic config."}, {"n": 25, "q": "How do you test DAGs (dag.test(), unit-testing task callables, DAG integrity tests in CI)?", "a": "Testing layers: dag.test() executes a full DAG locally in-process for fast iteration; unit-test task callables as plain functions with mocks; DAG integrity tests in CI (import all DAGs, assert no cycles, required defaults like owner/retries, parse time budget) prevent broken deploys."}, {"n": 26, "q": "How do you deploy DAGs (git-sync, CI/CD pipelines, environments) and manage Airflow upgrades?", "a": "Deploy DAGs via CI/CD: merge to main triggers sync to the environment's DAG storage (git-sync sidecar, baked images, or managed-service buckets) after tests pass; environments get branches/directories; Airflow upgrades tested in staging with provider pinning — DAGs are software artifacts, not files edited on servers."}, {"n": 27, "q": "How do you monitor Airflow (task logs, Grafana/StatsD metrics, alerting via callbacks, on_failure_callback)?", "a": "Monitoring: task logs (remote logging to blob storage), metrics via StatsD/OpenTelemetry into Prometheus/Grafana (scheduler heartbeat, queue depth, task durations, DAG parse time), plus callbacks (on_failure_callback, SLA callbacks) driving alerts — watch platform health and pipeline outcomes separately."}, {"n": 28, "q": "How do you implement alerting to Slack/Teams/email on failures?", "a": "Failure alerting: on_failure_callback posting to Slack/Teams webhooks with task, run, log link; email_on_failure for simple setups; route by severity (critical DAGs page, others post to channel); include data-interval context so responders know what to rerun."}, {"n": 29, "q": "What happens when the scheduler goes down mid-run? How does Airflow recover state?", "a": "Task state lives in the metadata DB, so a scheduler restart resumes cleanly: running tasks continue (executor-dependent), queued work re-dispatches, and missed schedules are picked up. HA schedulers (multiple instances) remove the single point of failure."}, {"n": 30, "q": "What are zombie and orphaned tasks?", "a": "Zombies are tasks the DB thinks are running but whose process died without reporting (worker crash) — detected by missed heartbeats and failed/retried. Orphaned instances lost their supervising job. Both are recovered by scheduler cleanup; frequent zombies signal worker instability or resource exhaustion."}, {"n": 31, "q": "How do you handle long-running tasks vs Airflow's role as an orchestrator (submit-and-poll pattern, not doing the work in Airflow)?", "a": "Airflow orchestrates; heavy compute belongs on external engines. Pattern: submit work to Databricks/Spark/warehouse, then wait via deferrable polling — not running the transformation in the Airflow worker. Workers doing data processing couple pipeline scale to Airflow infrastructure and starve the scheduler."}, {"n": 32, "q": "How do you orchestrate Databricks from Airflow (Databricks operators, jobs API) and what are best practices?", "a": "Databricks orchestration: DatabricksRunNowOperator triggers predefined Jobs (preferred — job config lives in Databricks/bundles), DatabricksSubmitRunOperator submits ad-hoc runs; deferrable versions poll without workers; pass parameters per data interval; let Databricks own cluster config, Airflow own cross-system sequencing."}, {"n": 33, "q": "How do you orchestrate dbt from Airflow (BashOperator vs Cosmos vs dbt Cloud operator) — trade-offs?", "a": "dbt orchestration options: BashOperator running dbt build (simple, one opaque task), Cosmos (renders each dbt model as an Airflow task with per-model retries/visibility), or dbt Cloud operator (triggers Cloud jobs via API). Cosmos for granular observability; Bash for simplicity; Cloud operator when dbt Cloud owns execution."}, {"n": 34, "q": "How do you run containerized tasks (DockerOperator, KubernetesPodOperator) and why isolate dependencies?", "a": "DockerOperator/KubernetesPodOperator run tasks in containers with their own images — isolating conflicting Python dependencies per task, packaging non-Python tools, and giving per-task resource requests. The standard cure for 'this task needs pandas 2, that one needs 1.5'."}, {"n": 35, "q": "How do you pass artifacts between tasks properly (external storage + references, not XCom payloads)?", "a": "Pass artifacts by reference: write outputs to object storage/tables with interval-scoped deterministic paths (or push the path via XCom), downstream reads the reference. XCom carries coordinates, storage carries data — keeping the metadata DB lean and tasks replayable."}, {"n": 36, "q": "How do you design a DAG for a multi-source daily warehouse load with mixed dependencies and per-source failure isolation?", "a": "Multi-source design: one mapped/generated ingestion task group per source (isolated failures — one source failing doesn't block others), a join with none_failed_min_one_success or per-source datasets, transformation triggered on required sources' completion, per-source retries/alerts, and clear reprocessing per source via params."}, {"n": 37, "q": "What is the difference between depends_on_past and wait_for_downstream, and when are they needed?", "a": "depends_on_past blocks a task until its own previous-run instance succeeded — for cumulative/sequential loads. wait_for_downstream additionally requires the previous run's immediate downstream tasks done — stronger serialization. Both can silently stall DAGs after one failure; use sparingly and alert on stalls."}, {"n": 38, "q": "How do you version and evolve a DAG safely when task IDs or schedules change?", "a": "Evolving DAGs safely: changing a schedule affects future intervals (mind catchup); renaming task_ids orphans history (old instances no longer match); removing tasks loses their lineage. Prefer additive changes, keep task_ids stable, version significant rewrites as a new dag_id with a cutover, and document run semantics changes."}, {"n": 39, "q": "How do you implement cross-DAG dependencies (TriggerDagRunOperator, ExternalTaskSensor, datasets) and which do you prefer?", "a": "Cross-DAG options: TriggerDagRunOperator (push — parent explicitly triggers child, passing conf), ExternalTaskSensor (pull — child waits on parent's task/interval alignment, fragile with schedule mismatches), datasets (data-driven — child runs when the dataset updates). Prefer datasets for data dependencies; TriggerDagRun for command-style invocation."}, {"n": 40, "q": "What are common anti-patterns in Airflow (hardcoded dates, non-idempotent tasks, XCom abuse, monolithic DAGs)?", "a": "Anti-patterns: non-idempotent tasks (retries corrupt data), datetime.now() instead of interval dates (backfills break), XCom as a data bus, heavy top-level DAG code, monolithic single-task DAGs (no retry granularity), sensors in poke mode for hours, hardcoded credentials, and catchup=True surprises flooding runs on deploy."}, {"n": 41, "q": "How do managed offerings differ (MWAA, Cloud Composer, Astronomer) from self-hosting? What about Azure Data Factory as the 'similar tool'?", "a": "Managed Airflow (MWAA, Cloud Composer, Astronomer) removes infrastructure ops (scheduler HA, upgrades, scaling) at higher cost and some version/config lag. ADF is a different paradigm: visual, connector-rich, Azure-native — 'similar tool' as scheduler/orchestrator but weaker as code, testing, and dynamic workflows."}, {"n": 42, "q": "Compare Airflow to ADF/Fabric pipelines for orchestration — when would you pick each in an Azure shop?", "a": "In an Azure shop: ADF/Fabric pipelines win for connector-driven ingestion, managed simplicity, gateway access to on-prem, and low-code teams. Airflow wins for complex Python-defined dependencies, dynamic fan-out, cross-platform orchestration (Databricks + dbt + APIs + non-Azure), and software-engineering workflow (tests, PRs). Many estates run both: ADF ingests, Airflow orchestrates the analytical DAG."}, {"n": 43, "q": "Compare Airflow with newer orchestrators (Dagster, Prefect) at a concept level — assets vs tasks.", "a": "Dagster centers software-defined assets (declare the tables/files you produce; orchestration derives from asset lineage) with strong typing/testing; Prefect emphasizes dynamic Pythonic flows with minimal boilerplate. Airflow remains the ecosystem/operator standard, converging on their ideas via datasets and versioned DAGs."}, {"n": 44, "q": "What changed conceptually in Airflow 2.x → 3.x that you're aware of (API-based task execution, UI, versioned DAGs)?", "a": "Airflow 3 headlines: DAG versioning (runs remember the code version that produced them), a rebuilt UI, task execution via a stable Task API enabling remote/edge workers and stronger isolation, scheduler-driven backfills, and removal of legacy paths (SubDAGs, direct DB access from workers)."}, {"n": 45, "q": "How do you secure Airflow (RBAC, roles, restricting connections editing, audit)?", "a": "Securing Airflow: RBAC roles scoping UI/API access, secrets in an external backend not the metadata DB, restricting connection edit rights, remote logs with access control, network isolation for the webserver, audit logs for admin actions, and no credentials in DAG code or Variables plaintext."}, {"n": 46, "q": "How do you implement a 'rerun from failure point' operationally (clearing task instances, downstream/upstream clearing)?", "a": "Rerun from failure: clear the failed task instance (with downstream) so the scheduler re-executes just that subtree for the interval — idempotent tasks make this safe; 'Clear' with upstream/downstream/future flags controls scope. This surgical recovery is a core reason task granularity matters."}, {"n": 47, "q": "How do you handle timezone-aware scheduling correctly?", "a": "Schedules honor the DAG's timezone if start_date is timezone-aware (pendulum.timezone('Asia/Dubai')) — cron fires in that zone including DST shifts; internally Airflow stores UTC. Never mix naive datetimes; explicitly choose whether business schedules follow local civil time or UTC."}, {"n": 48, "q": "How do you throttle calls to a rate-limited API across many mapped tasks (pools, concurrency)?", "a": "Throttle API-bound mapped tasks with a dedicated pool sized to the rate limit (e.g., 3 slots), optionally max_active_tis_per_dag on the mapped task, client-side rate limiting/backoff inside the callable honoring Retry-After — pool caps concurrency, code handles per-call pacing."}, {"n": 49, "q": "Design an orchestration for: ingest 20 sources hourly, run dbt on completion of all, refresh a Power BI dataset, and alert on any SLA breach.", "a": "Design: 20 mapped/generated ingestion task groups (per-source isolation, retries, dataset outputs) on an hourly schedule; dbt build triggered by dataset completion of all sources (or a join task with none_failed rule) running via Cosmos; on dbt success, a task calls the Power BI/Fabric API to refresh the dataset and polls completion; SLA callbacks and on_failure_callbacks route to Teams with run context; per-source reprocessing exposed via params."}, {"n": 50, "q": "A daily DAG has been silently succeeding but loading zero rows for a week. What guardrails were missing, and how do you add them (row-count checks, data quality gates, anomaly alerts)?", "a": "Missing guardrails: success meant 'task exited 0', not 'data arrived'. Add data-aware checks: post-load row-count/volume assertions vs expected ranges (fail the task on zero rows), source freshness checks before transforming, dbt tests gating downstream, anomaly alerts on volume trends, and dashboard-level freshness SLAs — redefining success as verified data, not exit codes."}]}, {"id": "bestpractices", "name": "Data Engineering Best Practices", "questions": [{"n": 1, "q": "What is the difference between ETL and ELT, and why has ELT become dominant with cloud warehouses/lakehouses?", "a": "ETL transforms before loading (external engine, e.g., Informatica/SSIS); ELT loads raw data first and transforms inside the warehouse/lakehouse. ELT won because cloud engines scale transformation compute cheaply, raw retention enables reprocessing with new logic, and SQL/dbt-based transformation is more accessible and versionable."}, {"n": 2, "q": "Explain medallion architecture (Bronze/Silver/Gold). What contracts and guarantees does each layer provide?", "a": "Bronze: raw, append-only, source-faithful — the replayable system of record. Silver: cleaned, deduplicated, conformed types and keys — trustworthy entity-level data. Gold: business-level aggregates and dimensional models — consumption contracts. Each layer guarantees progressively stronger quality, letting consumers pick the right trust level and engineers reprocess from raw."}, {"n": 3, "q": "What is idempotency in pipelines and what patterns achieve it (overwrite-by-partition, merge on keys, run IDs)?", "a": "An idempotent pipeline yields the same end state however many times it runs for the same input window. Patterns: overwrite the target partition per run (replaceWhere), MERGE on business keys, delete-then-insert scoped to the load window, exactly-once file tracking (Auto Loader), and run-ID-keyed side effects. Idempotency turns retries and backfills from risks into routine."}, {"n": 4, "q": "What is exactly-once vs at-least-once processing, and how do you achieve effective exactly-once in batch pipelines?", "a": "At-least-once delivery means duplicates are possible; exactly-once means each record affects state once. In batch, achieve effective exactly-once by combining at-least-once execution with idempotent writes (MERGE by key, partition overwrite) — the transport may duplicate, but the sink converges."}, {"n": 5, "q": "How do you design incremental loads: watermarks, CDC, change data feeds, and handling late-arriving data?", "a": "Incremental design: track a high-water mark (max updated_at/ID) in a control table, extract rows beyond it, MERGE into the target, update the watermark transactionally on success. Handle late arrivals with a lookback window (reprocess last N days) or CDC; never trust event time alone for completeness."}, {"n": 6, "q": "What is Change Data Capture (CDC)? Compare log-based CDC, trigger-based, and timestamp-based approaches.", "a": "CDC captures source changes rather than re-extracting snapshots. Log-based (Debezium, native replication) reads the transaction log — low impact, complete, ordered; trigger-based writes change tables via triggers — invasive, adds load; timestamp-based queries modified_at — simple but misses hard deletes and untimestamped updates. Prefer log-based when available."}, {"n": 7, "q": "How do you handle schema evolution and schema drift from sources without breaking downstream consumers?", "a": "Handle schema drift by contract: additive columns flow through automatically (mergeSchema, rescued-data columns), breaking changes (drops/renames/type changes) are caught by schema validation at ingestion and quarantined pending review; versioned schemas and comms with source owners prevent silent breakage downstream."}, {"n": 8, "q": "What are data contracts and how do they formalize producer/consumer expectations?", "a": "Data contracts are explicit, machine-checkable agreements between producers and consumers: schema, types, constraints, semantics, SLAs, ownership. Enforced via schema registries, dbt model contracts, or CI checks — moving breakage detection from downstream dashboards to producer build time."}, {"n": 9, "q": "What is data modeling for analytics: Kimball dimensional modeling vs Inmon vs Data Vault — when does each fit?", "a": "Kimball: dimensional star schemas built incrementally per business process — the analytics default. Inmon: normalized enterprise warehouse first, marts derived — strong governance, heavier upfront. Data Vault: hubs/links/satellites for auditability and parallel loading in volatile multi-source environments — at query complexity cost. Most lakehouses run Kimball Gold over Vault-ish or raw Silver."}, {"n": 10, "q": "Explain facts and dimensions, grain declaration, conformed dimensions, and why grain mistakes are the root of most BI bugs.", "a": "Facts record measurable events at a declared grain; dimensions give descriptive context. Declaring grain ('one row per shipment charge line') is the single most important modeling act — aggregations, joins, and tests all depend on it. Conformed dimensions (shared dim_customer) make facts comparable across marts. Most BI bugs trace to undeclared or violated grain."}, {"n": 11, "q": "How do you implement SCD Types 0/1/2/3 and choose between them?", "a": "SCD0: never changes. SCD1: overwrite — no history, for corrections. SCD2: new row per change with effective dates/current flag — full history, the analytics default for slowly changing attributes. SCD3: previous-value columns — limited history for specific comparisons. Choose per attribute based on whether history has analytical value."}, {"n": 12, "q": "What is the 'one big table' (OBT) approach vs star schema — trade-offs for modern engines and BI tools?", "a": "OBT denormalizes everything into one wide table — simple for consumers and fast on columnar engines, but duplicates dimension updates, obscures grain, and bloats with many-to-many. Star schemas keep reusable conformed dimensions and clear grain. Pragmatic answer: star schema as the governed core; OBT views generated from it for specific consumers."}, {"n": 13, "q": "What dimensions of data quality do you test (completeness, uniqueness, validity, consistency, timeliness, accuracy)?", "a": "Quality dimensions: completeness (nulls, missing rows vs control totals), uniqueness (key duplicates), validity (domains, formats, ranges), consistency (cross-field and cross-system agreement), timeliness (freshness vs SLA), accuracy (agreement with reality — hardest, via reconciliation). Test each explicitly rather than assuming 'no errors = good data'."}, {"n": 14, "q": "How do you implement data quality gates in pipelines (fail vs quarantine vs warn) and where in the flow?", "a": "Place gates at layer boundaries: ingestion checks (schema, counts) before Bronze→Silver, business rules before Silver→Gold. Fail the pipeline for contract-critical breaches; quarantine bad rows and continue for isolated record issues (with counts alerted); warn for informational drift. Every gate logs metrics — silent gates are no gates."}, {"n": 15, "q": "What tools/frameworks support data quality (Great Expectations, dbt tests, DLT expectations, custom asserts)?", "a": "Frameworks: dbt tests (SQL assertions in the transformation DAG), Great Expectations/pandera (declarative suites for Python pipelines), DLT expectations (inline lakehouse enforcement), plus custom assert-and-log notebooks. Choose what lives closest to where the data is transformed so failures block promotion."}, {"n": 16, "q": "What is data observability (freshness, volume, schema, lineage, distribution monitoring) and how does it differ from testing?", "a": "Observability monitors data health continuously in production — freshness, volume anomalies, schema changes, distribution drift, lineage — typically via metadata rather than explicit rules (Monte Carlo-style). Testing asserts known expectations at build time; observability catches unknown-unknowns after deployment. Mature platforms need both."}, {"n": 17, "q": "How do you design pipeline monitoring and alerting so on-call gets signal, not noise?", "a": "Design alerting by severity and actionability: page only for consumer-impacting failures (SLA breach, prod pipeline down), route degradation warnings to channels, digest informational drift. Every alert needs an owner and a runbook link; alerts nobody acts on get deleted — alert fatigue is a reliability failure itself."}, {"n": 18, "q": "What is data lineage and why does it matter for impact analysis and debugging?", "a": "Lineage maps data flow from source to consumption at table/column level. It answers impact analysis ('what breaks if I change this column'), root-cause ('which upstream feed corrupted this KPI'), and compliance ('where does PII propagate'). Captured automatically by Unity Catalog/Purview/dbt, it turns tribal knowledge into queryable metadata."}, {"n": 19, "q": "What is a data catalog and how do governance tools (Purview, Unity Catalog, Collibra, Informatica EDC/Axon) fit the stack?", "a": "A catalog inventories datasets with ownership, descriptions, classifications, and lineage for discovery and governance. Purview scans and classifies the Azure estate; Unity Catalog governs the lakehouse natively; Collibra/Informatica EDC+Axon add enterprise stewardship workflows and business glossaries — the catalog is where trust and findability live."}, {"n": 20, "q": "How do you handle PII: classification, masking, tokenization, encryption at rest/in transit, and right-to-be-forgotten?", "a": "PII handling: classify at ingestion (tags/sensitivity labels), minimize collection, mask or tokenize in non-prod and analytics layers (dynamic masking, hashing with salt), encrypt at rest and in transit, restrict via column/row security, log access, and design deletion paths (right-to-be-forgotten) including time-travel/backup purge."}, {"n": 21, "q": "What is the principle of least privilege applied to data platforms?", "a": "Least privilege: every principal gets the minimum access to do its job — service principals scoped per pipeline to specific containers/schemas, analysts read Gold not Bronze, no shared admin accounts, time-boxed elevated access. Blast radius of any compromised credential stays small."}, {"n": 22, "q": "How do you version control everything (SQL, notebooks, infra, configs) and why are notebooks-only workflows risky?", "a": "Version control everything that defines the platform: SQL/dbt models, notebook source, pipeline definitions (as code/JSON), infra (Terraform/Bicep), configs, and even grants. Notebook-only workflows without Git mean no review, no rollback, no reproducibility — 'the pipeline is whatever is currently saved in prod' is an incident waiting."}, {"n": 23, "q": "What does CI/CD look like for data pipelines — what do you actually test in CI?", "a": "Data CI: lint (SQLFluff), unit tests on transformation logic with fixtures, DAG/import integrity, schema contract validation, and slim builds of changed models against a CI environment with tests. CD: automated deploy to staging, integration run on sample data, gated prod promotion. You test logic and contracts in CI; full-data validation happens post-deploy via monitoring."}, {"n": 24, "q": "What is infrastructure as code (Terraform/Bicep) and why should data platforms be reproducible?", "a": "IaC (Terraform/Bicep) declares workspaces, storage, clusters, and permissions as reviewed, versioned code — environments become reproducible (spin up identical test), auditable (who changed what), and recoverable (rebuild from code). Click-ops platforms drift and can't be trusted to match documentation."}, {"n": 25, "q": "How do you manage
